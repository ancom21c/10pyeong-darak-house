<script>
"use strict";
/* ================= 데이터: 도면 해석 (mm, 원점=외곽 북서 모서리, x→동, y→남) ================= */
const EXT=8000, DEP=4500, WT=100, FLOOR_H=2600;   // 전면폭 8,000 (7,400→8,000 볼펜 수정), 깊이 4,500

};
const ROOMS=[
 {id:"r1", n:"방1", p:[[100,100],[2700,2200]], f:"wood"},
 {id:"r2", n:"방2", p:[[2800,100],[4800,2200]], f:"wood"},
 {id:"r3", n:"방3", p:[[4900,100],[7900,2200]], f:"wood"},
 {id:"kt", n:"주방", p:[[100,2300],[2700,4400]], f:"tile"},
 {id:"lv", n:"거실", p:[[2800,2300],[4800,4400],[4900,2300],[5900,4400]], multi:[[2800,2300,4800,4400],[4900,2300,5900,4400]], f:"wood"},
 {id:"bt", n:"화장실", p:[[6000,2300],[7000,3400]], f:"tile"},
 {id:"r4", n:"방4", p:[[7100,2300],[7900,2300],[7900,4400],[6000,4400],[6000,3500],[7100,3500]], f:"wood"},
 {id:"at", n:"다락방(증축 3,000×3,300 포함)", attic:1, p:[[4900,100],[7900,100],[7900,4400],[4900,4400]], wing:[[8000,100],[11000,100],[11000,3400],[8000,3400]], f:"wood"}
];
/* 벽: [x1,y1,x2,y2, 두께, 내력벽?, 개구목록]  개구: {a:(축따라 시작),b:(끝),type:'door'|'win'|'pass', out?:바깥여는 문} */
const WALLS=[
 {x1:0,y1:0,x2:8000,y2:100,lb:1,op:[{a:700,b:2100,t:"win"},{a:3200,b:4400,t:"win"},{a:5500,b:7300,t:"win"}]},                       // 북
 {x1:0,y1:4400,x2:8000,y2:4500,lb:1,op:[{a:3600,b:4500,t:"door",in:1},{a:400,b:1200,t:"door"},{a:1600,b:2500,t:"win"},{a:6500,b:7700,t:"win"}]}, // 남
 {x1:0,y1:100,x2:100,y2:4400,lb:1,op:[{a:2600,b:4100,t:"win"}]},                                                                    // 서
 {x1:7900,y1:100,x2:8000,y2:4400,lb:1,op:[{a:500,b:1800,t:"win"},{a:2600,b:4100,t:"win"}]},                                         // 동
 {x1:2700,y1:100,x2:2800,y2:4400,lb:1,op:[]},                                                                                       // V1 내력
 {x1:4800,y1:100,x2:4900,y2:4400,lb:1,op:[{a:2900,b:3600,t:"pass"}]},                                                               // V2 내력(홀 통로)
 {x1:100,y1:2200,x2:7900,y2:2300,lb:1,op:[{a:1700,b:2600,t:"door",in:1},{a:3200,b:4100,t:"door",in:1},{a:5000,b:5800,t:"door",in:1}]},// H1 내력
 {x1:5900,y1:2300,x2:6000,y2:4400,lb:0,op:[{a:2600,b:3300,t:"door",in:1},{a:3600,b:4300,t:"door",in:1}]},                            // 화장실/방4 서
 {x1:7000,y1:2300,x2:7100,y2:3500,lb:0,op:[]},                                                                                      // 방4 동측 칸막이
 {x1:6000,y1:3400,x2:7100,y2:3500,lb:0,op:[]}                                                                                       // 화장실 남
];
const AT_WING={x1:8000,y1:0,x2:11000,y2:3500,op:[{a:800,b:2600,t:"win"}], lbE:1}; // 다락 증축 (동쪽, 3,000×3,300)
/* 가구 기본 배치 (실치수 mm) */
const FURN_DEF=[
 {id:"sofa", t:"소파", w:1900,d:850,h:800, x:3850,y:3975, r:0, fl:0, c:"#7a8aa0"},
 {id:"tbl",  t:"커피 테이블", w:1100,d:550,h:420, x:3850,y:2950, r:0, fl:0, c:"#a9825a"},
 {id:"tvc",  t:"TV장", w:1400,d:400,h:450, x:3850,y:2520, r:0, fl:0, c:"#5d4a38"},
 {id:"sink", t:"싱크대", w:1800,d:600,h:850, x:1500,y:2620, r:0, fl:0, c:"#c9c9c9"},
 {id:"frg",  t:"냉장고", w:700,d:700,h:1800, x:480,y:4020, r:0, fl:0, c:"#e8e8e8"},
 {id:"dtab", t:"식탁", w:1400,d:800,h:750, x:1750,y:3600, r:0, fl:0, c:"#9a6b43"},
 {id:"ch1",  t:"의자", w:450,d:450,h:850, x:1300,y:3600, r:90, fl:0, c:"#8a6a4a"},
 {id:"ch2",  t:"의자", w:450,d:450,h:850, x:2200,y:3600, r:90, fl:0, c:"#8a6a4a"},
 {id:"ch3",  t:"의자", w:450,d:450,h:850, x:1750,y:3180, r:0, fl:0, c:"#8a6a4a"},
 {id:"ch4",  t:"의자", w:450,d:450,h:850, x:1750,y:4020, r:180, fl:0, c:"#8a6a4a"},
 {id:"bed2", t:"침대", w:1400,d:1900,h:500, x:3500,y:1250, r:0, fl:0, c:"#b9c4cf"},
 {id:"ns2",  t:"협탁", w:450,d:450,h:500, x:4450,y:700, r:0, fl:0, c:"#9a6b43"},
 {id:"bed3", t:"침대", w:1600,d:1900,h:500, x:6100,y:1250, r:0, fl:0, c:"#b9c4cf"},
 {id:"wdr3", t:"옷장", w:1200,d:550,h:1900, x:7300,y:1700, r:90, fl:0, c:"#8a6a4a"},
 {id:"bed4", t:"침대", w:1000,d:1800,h:500, x:7350,y:3950, r:90, fl:0, c:"#b9c4cf"},
 {id:"wc",   t:"변기", w:400,d:650,h:400, x:6300,y:2650, r:90, fl:0, c:"#f2f2f2"},
 {id:"bv",   t:"세면대", w:550,d:450,h:800, x:6300,y:3200, r:90, fl:0, c:"#f2f2f2"},
 {id:"desk1",t:"책상", w:1200,d:600,h:750, x:1500,y:1750, r:0, fl:0, c:"#9a6b43"},
 {id:"bsh1", t:"책장", w:900,d:300,h:1800, x:250,y:1500, r:90, fl:0, c:"#8a6a4a"},
 {id:"matt", t:"매트리스", w:1400,d:2000,h:300, x:9500,y:1750, r:0, fl:1, c:"#d9cbb8"},
 {id:"ltb",  t:"좌테이블", w:700,d:500,h:350, x:9500,y:2900, r:0, fl:1, c:"#7a5c3e"}
];
const PALETTE=[["소파",1900,850,800,"#7a8aa0"],["침대",1400,1900,500,"#b9c4cf"],["책상",1200,600,750,"#9a6b43"],["의자",450,450,850,"#8a6a4a"],["옷장",1200,550,1900,"#8a6a4a"],["책장",900,300,1800,"#8a6a4a"],["식탁",1400,800,750,"#9a6b43"],["냉장고",700,700,1800,"#e8e8e8"],["화분",400,400,900,"#6d8f5a"]];

/* ================= 상태 ================= */
const S={furn:JSON.parse(JSON.stringify(FURN_DEF)), walls:JSON.parse(JSON.stringify(WALLS)), mats:{}, removed:{}, floor:0, tool:"sel", sel:-1, hist:[], redo:[], mode:"2d"};
ROOMS.forEach(r=>S.mats[r.id]=r.f);
const polyArea=p=>{ let s=0; for(let i=0;i<p.length;i++){ const a=p[i],b=p[(i+1)%p.length]; s+=a[0]*b[1]-b[0]*a[1]; } return Math.abs(s)/2/1e6; };
const roomArea=r=>{ if(r.multi){return r.multi.reduce((s,[a,b,c,d])=>s+(c-a)*(d-b),0)/1e6;}
  if(r.wing){const p=r.p,w=r.wing; return ((p[1][0]-p[0][0])*(p[1][1]-p[2][1]) + (w[1][0]-w[0][0])*(w[1][1]-w[2][1]))/1e6;}
  if(r.p.length>2)return polyArea(r.p);
  return (r.p[1][0]-r.p[0][0])*(r.p[1][1]-r.p[0][1])/1e6; };

/* ================= 2D SVG ================= */
const NS="http://www.w3.org/2000/svg";
const plane=document.getElementById("plane");
let svg, gFurn, gDim, gMeas, gLab, view={s:.12,tx:0,ty:0};
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function buildSVG(){
  svg=el("svg",{viewBox:"-600 -500 9200 5600",width:"100%",height:"100%",style:"touch-action:none"});
  plane.appendChild(svg);
  const defs=el("defs",{});
  defs.innerHTML=`<pattern id="pwood" width="240" height="60" patternUnits="userSpaceOnUse"><rect width="240" height="60" fill="#c89f6e"/><path d="M0 20h240M0 40h240" stroke="#b78c5c" stroke-width="3"/></pattern>
  <pattern id="ptile" width="200" height="200" patternUnits="userSpaceOnUse"><rect width="200" height="200" fill="#cfd6d4"/><path d="M0 0h200M0 100h200M0 200h200M100 0v200" stroke="#b9c2bf" stroke-width="3" fill="none"/></pattern>
  <pattern id="pvinyl" width="160" height="160" patternUnits="userSpaceOnUse"><rect width="160" height="160" fill="#d8cdb8"/><circle cx="80" cy="80" r="34" fill="#cdc2aa"/></pattern>
  <pattern id="pconcrete" width="180" height="180" patternUnits="userSpaceOnUse"><rect width="180" height="180" fill="#b9b5ad"/><path d="M0 90h180M90 0v180" stroke="#aaa69e" stroke-width="2"/></pattern>
  <pattern id="pdeck" width="120" height="48" patternUnits="userSpaceOnUse"><rect width="120" height="48" fill="#a97e4f"/><path d="M0 24h120" stroke="#96703f" stroke-width="3"/></pattern>
  <pattern id="pvoid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M0 60L60 0" stroke="#b9a98e" stroke-width="3"/></pattern>
  <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 5L10 5M5 0L5 10" stroke="#8a8174" stroke-width="1.6"/></marker>`;
  svg.appendChild(defs);
  svg.appendChild(el("g",{id:"gRooms"}));
  svg.appendChild(el("g",{id:"gWalls"}));
  gFurn=el("g",{id:"gFurn"}); svg.appendChild(gFurn);
  gLab=el("g",{id:"gLab","pointer-events":"none"}); svg.appendChild(gLab);
  gDim=el("g",{id:"gDim"}); svg.appendChild(gDim);
  gMeas=el("g",{id:"gMeas"}); svg.appendChild(gMeas);
  svg.addEventListener("pointerdown",pDown);
  svg.addEventListener("pointermove",pMove);
  svg.addEventListener("pointerup",pUp);
  svg.addEventListener("wheel",e=>{e.preventDefault();const k=e.deltaY<0?1.12:.89;zoomAt(e,k);},{passive:false});
}
function pt(e){const r=svg.getBoundingClientRect();const vb=svg.viewBox.baseVal;
  return {x:vb.x+(e.clientX-r.left)/r.width*vb.width, y:vb.y+(e.clientY-r.top)/r.height*vb.height};}
function zoomAt(e,k){const p=pt(e),vb=svg.viewBox.baseVal;
  vb.x=p.x-(p.x-vb.x)*k; vb.y=p.y-(p.y-vb.y)*k; vb.width*=k; vb.height*=k;}
function wRectPath(w){ // 벽 rect, 개구 처리된 세그먼트들
  const horiz=w.y2-w.y1<w.x2-w.x1; const segs=[]; let cur=w.x1;
  const ops=[...w.op].sort((a,b)=>a.a-b.a);
  for(const o of ops){ if(o.a>cur) segs.push(horiz?[cur,w.x1, o.a,w.x2]:[w.y1,cur,o.y1,0]); cur=o.b; }
  return {horiz,segs,end:cur};
}
function drawWalls(){
  const g=svg.querySelector("#gWalls"); g.innerHTML="";
  S.walls.forEach((w,i)=>{
    if(S.removed[i])return;
    const horiz=(w.y2-w.y1)<(w.x2-w.x1);
    const L=w.lb? 3.2:1.4, col=w.lb?"#5a4632":"#b9a98e";
    const ops=[...w.op].sort((a,b)=>a.a-b.a); let cur=horiz?w.x1:w.y1;
    const draw=(a,b)=>{ if(b-a<=1)return;
      if(horiz) g.appendChild(el("rect",{x:a,y:w.y1,width:b-a,height:w.y2-w.y1,fill:col,stroke:"#4a3a28","stroke-width":L*.4}));
      else g.appendChild(el("rect",{x:w.x1,y:a,width:w.x2-w.x1,height:b-a,fill:col,stroke:"#4a3a28","stroke-width":L*.4}));
    };
    for(const o of ops){ draw(cur,o.a); cur=o.b;
      // 개구 심볼
      const mid=(o.a+o.b)/2, wd=o.b-o.a;

let drag=null, measuring=null, measures=[];
function pDown(e){
  const p=pt(e);

  const t=e.target;
  if(S.tool==="wall"){ const wi=t.getAttribute&&t.getAttribute("data-wall");
    if(wi!=null){ const w=S.walls[+wi];
      if(w.lb){ toast("내력벽은 철거할 수 없습니다 (구조 안전)"); }
      else { pushHist(); S.removed[wi]=!S.removed[wi]; render2D(); sync3D(); toast(S.removed[wi]?"비내력벽을 철거했습니다":"벽을 복원했습니다"); } }
    return; }
  if(S.tool==="add"&&pendingAdd){ pushHist();
    const f={...pendingAdd,x:Math.round(p.x),y:Math.round(p.y),r:0,fl:S.floor}; delete f.pn;
    S.furn.push(f); S.sel=S.furn.length-1; pendingAdd=null; setTool("sel"); render2D(); sync3D(); return; }
  if(S.tool!=="sel")return;
  let node=t, fi=null;
  while(node&&node!==svg){ const v=node.getAttribute&&node.getAttribute("data-f"); if(v!=null){fi=v;break;} node=node.parentNode; }
  if(fi!=null){ S.sel=+fi; const f=S.furn[S.sel];
    drag={i:S.sel,dx:p.x-f.x,dy:p.y-f.y,moved:false}; pushHist(); svg.setPointerCapture(e.pointerId); }
  else { S.sel=-1; render2D(); }
  renderSide();
}

/* ================= 3D (Three.js, ES module) ================= */
let T3={inited:false};
function load3DLibs(){
  if(window.THREE&&window.OrbitControls)return Promise.resolve();
  return new Promise((res,rej)=>{
    const m=document.createElement("script"); m.type="module";
    m.textContent=`import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';window.THREE=THREE;window.OrbitControls=OrbitControls;window.dispatchEvent(new Event('t3ready'));`;
    m.onerror=()=>rej(new Error("Three.js CDN 로드 실패"));
    window.addEventListener("t3ready",()=>res(),{once:true});
    document.head.appendChild(m);
  });
}
async function ensure3D(){
  if(T3.inited){ if(!T3.renderer)build3D(); return; }
  await load3DLibs(); T3.inited=true; build3D();
}
const M2=1000; // mm→m
function wallMeshes(){ // 벽 → 박스들(개구 포함), {x,z,w,d,h,y}
  const out=[];
  S.walls.forEach((w,i)=>{ if(S.removed[i])return;
    const horiz=(w.y2-w.y1)<(w.x2-w.x1);
    const segs=[]; let cur=horiz?w.x1:w.y1;
    [...w.op].sort((a,b)=>a.a-b.a).forEach(o=>{ segs.push({a:cur,b:o.a,op:null});
      segs.push({a:o.a,b:o.b,op:o}); cur=o.b; });
    segs.push({a:cur,b:horiz?w.x2:w.y2,op:null});
    segs.forEach(sg=>{ const len=sg.b-sg.a; if(len<=1)return;
      if(!sg.op){ out.push(horiz?{x:(sg.a+sg.b)/2,z:(w.y1+w.y2)/2,w:len,d:w.y2-w.y1,h:FLOOR_H,y:0,lb:w.lb}
                                :{x:(w.x1+w.x2)/2,z:(sg.a+sg.b)/2,w:w.x2-w.x1,d:len,h:FLOOR_H,y:0,lb:w.lb}); }
      else if(sg.op.t==="win"){ const oh=1200,sy=900;
        out.push(horiz?{x:(sg.a+sg.b)/2,z:(w.y1+w.y2)/2,w:len,d:w.y2-w.y1,h:sy,y:0,lb:w.lb}:{x:(w.x1+w.x2)/2,z:(sg.a+sg.b)/2,w:w.x2-w.x1,d:len,h:sy,y:0,lb:w.lb});
        out.push(horiz?{x:(sg.a+sg.b)/2,z:(w.y1+w.y2)/2,w:len,d:w.y2-w.y1,h:FLOOR_H-sy-oh,y:sy+oh,lb:w.lb}:{x:(w.x1+w.x2)/2,z:(sg.a+sg.b)/2,w:w.x2-w.x1,d:len,h:FLOOR_H-sy-oh,y:sy+oh,lb:w.lb});
      } else if(sg.op.t==="door"){ const dh=2100;
        out.push(horiz?{x:(sg.a+sg.b)/2,z:(w.y1+w.y2)/2,w:len,d:w.y2-w.y1,h:FLOOR_H-dh,y:dh,lb:w.lb}:{x:(w.x1+w.x2)/2,z:(sg.a+sg.b)/2,w:w.x2-w.x1,d:len,h:FLOOR_H-dh,y:dh,lb:w.lb});
      } /* pass: 전체 개방 */ });
  });
  return out;
}
function build3D(){
  const cont=document.getElementById("view3d");
  const W2=cont.clientWidth||800, H2=cont.clientHeight||600;
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(W2,H2); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  cont.insertBefore(renderer.domElement,cont.firstChild);
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdce8f0);
  scene.fog=new THREE.Fog(0xdce8f0,60,160);
  const cam=new THREE.PerspectiveCamera(50,W2/H2,.1,400);
  cam.position.set(11,10,11);
  const controls=new (window.OrbitControls||THREE.OrbitControls)(cam,renderer.domElement);
  controls.target.set(4.5,1.2,2.2); controls.enableDamping=true; controls.maxPolarAngle=Math.PI/2.05;
  // 조명
  const hemi=new THREE.HemisphereLight(0xeaf2ff,0x9a8a70,.9); scene.add(hemi);
  const sun=new THREE.DirectionalLight(0xffeecc,1.6); sun.position.set(18,22,10);
  sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16}); scene.add(sun);
  // 바닥(대지)
  const ground=new THREE.Mesh(new THREE.CircleGeometry(70,48),new THREE.MeshLambertMaterial({color:0x93a86b}));
  ground.rotation.x=-Math.PI/2; ground.position.set(5.5,-.02,2.2); ground.receiveShadow=true; scene.add(ground);
  const pad=new THREE.Mesh(new THREE.BoxGeometry(17,.3,13),new THREE.MeshLambertMaterial({color:0xbcae92}));
  pad.position.set(4.7,-.15,2.25); pad.receiveShadow=true; scene.add(pad);
  const g3=new THREE.Group(); scene.add(g3);
  T3={inited:true,renderer,scene,cam,controls,g3,fp:{fl:0,pos:new THREE.Vector3(4,1.6,3.8),yaw:0},mode:"orbit"};
  rebuildHouse(); bind3DLoop();
}
function rebuildHouse(){
  const g=T3.g3; while(g.children.length)g.remove(g.children[0]);
  const matWall=new THREE.MeshLambertMaterial({color:0xe6ddcc});
  const matLB=new THREE.MeshLambertMaterial({color:0xcfc4ae});
  const matGlass=new THREE.MeshLambertMaterial({color:0x9fc4d8,transparent:true,opacity:.5});
  const matDoor=new THREE.MeshLambertMaterial({color:0x6b4a2e});
  const box=(o,mat)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(o.w/M2,o.h/M2,o.d/M2),mat||matWall);
    m.position.set(o.x/M2,(o.y||0)/M2+o.h/M2/2,o.z/M2); m.castShadow=m.receiveShadow=true; g.add(m); return m; };
  wallMeshes().forEach(o=>box(o,o.lb?matLB:matWall));
  // 창 유리 + 문짝
  S.walls.forEach((w,i)=>{ if(S.removed[i])return;
    const horiz=(w.y2-w.y1)<(w.x2-w.x1);
    w.op.forEach(o=>{ const mid=(o.a+o.b)/2, wd=o.b-o.a;
      if(o.t==="win"){ const m=horiz? new THREE.Mesh(new THREE.BoxGeometry(wd/M2-0.02,1.2/M2,(w.y2-w.y1)/M2-0.06),matGlass)
                                  : new THREE.Mesh(new THREE.BoxGeometry((w.x2-w.x1)/M2-0.06,1.2/M2,wd/M2-0.02),matGlass);
        m.position.set(horiz?mid/M2:(w.x1+w.x2)/2/M2, (900+600)/M2, horiz?(w.y1+w.y2)/2/M2:mid/M2); g.add(m);
      } else if(o.t==="door"){ const m=horiz? new THREE.Mesh(new THREE.BoxGeometry(wd/M2-0.04,2.0/M2,0.05),matDoor)
                                          : new THREE.Mesh(new THREE.BoxGeometry(0.05,2.0/M2,wd/M2-0.04),matDoor);
        m.position.set(horiz?mid/M2:(w.x1+w.x2)/2/M2, 1.0, horiz?(w.y1+w.y2)/2/M2:mid/M2);
        m.rotation.y=horiz?0.5:0.5; m.castShadow=true; g.add(m); } });
  });
  // 1F 바닥
  const fl1=new THREE.Mesh(new THREE.BoxGeometry(8,.12,4.5),new THREE.MeshLambertMaterial({color:0xc8b597}));
  fl1.position.set(4,.06,2.25); fl1.receiveShadow=true; g.add(fl1);
  // 다락 슬라브(계단 구멍 제외) + 증축 윙 슬라브
  const slabMat=new THREE.MeshLambertMaterial({color:0xd8ccb4});
  const mkSlab=(x1,z1,x2,z2)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry((x2-x1)/M2,.15,(z2-z1)/M2),slabMat);
    m.position.set((x1+x2)/2/M2,2.6,(z1+z2)/2/M2); m.castShadow=m.receiveShadow=true; g.add(m); };
  mkSlab(4900,100,7900,2300); mkSlab(5900,2300,7900,4400); mkSlab(4900,3000,5900,4400); mkSlab(8000,100,11000,3400);
  // 계단 (12단, 홀 x4.95~5.85, 남→북 상승)
  const steps=12, rise=2600/steps, run=2000/steps;
  for(let i=0;i<steps;i++){ const m=new THREE.Mesh(new THREE.BoxGeometry(.9,rise/M2,.2),new THREE.MeshLambertMaterial({color:0x9a7b55}));
    m.position.set(5.4,(i+.5)*rise/M2,4.3-((i+.5)*run)/M2); m.castShadow=m.receiveShadow=true; g.add(m); }
  // 난간(보이드 가장자리)
  const railMat=new THREE.MeshLambertMaterial({color:0x8a5a34});
  const rail=(x1,z1,x2,z2)=>{ const len=Math.hypot(x2-x1,z2-z1);
    const m=new THREE.Mesh(new THREE.BoxGeometry(len,.06,.06),railMat);
    m.position.set((x1+x2)/2,2.6+.82,(z1+z2)/2); m.rotation.y=-Math.atan2(z2-z1,x2-x1); g.add(m);
    const n=Math.max(2,Math.round(len/.9));
    for(let i=0;i<=n;i++){ const t=i/n, p=new THREE.Mesh(new THREE.BoxGeometry(.05,.82,.05),railMat);
      p.position.set(x1+(x2-x1)*t,2.6+.41,z1+(z2-z1)*t); p.castShadow=true; g.add(p); } };
  rail(4.85,2.3,4.85,1.5); rail(4.9,3.0,5.9,3.0); rail(5.9,2.3,5.9,3.0);
  // 가구
  const fmats={};
  S.furn.forEach(f=>{ const y=(f.fl?2.6:0)+f.h/M2/2;
    if(!fmats[f.c])fmats[f.c]=new THREE.MeshLambertMaterial({color:new THREE.Color(f.c)});
    const m=new THREE.Mesh(new THREE.BoxGeometry(f.w/M2,f.h/M2,f.d/M2),fmats[f.c]);
    m.position.set(f.x/M2,y,f.y/M2); m.rotation.y=-(f.r||0)*Math.PI/180; m.castShadow=m.receiveShadow=true; g.add(m); });
  // 지붕(박공, 능선 동서) — 두 사면
  const roofMat=new THREE.MeshLambertMaterial({color:0x6e4a34});
  const th=Math.atan(1.45/2.25), slLen=Math.hypot(2.25,1.45);
  const mkSlope=(z,sign)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(9.2,.18,slLen),roofMat);
    m.position.set(4,2.6+1.45/2,z); m.rotation.x=sign*th; m.castShadow=m.receiveShadow=true; g.add(m); };
  mkSlope(2.25-slLen/2*Math.cos(th),-1);  // 북쪽 사면(능선 높음)
  mkSlope(2.25+slLen/2*Math.cos(th), 1);  // 남쪽 사면
  // 박공 벽(서: 막힘 / 동: 다락방 연결문 구멍)
  const gable=(zx,doorHole)=>{ const sh=new THREE.Shape(); sh.moveTo(-2.25,0); sh.lineTo(2.25,0); sh.lineTo(0,1.45); sh.closePath();
    if(doorHole){ const h=new THREE.Path(); h.moveTo(-.45,0); h.lineTo(.45,0); h.lineTo(.45,1.1); h.lineTo(-.45,1.1); h.closePath(); sh.holes.push(h); }
    const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.12,bevelEnabled:false}),new THREE.MeshLambertMaterial({color:0xd8ccb4}));
    m.rotation.y=Math.PI/2; m.position.set(zx,2.6,2.25); m.castShadow=true; g.add(m); };
  gable(0,false); gable(8,true);
  // 다락 증축 윙(동쪽 3,000×3,300) — 벽체+창+지붕
  const wingMat=new THREE.MeshLambertMaterial({color:0xd8ccb4});
  const wb=(x,z,w,d)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,3.55,d),wingMat);
    m.position.set(x,3.55/2,z); m.castShadow=m.receiveShadow=true; g.add(m); };
  wb(9.5,0.05,3.0,0.1); wb(9.5,3.45,3.0,0.1); wb(10.95,1.75,0.1,3.3);
  const wg=new THREE.Mesh(new THREE.BoxGeometry(0.06,1.2/M2*1,1.8/M2),matGlass);
  wg.position.set(10.95,1.5,1.75); g.add(wg);
  const wr=new THREE.Mesh(new THREE.BoxGeometry(3.35,.15,3.6),roofMat);
  wr.position.set(9.5,3.72,1.75); wr.rotation.z=0.16; wr.castShadow=true; g.add(wr);
  // 데크(남측 3m) + 주차 포장
  const deck=new THREE.Mesh(new THREE.BoxGeometry(3,.1,3),new THREE.MeshLambertMaterial({color:0xa97e4f}));
  deck.position.set(1.5,.16,6.0); deck.receiveShadow=true; g.add(deck);
  const pk=new THREE.Mesh(new THREE.BoxGeometry(3,.06,3),new THREE.MeshLambertMaterial({color:0x8f8b83}));
  pk.position.set(12.8,.14,2.0); pk.receiveShadow=true; g.add(pk);
  T3.colBoxes=wallMeshes();
}
function bind3DLoop(){
  const keys={};
  addEventListener("keydown",e=>{ if(S.mode!=="3d")return; keys[e.key.toLowerCase()]=true; if(e.key==="Escape")stopFP(); });
  addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });
  let look=null;
  T3.renderer.domElement.addEventListener("pointerdown",e=>{ if(T3.mode==="fp"){ look={x:e.clientX,y:e.clientY}; } });
  T3.renderer.domElement.addEventListener("pointermove",e=>{ if(look){ T3.fp.yaw-=(e.clientX-look.x)*.005; look={x:e.clientX,y:e.clientY}; } });
  addEventListener("pointerup",()=>look=null);
  const loop=()=>{ requestAnimationFrame(loop); if(S.mode!=="3d")return;
    if(T3.mode==="orbit"){ T3.controls.update(); }
    else{ const f=T3.fp, sp=.06;
      let mx=0,mz=0;
      if(keys["w"]){mx+=Math.sin(f.yaw);mz+=Math.cos(f.yaw);} if(keys["s"]){mx-=Math.sin(f.yaw);mz-=Math.cos(f.yaw);}
      if(keys["a"]){mx+=Math.cos(f.yaw);mz-=Math.sin(f.yaw);} if(keys["d"]){mx-=Math.cos(f.yaw);mz+=Math.sin(f.yaw);}
      const L=Math.hypot(mx,mz)||1; f.pos.x+=mx/L*sp; f.pos.z+=mz/L*sp;
      // 벽 충돌(박스 푸시아웃, 층별)
      const base=f.fl?2.6:0;
      for(const o of T3.colBoxes||[]){ const ey=f.pos.y-1.55;
        if(ey> (o.y+o.h)/M2+.05 || ey+1.7<o.y/M2)continue;
        const dx=f.pos.x-o.x/M2, dz=f.pos.z-o.z/M2;
        const px=(o.w/M2)/2+.22-Math.abs(dx), pz=(o.d/M2)/2+.22-Math.abs(dz);
        if(px>0&&pz>0){ if(px<pz)f.pos.x+=Math.sign(dx||1)*px; else f.pos.z+=Math.sign(dz||1)*pz; } }
      f.pos.x=Math.min(Math.max(f.pos.x,0.35),f.fl?10.85:7.85); f.pos.z=Math.min(Math.max(f.pos.z,0.35),4.35);
      // 계단(홀 x4.95~5.85, 남→북 상승): 밟으면 높이 보간
      const onStair=f.pos.x>4.95&&f.pos.x<5.85&&f.pos.z>2.3&&f.pos.z<4.3;
      let y=base+1.55;
      if(onStair){ const prog=Math.min(1,Math.max(0,(4.3-f.pos.z)/2.0)); y=(f.fl? 2.6*(1-prog):prog*2.6)+1.55;
        if(!f.fl&&prog>0.96){ f.fl=1; document.getElementById("bFloor3d").textContent="⇅ 다락"; }
        if(f.fl&&prog<0.04){ f.fl=0; document.getElementById("bFloor3d").textContent="⇅ 1층"; } }
      f.pos.y=y;
      T3.cam.position.copy(f.pos);
      T3.cam.lookAt(f.pos.x+Math.sin(f.yaw),f.pos.y,f.pos.z+Math.cos(f.yaw)); }
    T3.renderer.render(T3.scene,T3.cam); };
  loop();
  addEventListener("resize",()=>{ const c=document.getElementById("view3d");
    if(!c.clientWidth)return; T3.renderer.setSize(c.clientWidth,c.clientHeight);
    T3.cam.aspect=c.clientWidth/c.clientHeight; T3.cam.updateProjectionMatrix(); });
}
function sync3D(){ if(T3.inited&&T3.renderer)rebuildHouse(); }
function startFP(){ T3.mode="fp"; T3.fp.fl=S.floor;
  if(S.floor){ T3.fp.pos.set(6.4,4.15,1.2); } else { T3.fp.pos.set(4,1.6,3.8); }
  T3.controls.enabled=false; document.getElementById("fpCross").style.display="block";
  document.getElementById("bCam").textContent="📷 조감도로"; }
function stopFP(){ if(T3.mode!=="fp")return; T3.mode="orbit"; T3.controls.enabled=true;
  document.getElementById("fpCross").style.display="none"; document.getElementById("bCam").textContent="🚶 1인칭"; }

/* ================= 모드 전환/버튼 ================= */
let modeBusy=false;
async function toggleMode(){
  if(modeBusy)return; modeBusy=true;
  if(S.mode==="2d"){ await ensure3D(); sync3D();
    document.getElementById("plane").classList.add("three-d");
    document.getElementById("view3d").classList.add("on");
    setTimeout(()=>{ if(T3.renderer)T3.renderer.setSize(document.getElementById("view3d").clientWidth,document.getElementById("view3d").clientHeight); },60);
    document.getElementById("bMode").textContent="◀ 2D 평면도"; S.mode="3d";
  } else { document.getElementById("plane").classList.remove("three-d");
    document.getElementById("view3d").classList.remove("on");
    document.getElementById("bMode").textContent="3D 보기 ▶"; S.mode="2d"; stopFP(); }
  modeBusy=false;
}
document.getElementById("bMode").onclick=toggleMode;
document.getElementById("bCam").onclick=()=>{ if(T3.mode==="fp")stopFP(); else startFP(); };
document.getElementById("bFloor3d").onclick=function(){ const f=T3.fp.fl?0:1; T3.fp.fl=f; this.textContent=f?"⇅ 다락":"⇅ 1층";
  S.floor=f; document.getElementById("f0").classList.toggle("on",f===0); document.getElementById("f1").classList.toggle("on",f===1);
  render2D(); };
document.getElementById("bUndo").onclick=undo; document.getElementById("bRedo").onclick=redo;
document.getElementById("bSave").onclick=()=>{ localStorage.setItem("housePlan25",snapshot()); toast("브라우저에 저장했습니다 (localStorage)"); };
document.getElementById("bLoad").onclick=()=>{ const j=localStorage.getItem("housePlan25"); if(!j){toast("저장된 데이터가 없습니다");return;} pushHist(); applySnap(j); toast("저장본을 불러왔습니다"); };
document.getElementById("bReset").onclick=()=>{ pushHist(); S.furn=JSON.parse(JSON.stringify(FURN_DEF)); S.removed={};
  ROOMS.forEach(r=>S.mats[r.id]=r.f); S.sel=-1; render2D(); sync3D(); toast("초기 배치로 되돌렸습니다"); };
document.getElementById("bExport").onclick=()=>{ const src=svg.outerHTML;
  const img=new Image(); const b=new Blob([src],{type:"image/svg+xml;charset=utf-8"}); const u=URL.createObjectURL(b);
  img.onload=()=>{ const c=document.createElement("canvas"); c.width=2200;c.height=1500;
    const x=c.getContext("2d"); x.fillStyle="#f2ede3"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    const a=document.createElement("a"); a.download="house-plan.png"; a.href=c.toDataURL("image/png"); a.click(); URL.revokeObjectURL(u); toast("PNG로 내보냈습니다"); };
  img.onerror=()=>toast("내보내기 실패"); img.src=u; };
addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="z"){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==="y"||(e.shiftKey&&e.key==="Z"))){e.preventDefault();redo();}
  if(e.key==="Escape"){ setTool("sel"); measures=[]; measuring=null; drawMeas(); } });
document.getElementById("f0").onclick=function(){ S.floor=0; this.classList.add("on"); document.getElementById("f1").classList.remove("on"); render2D(); if(T3.renderer){T3.fp.fl=0;} };
document.getElementById("f1").onclick=function(){ S.floor=1; this.classList.add("on"); document.getElementById("f0").classList.remove("on"); render2D(); if(T3.renderer){T3.fp.fl=1;} };

/* ================= 시작 ================= */
buildSVG(); render2D(); updateHistBtns();
window.addEventListener("error",ev=>console.error(ev.message));
</script>
