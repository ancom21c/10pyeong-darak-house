<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10평집 인테리어 설계 — 2D 평면도 · 3D 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f1ea; --paper2:#ece8de; --ink:#2b2926; --ink2:#6b665e;
  --line:#c9c2b4; --accent:#2f5d8a; --accent2:#c2571f; --lb:#3a3630;
  --panel:#fbf9f4; --shadow:0 10px 30px rgba(43,41,38,.14),0 2px 6px rgba(43,41,38,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--paper);color:var(--ink);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;transition:.15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.12);color:#fff}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:20}
header h1{font-size:16px;font-weight:700;letter-spacing:-.2px}
header h1 small{font-weight:400;color:var(--ink2);font-size:12px;margin-left:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:7px 14px;background:transparent}
.seg button.on{background:var(--ink);color:#fff}
.spacer{flex:1}
.linkbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;padding:7px 12px;border:1px solid var(--accent);color:var(--accent);border-radius:8px;background:#fff}
.linkbtn:hover{background:var(--accent);color:#fff}
#stage{position:relative;flex:1;min-height:0}
#planWrap,#view3dWrap{position:absolute;inset:0;transition:opacity .45s ease,transform .45s ease}
#planWrap{background:radial-gradient(1200px 700px at 70% -10%,#fbf9f3 0%,transparent 60%),var(--paper)}
#view3dWrap{background:linear-gradient(#dfe7ee 0%,#eef0ea 100%)}
.hidden{opacity:0;pointer-events:none;transform:scale(.985)}
canvas{display:block}
#planCanvas{width:100%;height:100%}
#threeCanvas{width:100%;height:100%}
.toolbar{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow);z-index:10}
.toolbar button{display:flex;align-items:center;gap:7px;justify-content:flex-start;width:138px;text-align:left}
.toolbar button .ic{width:18px;text-align:center}
.hintbar{position:absolute;left:14px;bottom:14px;background:rgba(43,41,38,.86);color:#f4f1ea;font-size:12.5px;padding:8px 14px;border-radius:9px;max-width:460px;z-index:10;line-height:1.5}
.legendbar{position:absolute;right:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:11.5px;color:var(--ink2);display:flex;gap:14px;z-index:10;box-shadow:var(--shadow);flex-wrap:wrap;max-width:520px}
.legendbar b{color:var(--ink);font-weight:600}
.legendbar .chip{display:inline-block;width:18px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#props{position:absolute;right:14px;top:14px;width:238px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:10;padding:12px;display:none}
#props.show{display:block}
#props h3{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
#props .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;font-size:12.5px}
#props input[type=number]{width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px}
#props .del{width:100%;margin-top:8px;border-color:#b0442c;color:#b0442c}
#props .del:hover{background:#b0442c;color:#fff}
#roomInfo{position:absolute;right:14px;bottom:64px;width:238px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:9;padding:12px;display:none}
#roomInfo.show{display:block}
#roomInfo h3{font-size:13px;margin-bottom:6px}
#roomInfo p{font-size:12.5px;color:var(--ink2);line-height:1.6}
#hud3d{position:absolute;inset:0;pointer-events:none;z-index:10}
#hud3d .top{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
#hud3d .top button{background:rgba(251,249,244,.94)}
#fpHelp{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(43,41,38,.82);color:#f4f1ea;font-size:12.5px;padding:8px 16px;border-radius:9px;display:none;white-space:nowrap}
#floorBadge{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:rgba(47,93,138,.92);color:#fff;font-size:12.5px;padding:5px 14px;border-radius:99px;display:none;cursor:pointer;pointer-events:auto}
@media (max-width:760px){
  header h1 small{display:none}
  .toolbar button{width:46px;justify-content:center;padding:8px 0}
  .toolbar button .tx{display:none}
  #props,#roomInfo{width:200px}
  .legendbar{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>10평집 인테리어 설계<small>2D 평면도 · 3D 뷰어 — 청용리 724</small></h1>
    <div class="seg" id="floorSeg">
      <button data-floor="f1" class="on">1층</button>
      <button data-floor="attic">다락</button>
    </div>
    <div class="seg" id="modeSeg">
      <button data-mode="2d" class="on">2D 평면도</button>
      <button data-mode="3d">3D 뷰어</button>
    </div>
    <div class="spacer"></div>
    <button id="btnUndo" title="실행 취소">↩ 실행취소</button>
    <button id="btnRedo" title="다시 실행">↪ 다시실행</button>
    <button id="btnSave">💾 저장</button>
    <button id="btnExport" class="primary">🖼 이미지 내보내기</button>
    <a class="linkbtn" href="./site-sim.html">🏗 현장 공사 시뮬레이션 →</a>
  </header>

  <div id="stage">
    <div id="planWrap">
      <canvas id="planCanvas"></canvas>
      <div class="toolbar" id="tools">
        <button data-tool="select" class="on"><span class="ic">▣</span><span class="tx">선택 · 이동</span></button>
        <button data-tool="add"><span class="ic">＋</span><span class="tx">가구 추가</span></button>
        <button data-tool="measure"><span class="ic">📏</span><span class="tx">측정</span></button>
        <button data-tool="demolish"><span class="ic">✂</span><span class="tx">벽 철거/복원</span></button>
        <button data-tool="finish"><span class="ic">▨</span><span class="tx">바닥재 변경</span></button>
      </div>
      <div class="hintbar" id="hint">가구를 드래그해 이동합니다. 벽 가까이(150mm) 가져가면 자동 정렬됩니다. R 키 90° 회전 · Delete 삭제 · Ctrl+Z 실행취소</div>
      <div class="legendbar">
        <span><span class="chip" style="background:var(--lb)"></span><b>내력벽</b>(철골프레임 외벽)</span>
        <span><span class="chip" style="background:#9a938a"></span>비내력벽(가벽·철거 가능)</span>
        <span><span class="chip" style="background:var(--accent2)"></span>볼펜 반영(후문 · 3,200)</span>
      </div>
      <div id="props">
        <h3><span id="propTitle">가구</span><button id="propClose" style="padding:2px 8px">✕</button></h3>
        <div class="row"><span>회전</span><button id="propRot">90° 회전 (R)</button></div>
        <div class="row"><span>가로 (mm)</span><input type="number" id="propW" step="10"></div>
        <div class="row"><span>세로 (mm)</span><input type="number" id="propD" step="10"></div>
        <div class="row"><span>높이 (mm)</span><input type="number" id="propH" step="10"></div>
        <button class="del" id="propDel">가구 삭제 (Delete)</button>
      </div>
      <div id="roomInfo"><h3 id="riName"></h3><p id="riBody"></p></div>
    </div>

    <div id="view3dWrap" class="hidden">
      <canvas id="threeCanvas"></canvas>
      <div id="hud3d">
        <div class="top">
          <button id="btnOrbit" class="on">🛰 조감 · 궤도</button>
          <button id="btnFP">🚶 1인칭 둘러보기</button>
          <button id="btnRoof">🏠 지붕 ON</button>
        </div>
        <div id="floorBadge">현재 층: 1층 (클릭 전환)</div>
        <div id="fpHelp">이동 W A S D · 시선 드래그 · 층 변경 1/2 키 · ESC 종료</div>
      </div>
    </div>
  </div>
</div>

function drawWall(w){

  if(cur<len)segs.push({a:cur,b:len,kind:'solid'});

    ctx.fillText('마루존 3,300 (지붕경사 하부: 양측 600은 합판 보관공간)',a+6*devicePixelRatio,b-6*devicePixelRatio);
    ctx.restore();
  }
  for(const r of HOUSE.rooms)if(r.floor===floor)drawRoom(r);
  if(floor==='attic')drawRails();
  for(const w of HOUSE.walls)drawWall(w);
  if(floor==='attic')drawAnnex2d();
  if(floor==='f1')drawStair2d();
  for(const f of state.furniture)if(f.floor===floor)drawFurn2d(f,f.id===selId);
  drawDims();

    const[ax,ay]=P(...measure.p1),[bx,by]=P(...measure.p2);
    ctx.save();ctx.strokeStyle='#c2571f';ctx.lineWidth=1.6*devicePixelRatio;ctx.setLineDash([8,4]);
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.setLineDash([]);
    const dmm=Math.hypot(measure.p2[0]-measure.p1[0],measure.p2[1]-measure.p1[1]);
    ctx.font=`600 ${12.5*devicePixelRatio}px 'IBM Plex Mono',monospace`;ctx.fillStyle='#c2571f';ctx.textAlign='center';
    ctx.fillText(`${(dmm/1000).toFixed(2)} m`,(ax+bx)/2,(ay+by)/2-12*devicePixelRatio);

    ctx.restore();

    const[ax,ay]=P(...measure.p1);
    ctx.beginPath();ctx.arc(ax,ay,4*devicePixelRatio,0,7);ctx.fillStyle='#c2571f';ctx.fill();
  }
}

function evtXY(e){
  const r=cv.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return[(cx*devicePixelRatio-view.ox)/view.s,(cy*devicePixelRatio-view.oy)/view.s];
}
function furnAt(x,y){
  for(let i=state.furniture.length-1;i>=0;i--){
    const f=state.furniture[i];if(f.floor!==state.floorSel)continue;
    const c=CATALOG[f.t]||{};const w=f.w||c.w||300,d=f.d||c.d||300;
    const a=-f.rot*Math.PI/180,dx=x-f.x,dy=y-f.y;
    const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
    if(Math.abs(lx)<=w/2+80&&Math.abs(ly)<=d/2+80)return f;
  }
  return null;
}
function wallNear(x,y){
  let best=null,bd=1e9;
  for(const w of HOUSE.walls){
    const len=Math.hypot(w.x2-w.x1,w.y2-w.y1),ux=(w.x2-w.x1)/len,uy=(w.y2-w.y1)/len;
    const t=Math.max(0,Math.min(len,(x-w.x1)*ux+(y-w.y1)*uy));
    const pxx=w.x1+ux*t,pyy=w.y1+uy*t;
    const d=Math.hypot(x-pxx,y-pyy);
    if(d<bd){bd=d;best={w,d,ux,uy};}
  }
  return bd<260?best:null;
}
function roomAt(x,y){
  for(const r of HOUSE.rooms){if(r.floor!==state.floorSel||r.finish==='void')continue;
    if(pointInPoly([x,y],r.poly))return r;}
  return null;
}
function snapFurn(f){
  const wn=wallNear(f.x,f.y);
  if(!wn)return;
  const{w,d}=wn;
  if(d>150)return;
  const c=CATALOG[f.t]||{};const wpx=(f.w||c.w||300),dpx=(f.d||c.d||300);
  const longAxis=wpx>=dpx?0:90; // 0=가로(x방향) 장축
  if(w.x1===w.x2){ // 세로 벽
    f.rot=longAxis===0?90:0;
    const off=(longAxis===0?dpx/2:wpx/2)+w.t/2;
    f.x=w.x1+(f.x>w.x1?off:-off);
  }else{ // 가로 벽
    f.rot=longAxis===0?0:90;
    const off=(longAxis===0?dpx/2:wpx/2)+w.t/2;
    f.y=w.y1+(f.y>w.y1?off:-off);
  }
}
function clampFurn(f){f.x=Math.max(-400,Math.min(11400,f.x));f.y=Math.max(-700,Math.min(6300,f.y));}
function onDown(e){
  const[x,y]=evtXY(e);
  if(tool==='measure'){
    if(!measure||(measure.p1&&measure.p2))measure={p1:[x,y],p2:null};
    else if(!measure.p2)measure.p2=[x,y];
    draw();return;
  }
  if(tool==='demolish'){
    const wn=wallNear(x,y);
    if(wn){
      if(wn.w.lb){flash('내력벽(외벽·철골프레임)은 철거할 수 없습니다.');return;}
      pushUndo();

      save();draw();if(threeReady)rebuildDynamic();
      flash(state.wallsDemolished[wn.w.id]?'가벽 철거 — 3D에도 반영됩니다.':'가벽 복원');
    }
    return;
  }
  if(tool==='finish'){
    const r=roomAt(x,y);
    if(r){pushUndo();
      const keys=Object.keys(HOUSE.finishes).filter(k=>k!=='void');
      r.finish=keys[(keys.indexOf(r.finish)+1)%keys.length];
      save();draw();if(threeReady)rebuildDynamic();
      flash(r.name+' 바닥재 → '+HOUSE.finishes[r.finish].name);
    }
    return;
  }
  if(tool==='add'){openAddMenu(x,y);return;}
  const f=furnAt(x,y);
  if(f){selId=f.id;showProps(f);drag={f,dx:x-f.x,dy:y-f.y};pushUndo();}
  else{selId=null;hideProps();showRoom(roomAt(x,y));}
  draw();
}
function onMove(e){
  const[x,y]=evtXY(e);

  if(tool==='select'&&drag&&drag.f){
    const f=drag.f;
    f.x=x-drag.dx;f.y=y-drag.dy;
    if(!e.shiftKey)snapFurn(f);
    clampFurn(f);showProps(f);draw();
  }else if(tool==='finish'){const r=roomAt(x,y);if(hoverRoom!==(r&&r.id)){hoverRoom=r?r.id:null;draw();}}
}

function box(w,h,d,c,x,y,z,ry,parent,cast){

  const[ddx,ddz]=W3((HOUSE.deck.x0+HOUSE.deck.x1)/2,(HOUSE.deck.y0+HOUSE.deck.y1)/2);
  box(1.2,0.1,6.0,0xc09a66,ddx,0.16,ddz,0,scene,false);
  for(let i=1;i<14;i++)box(0.02,0.11,6.0,0xa3805c,ddx-0.6+i*0.6/14*2,0.215,ddz,0,scene,false);

function rebuildDynamic(){

    while(g.children.length){const c=g.children.pop();c.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}
  });
  // 방별 바닥
  for(const r of HOUSE.rooms){
    if(r.floor!=='f1'||r.finish==='void')continue;
    const f=HOUSE.finishes[r.finish];
    const xs=r.poly.map(p=>p[0]),ys=r.poly.map(p=>p[1]);
    const[wx,wz]=W3((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2);
    box((Math.max(...ys)-Math.min(...ys))*0.001,0.04,(Math.max(...xs)-Math.min(...xs))*0.001,f.col3d,wx,F0-0.02,wz,0,floorGroup,false);

  // 다락 바닥(보이드/계단 개구 제외: A·B·D 구역)
  const deckCols={atticN:0xc99e6e,atticE:0xc99e6e,annex:0xc8a06a};
  const regions=[[100,100,7900,1600],[4700,1600,7900,4600],[3900,4500,4700,4600]];
  for(const[a,b,c2,d2]of regions){
    const[wx,wz]=W3((a+c2)/2,(b+d2)/2);
    box((d2-b)*0.001,0.06,(c2-a)*0.001,0xc99e6e,wx,H1-0.03,wz,0,atticGroup,false);
  }
  // 마루 밴드 톤 구분(700-4000)
  {const[wx,wz]=W3(4000,2350);box(3.3,0.015,7.8,0xd2ab77,wx,H1+0.005,wz,0,atticGroup,false);}
  // 증축 다락방
  buildAnnex();
  // 난간
  for(const r of HOUSE.rails){
    const[a1,b1]=W3(r.x1,r.y1),[a2,b2]=W3(r.x2,r.y2);
    const len=Math.hypot(a2-a1,b2-b1),ang=Math.atan2(b2-b1,a2-a1);

    const y1=s.yBottom-(i+1)*run;

      const[wx,wz]=W3(w.x1+ux*(o.a+o.w/2),w.y1+uy*(o.a+o.w/2));
      const glass=new THREE.Mesh(new THREE.BoxGeometry((o.w*0.96)*0.001,(h*0.94)*0.001,0.02),
        new THREE.MeshPhongMaterial({color:0xc4dbe6,transparent:true,opacity:0.45,shininess:90}));
      glass.position.set(wx,(sill+h/2),wz);glass.rotation.y=ang;glass.castShadow=false;glassGroup.add(glass);
      box((o.w+60)*0.001,0.05,0.09,0xf4f1ea,wx,sill+h,wz,ang,glassGroup,false);
      box((o.w+60)*0.001,0.05,0.09,0xf4f1ea,wx,sill,wz,ang,glassGroup,false);
      box(0.04,h*0.94,0.05,0xf4f1ea,wx,sill+h/2,wz,ang,glassGroup,false);
    }else{
      put(o.a,o.a+o.w,F0+h,H1,col);
      const[wx,wz]=W3(w.x1+ux*(o.a+o.w/2),w.y1+uy*(o.a+o.w/2));
      const leaf=box((o.w-60)*0.001,h*0.98,0.045,o.type==='entry'?0x6d5638:0x8a6d48,wx,F0+h/2,wz,ang,wallGroup);
      if(o.type==='entry'){
        box((o.w+40)*0.001,0.07,0.1,0xf4f1ea,wx,F0+h+0.03,wz,ang,glassGroup,false);
        const arch=new THREE.Mesh(new THREE.CylinderGeometry(o.w*0.0005,o.w*0.0005,0.05,20,1,false,0,Math.PI),
          mat(0x6d5638));
        arch.rotation.y=ang;arch.rotation.x=Math.PI/2;
        arch.position.set(wx,F0+h+0.03,wz);arch.castShadow=true;glassGroup.add(arch);
        box(0.02,h*0.5,0.02,0xf4f1ea,wx+Math.cos(ang)*0.02*0,F0+h*0.45,wz,ang,glassGroup,false);
      }
      void leaf;
    }
    cur=o.a+o.w;
  }
  put(cur,len,F0,H1,col);
}
function buildWall3d(w){if(!wallDemolished(w))wallPieces(w);}
function buildAnnex(){
  // 증축 다락방 3.0(남북, wz -4..-7) × 3.3(동서, wx -1.65..+1.65)
  const col=0xa79e90;
  // 증축 바닥
  box(3.3,0.06,2.9,0xc8a06a,0,H1-0.03,-5.5,0,atticGroup,false);
  // 측벽(동서) — 지붕면 하단까지(h 0.45)
  for(const s of[-1,1])box(0.1,0.45,3.0,col,s*1.65,H1+0.225,-5.5,0,atticGroup);
  // 북측 박공벽(삼각형, z=-7)
  const tri=new THREE.Shape();
  tri.moveTo(-1.65,0);tri.lineTo(1.65,0);tri.lineTo(0,1.71);tri.closePath();
  const tm=new THREE.Mesh(new THREE.ShapeGeometry(tri),mat(col));
  tm.position.set(0,H1,-7.0);tm.castShadow=true;atticGroup.add(tm);
  const tm2=new THREE.Mesh(new THREE.ShapeGeometry(tri),mat(0xb5aa98));
  tm2.position.set(0,H1,-7.03);tm2.rotation.y=Math.PI;atticGroup.add(tm2);
  // 측벽 창문(낮게)
  for(const s of[-1,1]){
    const g=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.3,1.1),
      new THREE.MeshPhongMaterial({color:0xc4dbe6,transparent:true,opacity:0.45,shininess:90}));
    g.position.set(s*1.66,H1+0.22,-5.5);glassGroup.add(g);
  }
  // 북벽 창문
  const gn=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.6,0.02),
    new THREE.MeshPhongMaterial({color:0xc4dbe6,transparent:true,opacity:0.45,shininess:90}));
  gn.position.set(0,H1+0.55,-7.06);glassGroup.add(gn);
  // 증축 하부 기둥(4개)
  for(const sx of[-1,1])for(const sz of[-1,1]){
    const c=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,H1,12),mat(0x9aa2a8));
    c.position.set(sx*1.6,H1/2,-4.15+sz*-2.6);c.castShadow=true;atticGroup.add(c);
  }
}
function buildRoof(){
  // 처마 끝(외폭 0.4 포함, wx ±2.75, h 2.409) → 용마루(wx 0, h 4.41)
  const half=2.75;
  const eaveH=H1-0.4*0.7277;              // 2.409
  const rise=H1+1.71-eaveH;               // 표면 상승량 2.001
  const slope=Math.hypot(half,rise);
  const ang=Math.atan2(rise,half);        // 36°
  const len=11.5, zC=-1.5;
  const cR=0x5d4a3a;
  const mk=(s)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(slope,0.05,len),mat(cR));
    m.rotation.z=-s*ang;
    m.position.set(s*half/2,(eaveH+H1+1.71)/2,zC);
    m.castShadow=true;m.receiveShadow=true;roofGroup.add(m);
  };
  mk(-1);mk(1);
  // 용마루 마감
  box(0.34,0.1,len,0x4a3a2d,0,H1+1.71+0.03,zC,0,roofGroup);
  // 박공(남측 x=0 / 증축 북측 x=11000)
  const gable=(wz,span)=>{
    const tri=new THREE.Shape();
    tri.moveTo(-span/2,0);tri.lineTo(span/2,0);tri.lineTo(0,rise);tri.closePath();
    const m=new THREE.Mesh(new THREE.ShapeGeometry(tri),mat(0x8a7f6f));
    m.position.set(0,H1,wz);m.castShadow=true;roofGroup.add(m);
    const m2=new THREE.Mesh(new THREE.ShapeGeometry(tri),mat(0x776c5c));
    m2.position.set(0,H1,wz-0.03);m2.rotation.y=Math.PI;roofGroup.add(m2);
  };
  gable((4000-0)*0.001+0.02,4.7);
  gable((4000-11000)*0.001-0.02,3.3);
  // 박공 처마마감(남측 + 증축 북측, X방향)
  box(5.2,0.16,0.1,0x4a3a2d,0,H1+0.02,4.08,0,roofGroup,false);
  box(3.5,0.16,0.1,0x4a3a2d,0,H1+0.02,-7.08,0,roofGroup,false);
}
function buildFurn3d(f){
  const c=CATALOG[f.t]||{w:f.w||400,d:f.d||400,h:700,c:'#999'};
  const w=(f.w||c.w)*0.001,d=(f.d||c.d)*0.001,h=(f.h||c.h)*0.001;
  const[wx,wz]=W3(f.x,f.y);
  const base=f.floor==='attic'?H1:F0;
  const g=new THREE.Group();g.position.set(wx,base,wz);g.rotation.y=-f.rot*Math.PI/180;
  const col=new THREE.Color(c.c).getHex();
  furnGroup.add(g);
  if(c.flat){box(w,0.02,d,col,0,0.015,0,0,g,false);return;}
  if(c.round){
    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(w/2,w/2*0.85,h,18),mat(col));
    cyl.position.y=h/2;cyl.castShadow=true;g.add(cyl);
    if(f.t==='toilet'){box(w*0.9,h*0.55,d*0.55,col,0,h*0.3,-d*0.15,0,g);}
    if(f.t==='plant'){const s=new THREE.Mesh(new THREE.SphereGeometry(w*0.7,10,8),mat(0x5f7a4f));s.position.y=h*1.05;s.castShadow=true;g.add(s);}
    return;
  }
  if(c.bed){
    box(w,0.28,d,col,0,0.2,0,0,g);
    box(w*0.94,0.2,d*0.92,0xf1e9db,0,0.44,0.02,0,g);
    box(w*0.7,0.12,d*0.25,0xf7f3ea,0,0.55,-d*0.3,0,g);
    box(w,0.75,0.09,0x8a6d48,0,0.5,-d/2+0.04,0,g);
    return;
  }
  if(f.t&&f.t.startsWith('sofa')){
    box(w,0.42,d,col,0,0.24,0,0,g);
    box(w,0.45,0.22,col,0,0.62,-d/2+0.11,0,g);
    box(0.22,0.62,d,col,-w/2+0.11,0.5,0,0,g);
    box(0.22,0.62,d,col,w/2-0.11,0.5,0,0,g);
    return;
  }
  if(f.t==='chair'){
    box(w*0.9,0.06,d*0.9,col,0,0.44,0,0,g);
    box(w*0.9,0.5,0.06,col,0,0.72,-d/2+0.03,0,g);
    for(const sx of[-1,1])for(const sz of[-1,1])box(0.04,0.44,0.04,col,sx*w*0.38,0.22,sz*d*0.38,0,g,false);
    return;
  }
  if(['table','dining','desk','tea','lowtable'].includes(f.t)){
    box(w,0.05,d,col,0,h,0,0,g);
    for(const sx of[-1,1])for(const sz of[-1,1])box(0.05,h,0.05,0x7a6a54,sx*(w/2-0.05),h/2,sz*(d/2-0.05),0,g,false);
    return;
  }
  if(f.t==='tv'){box(w,h,d,col,0,h/2,0,0,g);box(w*0.75,h*0.55,0.03,0x1d1d1f,0,h+0.22,0,0,g,false);return;}
  if(f.t==='kitchen'){box(w,h*0.85,d,col,0,h*0.425,0,0,g);box(w,0.05,d+0.04,0xd8dde0,0,h*0.85+0.02,0,0,g,false);
    const s=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.02,16),mat(0x9aa2a8));s.position.set(-w*0.22,h*0.85+0.05,0);g.add(s);return;}
  if(f.t==='fridge'){box(w,h,d,col,0,h/2,0,0,g);box(0.03,h*0.5,0.05,0x8a8a86,w/2-0.06,h*0.55,d/2,0,g,false);return;}
  if(f.t==='washer'){box(w,h,d,col,0,h/2,0,0,g);
    const dr=new THREE.Mesh(new THREE.CylinderGeometry(w*0.3,w*0.3,0.03,16),mat(0x6b7280));
    dr.rotation.x=Math.PI/2;dr.position.set(0,h*0.55,d/2);g.add(dr);return;}
  if(f.t==='sink'){box(w,h*0.8,d,col,0,h*0.4,0,0,g);box(w*0.8,0.06,d*0.7,0xf7f7f4,0,h*0.82,0,0,g,false);return;}
  if(f.t==='shelf'){box(w,h,d,col,0,h/2,0,0,g);box(w-0.06,h-0.1,0.02,0x3d3833,0,h/2,d/2-0.01,0,g,false);return;}
  box(w,h,d,col,0,h/2,0,0,g);
}

const controls=new OrbitControls(camera,threeCanvas);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.maxPolarAngle=Math.PI/2.05;controls.minDistance=2;controls.maxDistance=60;
controls.target.set(0.4,1.1,-1.2);
let mode='2d',fpOn=false,roofOn=true;
const fp={pos:new THREE.Vector3(-1.2,0,3.2),yaw:Math.PI,pitch:-0.05,keys:{},floor:'f1'};
function setMode(m){
  if(m===mode)return;
  mode=m;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  const pw=document.getElementById('planWrap'),vw=document.getElementById('view3dWrap');
  if(m==='3d'){
    if(!threeReady)buildStatic();
    resize3d();
    pw.classList.add('hidden');vw.classList.remove('hidden');
    // 전환 애니메이션: 2D 시점(수직) → 궤도 시점
    camera.up.set(-1,0,0);camera.position.set(0,24,0);
    camera.lookAt(0.4,0,-1.2);controls.enabled=false;fpOn=false;updateFPUI();
    const start={pos:camera.position.clone(),up:camera.up.clone()};
    const endPos=new THREE.Vector3(7.2,6.4,7.8),endUp=new THREE.Vector3(0,1,0);
    const t0=performance.now();
    (function anim(){
      const t=Math.min(1,(performance.now()-t0)/950),e=1-Math.pow(1-t,3);
      camera.position.lerpVectors(start.pos,endPos,e);
      camera.up.lerpVectors(start.up,endUp,e).normalize();
      camera.lookAt(0.4,1.0,-1.2);
      if(t<1&&mode==='3d')requestAnimationFrame(anim);
      else{camera.up.set(0,1,0);controls.enabled=true;controls.update();}
    })();
  }else{
    vw.classList.add('hidden');pw.classList.remove('hidden');
    if(fpOn)exitFP();
    resize2d();
  }
}
document.getElementById('btnOrbit').onclick=()=>{exitFP();};
document.getElementById('btnFP').onclick=()=>{enterFP();};
document.getElementById('btnRoof').onclick=()=>{roofOn=!roofOn;if(roofGroup)roofGroup.visible=roofOn;
  document.getElementById('btnRoof').textContent=roofOn?'🏠 지붕 ON':'🏠 지붕 OFF';};
document.getElementById('floorBadge').onclick=()=>setFPFloor(fp.floor==='f1'?'attic':'f1');
function updateFPUI(){
  document.getElementById('btnOrbit').classList.toggle('on',!fpOn);
  document.getElementById('btnFP').classList.toggle('on',fpOn);
  document.getElementById('fpHelp').style.display=fpOn?'block':'none';

function enterFP(){
  fpOn=true;updateFPUI();
  fp.pos.set(0.75,0,2.5);fp.yaw=-Math.PI/2;fp.pitch=-0.03;fp.floor='f1';
  camera.fov=68;camera.updateProjectionMatrix();
}
function exitFP(){
  if(!fpOn)return;fpOn=false;updateFPUI();
  camera.fov=55;camera.updateProjectionMatrix();
  camera.position.set(7.2,6.4,7.8);camera.up.set(0,1,0);camera.lookAt(0.4,1.0,-1.2);
}
function setFPFloor(fl){
  fp.floor=fl;
  const badge=document.getElementById('floorBadge');
  badge.textContent='현재 층: '+(fl==='f1'?'1층':'다락')+' (클릭 전환)';
  const inStair=inStairStrip(fp.pos);
  if(fl==='f1'&&!inStair){fp.pos.set(0.75,0,2.5);}
  if(fl==='attic'&&!inStair){fp.pos.set(0.6,0,-2.2);}
}
function inStairStrip(p){
  const[pxx,pyy]=P3(p.x,p.z);
  return pxx>=3900&&pxx<=4700&&pyy>=1600&&pyy<=4500;
}
function floorYAt(p){
  if(inStairStrip(p)){
    const[,pyy]=P3(p.x,p.z);
    const t=Math.max(0,Math.min(1,(4500-pyy)/2900));
    return F0+t*(H1-F0);
  }
  return fp.floor==='attic'?H1:F0;
}
function walkable(p){ // p: Vector3 (x,·,z)
  const[pxx,pyy]=P3(p.x,p.z);
  if(inStairStrip(p))return true;
  if(fp.floor==='f1')return pxx>=60&&pxx<=7940&&pyy>=60&&pyy<=4640;
  // 다락: 데크 구역(A,B,D) 또는 계단
  const inA=pxx>=100&&pxx<=7900&&pyy>=100&&pyy<=1600;
  const inB=pxx>=4700&&pxx<=7900&&pyy>=1600&&pyy<=4600;
  const inD=pxx>=3900&&pxx<=4700&&pyy>=4500&&pyy<=4600;
  const inAX=pxx>=8100&&pxx<=10900&&pyy>=800&&pyy<=3900;
  return inA||inB||inD||inAX;
}
function wallHit(p){
  const[pxx,pyy]=P3(p.x,p.z),r=0.22;
  for(const w of HOUSE.walls){
    if(wallDemolished(w))continue;
    if(fp.floor==='attic'&&w.id==='N')continue; // 다락에선 북벽 상부가 개방(증축 연결)
    const len=Math.hypot(w.x2-w.x1,w.y2-w.y1),ux=(w.x2-w.x1)/len,uy=(w.y2-w.y1)/len;
    const t=Math.max(0,Math.min(len,(pxx-w.x1)*ux+(pyy-w.y1)*uy));
    const dx=pxx-(w.x1+ux*t),dy=pyy-(w.y1+uy*t);
    if(Math.hypot(dx,dy)<w.t/2*0.001+r)return true;
  }
  if(fp.floor==='attic'&&!inStairStrip(p)){
    for(const rl of HOUSE.rails){
      const len=Math.hypot(rl.x2-rl.x1,rl.y2-rl.y1),ux=(rl.x2-rl.x1)/len,uy=(rl.y2-rl.y1)/len;
      const t=Math.max(0,Math.min(len,(pxx-rl.x1)*ux+(pyy-rl.y1)*uy));
      const dx=pxx-(rl.x1+ux*t),dy=pyy-(rl.y1+uy*t);
      if(Math.hypot(dx,dy)<0.3)return true;
    }
  }
  for(const f of state.furniture){
    if(f.floor!==fp.floor)continue;
    const c=CATALOG[f.t]||{};if(c.flat)continue;
    const fw=(f.w||c.w||300)*0.001,fd=(f.d||c.d||300)*0.001;
    const rad=Math.min(Math.max(fw,fd)/2,0.8);
    if(Math.hypot(p.x-W3(f.x,f.y)[0],p.z-W3(f.x,f.y)[1])<rad*0.8+0.12)return true;
  }
  return false;
}
window.addEventListener('keydown',e=>{fp.keys[e.key.toLowerCase()]=true;});
window.addEventListener('keyup',e=>{fp.keys[e.key.toLowerCase()]=false;});
let lookDrag=null;
threeCanvas.addEventListener('mousedown',e=>{if(fpOn)lookDrag={x:e.clientX,y:e.clientY};});
window.addEventListener('mousemove',e=>{
  if(fpOn&&lookDrag){
    fp.yaw-=(e.clientX-lookDrag.x)*0.0042;
    fp.pitch=Math.max(-1.2,Math.min(1.2,fp.pitch-(e.clientY-lookDrag.y)*0.0042));
    lookDrag={x:e.clientX,y:e.clientY};
  }
});
window.addEventListener('mouseup',()=>lookDrag=null);
threeCanvas.addEventListener('touchstart',e=>{if(fpOn){lookDrag={x:e.touches[0].clientX,y:e.touches[0].clientY};}},{passive:true});
threeCanvas.addEventListener('touchmove',e=>{
  if(fpOn&&lookDrag){
    fp.yaw-=(e.touches[0].clientX-lookDrag.x)*0.005;
    fp.pitch=Math.max(-1.2,Math.min(1.2,fp.pitch-(e.touches[0].clientY-lookDrag.y)*0.005));
    lookDrag={x:e.touches[0].clientX,y:e.touches[0].clientY};
  }
},{passive:true});
threeCanvas.addEventListener('touchend',()=>lookDrag=null);
function fpTick(dt){
  if(!fpOn)return;
  const sp=2.6*dt;
  const dir=new THREE.Vector3(Math.sin(fp.yaw),0,Math.cos(fp.yaw));
  const mv=new THREE.Vector3();
  if(fp.keys['w']||fp.keys['arrowup'])mv.add(dir);
  if(fp.keys['s']||fp.keys['arrowdown'])mv.sub(dir);
  if(fp.keys['a']||fp.keys['arrowleft'])mv.add(new THREE.Vector3(dir.z,0,-dir.x));
  if(fp.keys['d']||fp.keys['arrowright'])mv.add(new THREE.Vector3(-dir.z,0,dir.x));
  if(mv.lengthSq()>0){
    mv.normalize().multiplyScalar(sp);
    const nx=fp.pos.clone();nx.x+=mv.x;
    if(walkable(nx)&&!wallHit(nx))fp.pos.x=nx.x;
    const nz=fp.pos.clone();nz.z+=mv.z;
    if(walkable(nz)&&!wallHit(nz))fp.pos.z=nz.z;
    const y=floorYAt(fp.pos);
    if(y>H1-0.25&&fp.floor!=='attic'){fp.floor='attic';setFPFloor('attic');}
    if(y<F0+0.25&&fp.floor!=='f1'){fp.floor='f1';setFPFloor('f1');}
  }
  const eye=floorYAt(fp.pos)+1.5;
  camera.position.set(fp.pos.x,eye,fp.pos.z);
  camera.up.set(0,1,0);
  camera.lookAt(fp.pos.x+Math.sin(fp.yaw)*Math.cos(fp.pitch),eye+Math.sin(fp.pitch),fp.pos.z+Math.cos(fp.yaw)*Math.cos(fp.pitch));
}

function resize3d(){
  const r=threeCanvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width,r.height,false);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  camera.aspect=r.width/r.height;camera.updateProjectionMatrix();
}
window.addEventListener('resize',()=>{resize2d();resize3d();});
let lastT=performance.now();
(function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  if(mode==='3d'){
    if(fpOn)fpTick(dt);else controls.update();
    renderer.render(scene,camera);
  }
})();

window.__dbg={scene,camera,HOUSE,box,getGroups:()=>({wallGroup,floorGroup,glassGroup,atticGroup,stairGroup,furnGroup}),buildWall3d,wallDemolished,rebuildDynamic};
