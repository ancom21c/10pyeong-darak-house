<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>청용리 724 · 공사 단계 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101216;--bg2:#171a1f;--bg3:#1f232a;--line:#2c313a;--line2:#3a404b;
  --ink:#e9ebee;--ink2:#a9afba;--ink3:#70767f;
  --acc:#e8a33d;--blue:#6fb1ee;--green:#7fc98f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;font-size:13px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--blue);text-decoration:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ── 로딩 ── */
#loading{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;transition:opacity .7s}
#loading .t{font-size:17px;font-weight:700;letter-spacing:1px}
#loading .s{font-size:12px;color:var(--ink3)}
#loading .bar{width:180px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:40%;background:var(--acc);border-radius:2px;animation:ld 1.1s infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}

/* ── 상단 HUD ── */
#head{position:fixed;left:14px;top:12px;z-index:10;pointer-events:none}
#head .t1{font-size:15.5px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#head .t2{font-size:11px;color:var(--ink2);text-shadow:0 1px 6px rgba(0,0,0,.7)}
#head .t2 b{color:var(--acc)}
#stageBadge{position:fixed;right:14px;top:12px;z-index:10;text-align:right;pointer-events:none}
#stageBadge .n{font-size:11px;color:var(--acc);font-weight:700;letter-spacing:1.5px}
#stageBadge .name{font-size:16px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#stageBadge .sub{font-size:11px;color:var(--ink2)}

/* ── 좌측: 단계 패널 ── */
#panel{position:fixed;left:14px;top:64px;bottom:96px;width:288px;z-index:10;display:flex;flex-direction:column;gap:8px;
  transition:transform .25s,opacity .25s}
#steps{background:rgba(16,18,22,.88);border:1px solid var(--line);border-radius:12px;padding:6px;backdrop-filter:blur(6px)}
#steps button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:8px;text-align:left;color:var(--ink2)}
#steps button b{width:20px;height:20px;flex:none;border-radius:6px;background:var(--bg3);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--ink3)}
#steps button span{flex:1;font-size:12.5px;font-weight:500}
#steps button i{height:3px;flex:none;width:0;background:var(--acc);border-radius:2px;position:absolute}
#steps button{position:relative}
#steps button.on{background:#2b2415;color:var(--ink)}
#steps button.on b{background:var(--acc);color:#1a1408;border-color:var(--acc)}
#steps button.done b{background:#3a3320;color:var(--acc2)}
#desc{background:rgba(16,18,22,.88);border:1px solid var(--line);border-radius:12px;padding:12px 13px;backdrop-filter:blur(6px);overflow-y:auto}
#desc h4{font-size:13px;margin-bottom:2px}
#desc .tag{font-size:11px;color:var(--acc);font-weight:600;margin-bottom:7px}
#desc .d{font-size:12px;line-height:1.62;color:var(--ink2)}
#desc ul{margin:8px 0 0 16px}
#desc li{font-size:11.5px;line-height:1.6;color:var(--ink2)}
#desc li::marker{color:var(--acc)}
#land{background:rgba(16,18,22,.88);border:1px solid var(--line);border-radius:12px;padding:12px 13px;backdrop-filter:blur(6px);
  overflow-y:auto;flex:1;min-height:0}
#land h3{font-size:12.5px;margin:10px 0 5px;color:var(--acc)}
#land h3:first-child{margin-top:0}
#land .big{font-size:13.5px;font-weight:700;margin-bottom:4px}
#land div{font-size:11.5px;line-height:1.6;color:var(--ink2)}
#land table{width:100%;border-collapse:collapse;margin-top:5px}
#land td{font-size:11px;line-height:1.5;color:var(--ink2);padding:3px 4px 3px 0;vertical-align:top;border-top:1px solid #23272e}
#land td:first-child{white-space:nowrap;padding-right:8px}
#land .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(255,255,255,.2)}
#srcLine{font-size:10.5px;color:var(--ink3);padding:2px 4px}
#srcLine b{color:var(--ink2)}

/* ── 하단 컨트롤 ── */
#ctrl{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:linear-gradient(transparent,rgba(10,11,14,.9) 30%);}
.cbox{display:flex;align-items:center;gap:8px;background:rgba(16,18,22,.9);border:1px solid var(--line);
  border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px)}
.cbtn{padding:7px 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--ink2)}
.cbtn:hover{color:var(--ink);border-color:#4a515d}
.cbtn.acc{background:var(--acc);color:#1a1408;border-color:var(--acc)}
.cbtn.acc:hover{background:var(--acc2)}
.cbtn.on{background:#2b2415;color:var(--acc);border-color:#4d4428}
.seg{display:flex;background:var(--bg3);border-radius:8px;padding:2px;border:1px solid var(--line2)}
.seg button{padding:5px 11px;border-radius:6px;font-size:12px;color:var(--ink2)}
.seg button.on{background:var(--acc);color:#1a1408;font-weight:600}
input[type=range]{accent-color:var(--acc);cursor:pointer}
#stageSlider{width:200px}
#todSlider{width:130px}
#clock{font-size:12px;font-weight:600;color:var(--ink2);min-width:86px;text-align:center}
#lblSt{font-size:12px;color:var(--ink2);white-space:nowrap}
#compass{position:fixed;right:16px;bottom:86px;width:78px;height:78px;z-index:9;pointer-events:none;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
#compass .cap{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);font-size:9.5px;color:var(--ink2);white-space:nowrap;text-shadow:0 1px 4px #000}

/* 라벨 */
#labels{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#labels div{position:absolute;transform:translate(-50%,-100%);font-size:10.5px;font-weight:500;color:#fff;
  background:rgba(12,14,17,.72);border:1px solid rgba(255,255,255,.14);padding:2px 7px;border-radius:6px;white-space:nowrap;
  text-shadow:0 1px 3px #000}

/* 1인칭 */
#joy{position:fixed;left:20px;bottom:104px;width:116px;height:116px;border-radius:50%;z-index:12;
  background:rgba(16,18,22,.5);border:1px solid var(--line2);display:none;touch-action:none}
#joy .k{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(232,163,61,.8)}
body.fp #joy{display:block}
body.fp #panel{transform:translateX(-120%);opacity:0;pointer-events:none}
#fpTip{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:12;display:none;
  font-size:12px;color:var(--ink2);background:rgba(12,14,17,.8);border:1px solid var(--line);padding:6px 14px;border-radius:9px}
body.fp #fpTip{display:block}

/* 모바일 */
#mToggle{position:fixed;right:14px;top:64px;z-index:11;padding:8px 12px;border-radius:9px;display:none;
  background:rgba(16,18,22,.9);border:1px solid var(--line2);font-size:12px;color:var(--ink2)}
@media(max-width:960px){
  #panel{width:min(288px,82vw)}
  #panel.hide{transform:translateX(-120%);opacity:0;pointer-events:none}
  #mToggle{display:block}
  #stageSlider{width:110px}
  #todSlider{width:84px}
  #lblSt{display:none}
  #compass{width:58px;height:58px;bottom:96px}
  #stageBadge .name{font-size:13px}
  #head .t2{display:none}
}
@media(max-width:640px){
  .cbox.opt{display:none}
  #clock{min-width:64px;font-size:11px}
  .cbtn{padding:6px 9px;font-size:11.5px}
}
</style>

  <table><tr><td><span class="sw" style="background:#6f9a45"></span>앞마당·동측</td><td>화강석 디딤돌 + 잔디 (논 조망 벤치까지)</td></tr>
  <tr><td><span class="sw" style="background:#bdbab3"></span>주차·진입</td><td>남서 모서리 도로에서 콘크리트(줄눈) 3.9 × 6.8 m</td></tr>
  <tr><td><span class="sw" style="background:#a9a69e"></span>건물 둘레</td><td>쇄석 배수띠 0.6 m (낙수·튀김 방지)</td></tr>
  <tr><td><span class="sw" style="background:#cfcac0"></span>비석 앞</td><td>화강 판석 2.4 × 2.4 m</td></tr></table>
  <h3>담장 (총 ${(P.brick+P.fence+P.hedge).toFixed(0)} m)</h3>
  <table><tr><td>도로변 서·남<br>${P.brick.toFixed(1)} m</td><td><b>붉은 벽돌 담장 H1.2 m</b> — 기존 블록 옹벽 위. 길 건너 마을 벽돌담과 재료를 맞추고, 허리~가슴 높이로 도로 시선만 가립니다.</td></tr>
  <tr><td>동측 논 쪽<br>${P.fence.toFixed(1)} m</td><td><b>투시형 목재 펜스 H1.0 m</b> — 논·산 조망과 바람길을 열어 둡니다.</td></tr>
  <tr><td>북측<br>${P.hedge.toFixed(1)} m</td><td><b>녹차나무 생울타리 H0.9~1.2 m</b> — 상록이라 겨울 북서풍을 막고 봄에 찻잎. 영암(전남 서남부)은 차나무가 월동하는 지역입니다.</td></tr>
  <tr><td>대문</td><td>남서 진입부 3.8 m 개방 (차량)</td></tr></table>
  <h3>식재</h3>
  <table><tr><td>비석 양쪽</td><td>주목 2주 (H1.0~1.2, 원추형 전정)</td></tr>
  <tr><td>북동·동</td><td>체리나무 2, 산수유 2 (봄 노란 꽃 · 가을 붉은 열매)</td></tr>
  <tr><td>동·서</td><td>라일락 2 (향기, 뒤 데크·현관 동선)</td></tr>
  <tr><td>남동·남</td><td>비파나무 1 (상록, 따뜻한 남측), 무화과 2</td></tr></table>
  <h3>배치 근거</h3>
  <div>· 건물은 현장 기초 형틀에 맞춰 장변 남북, <b>정면(현관·데크) 동향(12°)</b>. 정면 벽선 방위 102°는 네이버 지도 도로 중심선 대조로 검증된 값입니다.<br>
  · 비석은 참고 이미지의 건물–비석 관계(정면에서 볼 때 건물 왼쪽)대로 남측에 둡니다. 방위가 아닌 상대 위치만 따랐습니다.<br>
  · 지붕 참고 이미지는 재료(슁글)만 반영했습니다.</div>`;}
$('#bLand').onclick=()=>{const el=$('#land');
  const hidden=el.style.display==='none';
  el.style.display=hidden?'':'none';
  $('#bLand').classList.toggle('on',hidden);};

/* ═══ 카메라 · 시네마틱 · 1인칭 ═══ */
let cine=null,fp=false;const keys={};const joy={x:0,y:0};
const P={x:-6.6,z:8.4,yaw:-Math.PI/2*.8,pitch:-.04,h:0};
const CAM_HOME={pos:new THREE.Vector3(-13,13,27),t:new THREE.Vector3(1.5,1.2,0)};
let fly=null;
function flyTo(pos,t,ms=1600){fly={p0:camera.position.clone(),t0:controls.target.clone(),pos,t,s:performance.now(),ms};}
function startCine(){setCam('orbit');fly=null;cine={t:0,st:-1};$('#bCine').textContent='■ 정지';setStage(0,false);controls.enabled=false;}
function stopCine(){if(!cine)return;cine=null;$('#bCine').textContent='▶ 시네마틱';controls.enabled=!fp;}
$('#bCine').onclick=()=>cine?stopCine():startCine();
function updateCine(dt){cine.t+=dt;const T=cine.t,per=6.6,st=Math.min(6,Math.floor(T/per));
  if(st!==cine.st){cine.st=st;setStage(st,true);}
  const a=.2+T*.085,r=lerp(30,17,clamp(T/46))+Math.sin(T*.4)*1.2,h=lerp(15,6.5,clamp(T/46))+Math.sin(T*.25)*1.4;
  camera.position.set(Math.cos(a)*r+1,h,Math.sin(a)*r);controls.target.set(1,1.2+cur*.25,-.8);camera.lookAt(controls.target);
  setTime(lerp(6.7,18.05,clamp(T/50)));if(T>66)stopCine();}
function setCam(m){fp=m==='fp';document.body.classList.toggle('fp',fp);
  document.querySelectorAll('#segCam button').forEach(b=>b.classList.toggle('on',b.dataset.c===m));
  if(fp){stopCine();controls.enabled=false;camera.fov=68;
    P.x=-6.6;P.z=8.4;P.yaw=-Math.PI*.4;P.pitch=-.04;}
  else{controls.enabled=true;camera.fov=46;camera.position.copy(CAM_HOME.pos);controls.target.copy(CAM_HOME.t);}
  camera.updateProjectionMatrix();}
document.querySelectorAll('#segCam button').forEach(b=>b.onclick=()=>setCam(b.dataset.c));
$('#bLabels').onclick=()=>{labelsOn=!labelsOn;$('#bLabels').classList.toggle('on',labelsOn);};
canvas.addEventListener('pointerdown',()=>{if(cine)stopCine();fly=null;});
canvas.addEventListener('wheel',()=>{if(cine)stopCine();fly=null;},{passive:true});
let look=null;
canvas.addEventListener('pointerdown',e=>{if(!fp)return;look={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!fp||!look||e.pointerId!==look.id)return;
  P.yaw-=(e.clientX-look.x)*.0042;P.pitch=clamp(P.pitch-(e.clientY-look.y)*.0042,-1.2,1.2);look.x=e.clientX;look.y=e.clientY;});
canvas.addEventListener('pointerup',()=>look=null);
{const j=$('#joy'),k=j.querySelector('.k');let id=null;
  const set=e=>{const r=j.getBoundingClientRect();
    let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);
    const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}joy.x=x;joy.y=y;k.style.transform=`translate(${x*36}px,${y*36}px)`;};
  j.addEventListener('pointerdown',e=>{id=e.pointerId;j.setPointerCapture(id);set(e);});
  j.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e);});
  const end=()=>{id=null;joy.x=joy.y=0;k.style.transform='';};
  j.addEventListener('pointerup',end);j.addEventListener('pointercancel',end);}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
  if(fp){if(k==='escape')setCam('orbit');return;}
  if(k==='arrowright'){stopCine();setStage(cur+1,true);}
  if(k==='arrowleft'){stopCine();setStage(cur-1,true);}
  if(k===' '){e.preventDefault();cine?stopCine():startCine();}
  if(k==='l')$('#bLabels').click();
  if(k==='escape')stopCine();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function groundAt(x,z){let g=H(x,z);const lx=-z,lz=x;
  if(cur>=2&&Math.abs(lx)<W/2+.05&&Math.abs(lz)<D/2+.05)g=Math.max(g,SLAB_TOP);
  if(cur>=6){if(lz>D/2&&lz<D/2+2&&Math.abs(lx)<W/2)g=Math.max(g,SLAB_TOP-.02);
    if(lz<-D/2&&lz>-D/2-1.5&&lx<-W/2+4.9&&lx>-W/2)g=Math.max(g,SLAB_TOP-.02);}
  if(cur>=6&&(inPoly(x,z,PARK)||inPoly(x,z,PLAZA)))g=Math.max(g,.06);return g;}
function pushOut(lx,lz,x0,x1,z0,z1,r){if(lx>x0-r&&lx<x1+r&&lz>z0-r&&lz<z1+r){
  const pen=[lx-(x0-r),(x1+r)-lx,lz-(z0-r),(z1+r)-lz],m=Math.min(...pen),i=pen.indexOf(m);
  if(i===0)lx=x0-r;else if(i===1)lx=x1+r;else if(i===2)lz=z0-r;else lz=z1+r;}return[lx,lz];}
function updateFP(dt){const sp=(keys.shift?4.5:2.2)*dt;
  let fw=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y,
      st=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
  const l=Math.hypot(fw,st);if(l>1){fw/=l;st/=l;}
  P.x+=(-Math.sin(P.yaw)*fw+Math.cos(P.yaw)*st)*sp;P.z+=(-Math.cos(P.yaw)*fw-Math.sin(P.yaw)*st)*sp;
  let lx=-P.z,lz=P.x;
  if(cur>=3)[lx,lz]=pushOut(lx,lz,-W/2,W/2,-D/2,D/2,.3);
  if(cur>=6)[lx,lz]=pushOut(lx,lz,W/2,W/2+3,-1.85,1.85,.3);
  P.z=-lx;P.x=lz;
  const gh=groundAt(P.x,P.z);P.h+=(gh-P.h)*Math.min(1,dt*10);
  camera.position.set(P.x,P.h+1.62,P.z);camera.rotation.set(P.pitch,P.yaw,0,'YXZ');}

/* ═══ 루프 ═══ */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(animT<1){animT=Math.min(1,animT+dt/DUR);applyStage();
    document.querySelectorAll('#steps button i').forEach((el,i)=>el.style.width=(i===cur?animT*100:0)+'%');}
  if(cine)updateCine(dt);
  else if(fp)updateFP(dt);
  else if(fly){const t=clamp((now-fly.s)/fly.ms),e=eOut(t);
    camera.position.lerpVectors(fly.p0,fly.pos,e);controls.target.lerpVectors(fly.t0,fly.t,e);
    if(t>=1)fly=null;controls.update();}
  else controls.update();
  if(truck.visible)truck.userData.drum.rotation.x+=dt*2.2;
  for(const c of clouds)c.position.x+=dt*.6;
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  {const az=Math.atan2(camera.position.x-controls.target.x,camera.position.z-controls.target.z);
    const yaw=fp?P.yaw:az;$('#cRose').setAttribute('transform',`rotate(${(yaw*180/Math.PI).toFixed(1)} 39 39)`);}
  updateLabels();renderer.render(scene,camera);}
renderLand();setTime(15.3);setStage(1,false);
camera.position.copy(CAM_HOME.pos);controls.target.copy(CAM_HOME.t);camera.lookAt(controls.target);
requestAnimationFrame(loop);
setTimeout(()=>{$('#loading').style.opacity=0;setTimeout(()=>$('#loading').remove(),700);},300);
window.__sim={setStage,setTime,startCine,setCam,camera,controls,get cur(){return cur;}};
</script>
