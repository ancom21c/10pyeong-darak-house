<style>
:root{--panel:rgba(255,253,248,.94);--line:#ddd3c2;--ink:#2b2824;--mut:#8a8174;--acc:#b5653a;--acc2:#2f5d62}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:14px/1.5 "IBM Plex Sans KR","Malgun Gothic",sans-serif;color:var(--ink);height:100vh;overflow:hidden;background:#9cc8e8}
#wrap{position:fixed;inset:0}
canvas{display:block}
#panel{position:absolute;left:12px;top:12px;width:min(340px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;z-index:10;backdrop-filter:blur(4px)}
#panel h1{font-size:15px;margin:0 0 2px;font-weight:700;letter-spacing:-.3px}
#panel .sub{font-size:11.5px;color:var(--mut);margin-bottom:8px}
#stageBtns{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
#stageBtns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;font:inherit;font-size:11.5px;cursor:pointer}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ===== 기본 설정 ===== */
const wrap=document.getElementById("wrap");
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xbfe0f2,70,190);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,500);
cam.position.set(13,7.5,13);
const controls=new OrbitControls(cam,renderer.domElement);
controls.target.set(2.6,1.6,4); controls.enableDamping=true; controls.maxPolarAngle=Math.PI/2.04; controls.minDistance=4; controls.maxDistance=60;

/* ===== 조명/하늘 ===== */
const hemi=new THREE.HemisphereLight(0xeaf2ff,0x8a7a5e,.75); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffeecc,1.5);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,far:120});
scene.add(sun); scene.add(sun.target);
const sunBall=new THREE.Mesh(new THREE.SphereGeometry(2.2,16,12),new THREE.MeshBasicMaterial({color:0xffe9b0}));
scene.add(sunBall);
const cloudGrp=new THREE.Group(); scene.add(cloudGrp);
for(let i=0;i<6;i++){ const c=new THREE.Mesh(new THREE.SphereGeometry(2.6+Math.random()*2,7,5),
  new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.92}));
  c.position.set(-50+Math.random()*100,24+Math.random()*10,-40+Math.random()*80);
  c.scale.y=.45; cloudGrp.add(c); }

/* ===== 지형: 성토 패드 + 논·밭 ===== */
const gGround=new THREE.Group(); scene.add(gGround);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0x8fae62}));
grass.rotation.x=-Math.PI/2; grass.position.y=-.3; grass.receiveShadow=true; gGround.add(grass);
const pad=new THREE.Mesh(new THREE.BoxGeometry(16.5,.6,17),new THREE.MeshLambertMaterial({color:0xc4b294}));
pad.position.set(4,-.3,4.2); pad.receiveShadow=true; pad.castShadow=true; gGround.add(pad);
const padTop=new THREE.Mesh(new THREE.BoxGeometry(16.5,.06,17),new THREE.MeshLambertMaterial({color:0xbfa87f}));
padTop.position.set(4,.02,4.2); padTop.receiveShadow=true; gGround.add(padTop);
// 논·밭 패치 (동쪽·남쪽)
const fieldMat=(c)=>new THREE.MeshLambertMaterial({color:c});
[[16,10,14,8,0xc9c25e],[24,6,16,10,0xb9b952],[14,26,20,10,0xa8b45e],[30,18,14,9,0xcfc76a],[20,36,26,9,0xb5ad55]].forEach(([x,z,w,d,c])=>{
  const f=new THREE.Mesh(new THREE.PlaneGeometry(w,d),fieldMat(c));
  f.rotation.x=-Math.PI/2; f.position.set(x,-.26,z); f.receiveShadow=true; gGround.add(f); });
// 개울 (동쪽 남류)
function ribbon(pts,w,mat,y){ const cur=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])));
  const N=60,pos=[],idx=[]; const up=new THREE.Vector3(0,1,0);
  for(let i=0;i<=N;i++){ const t=i/N,p=cur.getPoint(t),tg=cur.getTangent(t),n=new THREE.Vector3().crossVectors(up,tg).normalize();
    pos.push(p.x+n.x*w/2,y,p.z+n.z*w/2, p.x-n.x*w/2,y,p.z-n.z*w/2);
    if(i<N){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);} }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat); m.receiveShadow=true; return m; }
gGround.add(ribbon([[34,2],[28,8],[24,14],[22,22],[26,32],[24,44]],1.6,new THREE.MeshLambertMaterial({color:0x7fb2c9}),-.24));

/* ===== 접근 도로 + 옹벽 + 전봇대 ===== */
const road=ribbon([[-16,-12],[-10,-5],[-8,1],[-7.4,7],[-6,11.5],[-2,14],[5,15.2],[13,15.4],[30,15]],4.6,new THREE.MeshLambertMaterial({color:0x5f5f63}),-.22);
gGround.add(road);
gGround.add(ribbon([[-15.6,-11.4],[-9.7,-4.6],[-7.8,1],[-7.15,7],[-5.75,11.3],[-1.9,13.6],[5,14.8],[13,15]],.16,new THREE.MeshLambertMaterial({color:0xd8d2c0}),-.2)); // 흰 가드라인
// 블록 옹벽 (패드 서쪽·남쪽 가장자리)
const blockMat=new THREE.MeshLambertMaterial({color:0x9a9a94});
const wallSeg=(x1,z1,x2,z2,h)=>{ const len=Math.hypot(x2-x1,z2-z1);
  const m=new THREE.Mesh(new THREE.BoxGeometry(len,h,.42),blockMat);
  m.position.set((x1+x2)/2,h/2-.1,(z1+z2)/2); m.rotation.y=-Math.atan2(z2-z1,x2-x1);
  m.castShadow=m.receiveShadow=true; gGround.add(m); };
wallSeg(-3.6,-4.2,-3.9,11.8,1.15); wallSeg(-3.9,11.8,3.4,13.4,1.0); wallSeg(3.4,13.4,11.6,13.9,1.0);
// 돌담(자갈 쌓기, 사진1 전경) — 패드 남서 코너
const stoneMat=new THREE.MeshLambertMaterial({color:0x8d8d88});
for(let i=0;i<8;i++){ const s=new THREE.Mesh(new THREE.DodecahedronGeometry(.42+Math.random()*.2,0),stoneMat);
  s.position.set(-3.6+Math.random()*.7,.25,10.9+i*.2); s.scale.y=.62; s.castShadow=true; gGround.add(s); }
// 전봇대 + 가로등
function pole(x,z,light){ const g=new THREE.Group();
  const p=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,7,8),new THREE.MeshLambertMaterial({color:0xb8b2a6}));
  p.position.y=3.5; p.castShadow=true; g.add(p);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(1.4,.09,.09),new THREE.MeshLambertMaterial({color:0x555550}));
  arm.position.set(.6,6.7,0); g.add(arm);
  if(light){ const lamp=new THREE.Mesh(new THREE.BoxGeometry(.5,.18,.24),new THREE.MeshLambertMaterial({color:0xfff2c0,emissive:0x8a7a40}));
    lamp.position.set(1.2,6.62,0); g.add(lamp); }
  g.position.set(x,0,z); g.rotation.y=Math.random()*Math.PI; gGround.add(g); return g; }
pole(-6.2,2,false); pole(-5.8,9.5,false); pole(-5.2,13.6,true);
const wireMat=new THREE.LineBasicMaterial({color:0x2b2824});
[[[-6.2,6.7,2],[-5.8,6.7,9.5]],[[-5.8,6.7,9.5],[-5.2,6.7,13.6]],[[-5.2,6.7,13.6],[-2,6.9,17]],[[-6.2,6.7,2],[-6.8,6.9,-4]]].forEach(seg=>{
  const g=new THREE.BufferGeometry().setFromPoints(seg.map(p=>new THREE.Vector3(...p)));
  gGround.add(new THREE.Line(g,wireMat)); });

/* ===== 저폴리 산 능선 (북·서 배경) ===== */
const mtnMat1=new THREE.MeshLambertMaterial({color:0x5d7a4a,flatShading:true});
const mtnMat2=new THREE.MeshLambertMaterial({color:0x4e6b40,flatShading:true});
[[-30,-48,26,15],[-6,-52,34,19],[20,-50,28,14],[44,-46,24,12],[-52,-30,26,13],[-56,-6,30,16],[-50,18,22,10]].forEach(([x,z,r,h],i)=>{
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7,1),i%2?mtnMat2:mtnMat1);
  m.position.set(x,h/2-.5,z); m.rotation.y=Math.random()*Math.PI; gGround.add(m); });

/* ===== 마을 건물군 (도로 반대편 남서, 사진1) ===== */
const villMat=new THREE.MeshLambertMaterial({color:0xdcd6c8});
const villRoof=new THREE.MeshLambertMaterial({color:0x5a4638});
function vHouse(x,z,ry){ const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(4.4,2.3,3.2),villMat); b.position.y=1.15; b.castShadow=true; g.add(b);
  const th=Math.atan(1.1/2.2), sl=Math.hypot(1.1,2.2);
  [[-1,1],[1,-1]].forEach(([s])=>{ const r=new THREE.Mesh(new THREE.BoxGeometry(3.4,.14,sl),villRoof);
    r.position.set(0,2.3+.55, s*1.1); r.rotation.x=s*th; r.castShadow=true; g.add(r); });
  g.position.set(x,0,z); g.rotation.y=ry; gGround.add(g); }
vHouse(-13,4,.4); vHouse(-14.5,9.2,.25); vHouse(-12,13.8,.1); vHouse(-17,0.5,.5);

/* ===== 집 — 평면 좌표(mm) → 현장(m): site_x=plan_y/1000, site_z=plan_x/1000 ===== */
const FLOOR_H=2.6, M2=1000;
const P2=(x,y)=>[y/M2,x/M2];
const WALLS=[
 {x1:0,y1:0,x2:8000,y2:100,lb:1,op:[{a:700,b:2100,t:"win"},{a:3200,b:4400,t:"win"},{a:5500,b:7300,t:"win"}]},
 {x1:0,y1:4400,x2:8000,y2:4500,lb:1,op:[{a:3600,b:4500,t:"door"},{a:400,b:1200,t:"door"},{a:1600,b:2500,t:"win"},{a:6500,b:7700,t:"win"}]},
 {x1:0,y1:100,x2:100,y2:4400,lb:1,op:[{a:2600,b:4100,t:"win"}]},
 {x1:7900,y1:100,x2:8000,y2:4400,lb:1,op:[{a:500,b:1800,t:"win"},{a:2600,b:4100,t:"win"}]},
 {x1:2700,y1:100,x2:2800,y2:4400,lb:1,op:[]},
 {x1:4800,y1:100,x2:4900,y2:4400,lb:1,op:[{a:2900,b:3600,t:"pass"}]},
 {x1:100,y1:2200,x2:7900,y2:2300,lb:1,op:[{a:1700,b:2600,t:"door"},{a:3200,b:4100,t:"door"},{a:5000,b:5800,t:"door"}]},
 {x1:5900,y1:2300,x2:6000,y2:4400,lb:0,op:[{a:2600,b:3300,t:"door"},{a:3600,b:4300,t:"door"}]},
 {x1:7000,y1:2300,x2:7100,y2:3500,lb:0,op:[]},
 {x1:6000,y1:3400,x2:7100,y2:3500,lb:0,op:[]}
];
function wallSegs(){ const out=[];
  WALLS.forEach(w=>{ const horiz=(w.y2-w.y1)<(w.x2-w.x1);
    let cur=horiz?w.x1:w.y1; const segs=[];
    [...w.op].sort((a,b)=>a.a-b.a).forEach(o=>{ segs.push({a:cur,b:o.a,op:null}); segs.push({a:o.a,b:o.b,op:o}); cur=o.b; });
    segs.push({a:cur,b:horiz?w.x2:w.y2,op:null});
    segs.forEach(sg=>{ const len=sg.b-sg.a; if(len<=1)return;
      if(!sg.op){ out.push(horiz?{c:P2((sg.a+sg.b)/2,w.y1),w:w.y2-w.y1,d:len,h:FLOOR_H,y:0}
                                :{c:P2(w.x1,(sg.a+sg.b)/2),w:w.x2-w.x1,d:len,h:FLOOR_H,y:0}); }
      else if(sg.op.t==="win"){ const sy=900,oh=1200;
        out.push(horiz?{c:P2((sg.a+sg.b)/2,w.y1),w:w.y2-w.y1,d:len,h:sy,y:0}:{c:P2(w.x1,(sg.a+sg.b)/2),w:w.x2-w.x1,d:len,h:sy,y:0});
        out.push(horiz?{c:P2((sg.a+sg.b)/2,w.y1),w:w.y2-w.y1,d:len,h:FLOOR_H-sy-oh,y:sy+oh}:{c:P2(w.x1,(sg.a+sg.b)/2),w:w.x2-w.x1,d:len,h:FLOOR_H-sy-oh,y:sy+oh});
      } else if(sg.op.t==="door"){ const dh=2100;
        out.push(horiz?{c:P2((sg.a+sg.b)/2,w.y1),w:w.y2-w.y1,d:len,h:FLOOR_H-dh,y:dh}:{c:P2(w.x1,(sg.a+sg.b)/2),w:w.x2-w.x1,d:len,h:FLOOR_H-dh,y:dh}); } });
  }); return out; }
const segs=wallSegs();
const matWallBase=new THREE.MeshLambertMaterial({color:0xcfc4ae});   // PC 콘크리트
const matWallFin=new THREE.MeshLambertMaterial({color:0xe3d6bf});    // 외장 마감
const matSlab=new THREE.MeshLambertMaterial({color:0xa9a9a4});
const matGlass=new THREE.MeshLambertMaterial({color:0x9fc4d8,transparent:true,opacity:.55});
const matDoor=new THREE.MeshLambertMaterial({color:0x6b4a2e});
const matRoof=new THREE.MeshLambertMaterial({color:0x6e4a34,flatShading:true});
const matWood=new THREE.MeshLambertMaterial({color:0x9a7b55});

function mkBox(o,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(o.w/M2,o.h/M2,o.d/M2),mat);
  m.position.set(o.c[0],(o.y||0)/M2+o.h/M2/2,o.c[1]); m.castShadow=m.receiveShadow=true; return m; }

/* 단계 그룹 */
const g1=new THREE.Group(), g2=new THREE.Group(), g3=new THREE.Group(), g4=new THREE.Group(),
      g5=new THREE.Group(), g6=new THREE.Group();
scene.add(g1,g2,g3,g4,g5,g6);
// — 1: 형틀·철근 —
const formMat=new THREE.MeshLambertMaterial({color:0x7a4a28});
[[[-0.12,-0.12],[4.62,-0.12]],[[-0.12,8.12],[4.62,8.12]],[[-0.12,-0.12],[-0.12,8.12]],[[4.62,-0.12],[4.62,8.12]]].forEach(([a,b])=>{
  const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  const m=new THREE.Mesh(new THREE.BoxGeometry(len,.62,.06),formMat);
  m.position.set((a[0]+b[0])/2,.31,(a[1]+b[1])/2); m.rotation.y=-Math.atan2(b[1]-a[1],b[0]-a[0]); m.castShadow=true; g1.add(m); });
const stakeMat=new THREE.MeshLambertMaterial({color:0x5d3a20});
for(let i=0;i<20;i++){ const t=i/19; let x,z;
  if(t<.4){ x=-0.12+t/.4*4.74; z=-0.12; }
  else if(t<.8){ x=-0.12+(t-.4)/.4*4.74; z=8.12; }
  else if(t<.9){ x=-0.12; z=(t-.8)/.1*8.24; }
  else { x=4.62; z=(t-.9)/.1*8.24; }
  const s=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.8,6),stakeMat);
  s.position.set(x,.3,z); s.castShadow=true; g1.add(s); }
const rebMat=new THREE.MeshLambertMaterial({color:0x6b6b70});
for(let i=0;i<26;i++){ const r=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.55,5),rebMat);
  const side=i%4, k=Math.floor(i/4)/6;
  r.position.set(side===0? k*4.5 : side===1? k*4.5 : side===2? 0 : 4.5, .45, side<2? (side===0?0:8) : k*8);
  g1.add(r); }
for(let i=0;i<3;i++){ const b=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,3.4,5),rebMat);
  b.rotation.z=Math.PI/2; b.position.set(2.2+i*.15,.05,1.2+i*.5); g1.add(b); }
// 인부 2명 + 덤프트럭 (사진 7·11 분위기)
function worker(x,z){ const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.16,.18,.75,8),new THREE.MeshLambertMaterial({color:0xe8862c}));
  body.position.y=.65; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),new THREE.MeshLambertMaterial({color:0xd9a678}));
  head.position.y=1.2; g.add(head);
  const hat=new THREE.Mesh(new THREE.CylinderGeometry(.15,.17,.08,8),new THREE.MeshLambertMaterial({color:0xf2d23c}));
  hat.position.y=1.3; g.add(hat);
  g.position.set(x,0,z); g1.add(g); }

const tmpC=new THREE.Color(), tmpC2=new THREE.Color();
function setTOD(t){ t=t/100;
  const elev=.25+.75*Math.sin(Math.PI*Math.min(Math.max(t,.02),.98));
  const az=(t-.5)*2.4;
  const R=55;
  const x=Math.sin(az)*R, y=6+elev*38, z=Math.cos(az*.4)*R*.4+10;
  sun.position.set(x,y,z); sunBall.position.set(x*1.2,y*1.2,z*1.2);
  const k=t<.5? t*2 : (1-t)*2;
  tmpC.copy(cSkyA).lerp(cSkyN,Math.min(1,k*1.6)); if(t>.6)tmpC.lerp(cSkyE,(t-.6)/.4*.9);
  scene.background=tmpC; scene.fog.color.copy(tmpC);
  tmpC2.copy(cSunA).lerp(cSunN,Math.min(1,k*1.5)); if(t>.6)tmpC2.lerp(cSunE,(t-.6)/.4);
  sun.color.copy(tmpC2);
  sun.intensity=.55+.95*Math.sin(Math.PI*Math.min(Math.max(t,.05),.95));
  hemi.intensity=.4+.45*Math.sin(Math.PI*Math.min(Math.max(t,.05),.95));
  sunBall.material.color.copy(tmpC2); }

const CINE_STAGE_MS=5200, CINE_STAGES=7;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  anims=anims.filter(a=>{ let t=(now-a.t0)/a.dur; if(t>=1)t=1;
    const e=1-Math.pow(1-t,3); const v=a.from+(a.to-a.from)*e;
    a.obj.scale.y=v;
    return t<1; });
  if(cine.on){ const el=(now-cine.t0)/1000;
    const ang=el*.24+2.2, R=14.5;
    cam.position.set(2.5+Math.sin(ang)*R, 5.6+Math.sin(el*.4)*1.6, 4+Math.cos(ang)*R);
    controls.target.set(2.5,1.8,4); cam.lookAt(controls.target);
    const st=Math.min(CINE_STAGES-1,Math.floor(el/(CINE_STAGE_MS/1000)));
    if(st!==cine.lastStage){ cine.lastStage=st; setStage(st,true); }
    const tod=30+Math.min(65,el*.9);
    document.getElementById("tod").value=tod; setTOD(tod); }
  else if(fpMode){ let mx=0,mz=0;
    if(keys["w"]){mx+=Math.sin(fp.yaw);mz+=Math.cos(fp.yaw);} if(keys["s"]){mx-=Math.sin(fp.yaw);mz-=Math.cos(fp.yaw);}
    if(keys["a"]){mx+=Math.cos(fp.yaw);mz-=Math.sin(fp.yaw);} if(keys["d"]){mx-=Math.cos(fp.yaw);mz+=Math.sin(fp.yaw);}
    const L=Math.hypot(mx,mz)||1;
    fp.pos.x=Math.min(Math.max(fp.pos.x+mx/L*.07,-2.5),13.5);
    fp.pos.z=Math.min(Math.max(fp.pos.z+mz/L*.07,-2.5),13.5);
    let y=1.6;
    if(stage>=6&&fp.pos.x>4.4&&fp.pos.x<7.6&&fp.pos.z>.2&&fp.pos.z<7.8)y=.85; // 데크 위
    if(stage>=2&&fp.pos.x>.2&&fp.pos.x<4.3&&fp.pos.z>.2&&fp.pos.z<7.8&&stage<3)y=.95; // 슬래브(벽 상승 전)
    fp.pos.y=y;
    cam.position.copy(fp.pos); cam.lookAt(fp.pos.x+Math.sin(fp.yaw),fp.pos.y,fp.pos.z+Math.cos(fp.yaw)); }
  else controls.update();
  cloudGrp.children.forEach((c,i)=>{ c.position.x+=.004+i*.0007; if(c.position.x>60)c.position.x=-60; });
  renderer.render(scene,cam);
}
loop();
addEventListener("resize",()=>{ renderer.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); });
</script>
