<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   좌표계: +X 동, +Z 남, +Y 위 (m). 대지 패드(성토) 상면 = 0.
   집: 평면 x(남→북, 0..11) / 평면 y(후면 서 → 정면 동, 0..4.5)
       → 월드 X = y - 2.25, Z = 5.5 - x  (정면이 동쪽을 향함)
   근거: intels/site-photos (사진 1~16 기초, 17~21 = 1층 골조 완료 + 다락 골조 상승 중)
        intels/references/건축허가도면.jpg (필지·3m 도로·건물 배치), 건물-비석.jpg (비석 = 건물 좌측)
        intels/GEO-NOTE.md (도로 남·서, 논 동·남, 산 북·서, 마을 남서)
   ================================================================ */

/* ---------- 설계안 (house-plan.html 과 공유: localStorage 'house10.design.v3') ---------- */
const DEFAULT_DESIGN = {
  annex:true,
  walls:[
    {id:'w1',a:[100,100],b:[7900,100],t:200,ext:true},{id:'w2',a:[100,4400],b:[7900,4400],t:200,ext:true},
    {id:'w3',a:[100,100],b:[100,4400],t:200,ext:true,gable:true},{id:'w4',a:[7900,100],b:[7900,4400],t:200,ext:true,gable:true},
    {id:'w5',a:[4900,100],b:[4900,4400],t:150},{id:'w6',a:[4900,1500],b:[7900,1500],t:100},{id:'w7',a:[2900,3400],b:[2900,4400],t:100},
    {id:'a1',a:[7900,100],b:[10900,100],t:200,ext:true,annex:true},{id:'a2',a:[10900,100],b:[10900,3400],t:200,ext:true,annex:true,gable:true},{id:'a3',a:[7900,3400],b:[10900,3400],t:200,ext:true,annex:true},
  ],
  openings:[
    {wall:'w2',off:500,w:1900,kind:'window',sill:500,h:1500},{wall:'w2',off:3150,w:900,kind:'door',sill:0,h:2100,name:'현관문'},
    {wall:'w2',off:5500,w:1200,kind:'window',sill:900,h:1200},{wall:'w1',off:1200,w:1200,kind:'window',sill:1100,h:800},
    {wall:'w1',off:6300,w:600,kind:'window',sill:1500,h:500},{wall:'w3',off:300,w:900,kind:'door',sill:0,h:2100,name:'후문',back:true},
    {wall:'w3',off:2300,w:1200,kind:'window',sill:900,h:1200},{wall:'w4',off:3550,w:600,kind:'window',sill:900,h:1200},
    {wall:'a3',off:800,w:1200,kind:'window',sill:900,h:1200,annex:true},{wall:'a2',off:900,w:1200,kind:'window',sill:900,h:1200,annex:true},
    {wall:'w3',off:1550,w:1200,kind:'window',sill:3000,h:800,floor:'attic'},{wall:'a2',off:1200,w:900,kind:'window',sill:3000,h:600,floor:'attic',annex:true},
    {wall:'w4',off:1550,w:1200,kind:'window',sill:3000,h:800,floor:'attic',noAnnex:true},
  ],
};
function loadDesign(){ try{ const s=JSON.parse(localStorage.getItem('house10.design.v3')); if(s&&s.walls&&s.openings) return s; }catch(e){} return DEFAULT_DESIGN; }
const DESIGN=loadDesign();
const annexOK=o=>(DESIGN.annex||!o.annex)&&!(DESIGN.annex&&o.noAnnex);
const DW=DESIGN.walls.filter(w=>!w.removed&&annexOK(w)&&(w.floor||'f1')==='f1');
const wallById=id=>DESIGN.walls.find(w=>w.id===id);
const HH={eave:2.95, gableBase:2.5, f1Top:2.5, slope:0.72}; const ridgeOf=annex=>HH.eave+0.025+HH.slope*((annex?1.75:2.25)-0.2);
const FL=0.55; // 슬래브 상면 (패드 위)

/* ---------- 렌더러 ---------- */
const host=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0; renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,1200);
camera.position.set(-26,10,30);
const orbit=new OrbitControls(camera,renderer.domElement); orbit.enableDamping=true; orbit.target.set(0,2,0); orbit.maxPolarAngle=Math.PI*0.48; orbit.minDistance=4; orbit.maxDistance=160;
const hemi=new THREE.HemisphereLight(0xcfe3f4,0x6b5a40,0.8); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2dc,2.4); sun.castShadow=true; sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,near:1,far:220}); sun.shadow.bias=-0.0003; sun.shadow.normalBias=0.03; scene.add(sun,sun.target);
scene.fog=new THREE.Fog(0xcfe0ea,120,520);

/* ---------- 유틸 ---------- */
function rng(seed){ let s=seed>>>0; return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296); }
const R=rng(724);
const hash=(a,b)=>{ let h=(a*374761393+b*668265263)>>>0; h=(h^(h>>>13))*1274126177>>>0; return ((h^(h>>>16))>>>0)/4294967296; };
const smooth=(a,b,x)=>{ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };
const lerp=(a,b,t)=>a+(b-a)*t;
function distSeg(px,pz,a,b){ const dx=b[0]-a[0],dz=b[1]-a[1]; const L2=dx*dx+dz*dz||1; let t=((px-a[0])*dx+(pz-a[1])*dz)/L2; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-a[0]-t*dx,pz-a[1]-t*dz); }
function distPoly(px,pz,pts,closed){ let d=1e9; const n=pts.length; for(let i=0;i<(closed?n:n-1);i++) d=Math.min(d,distSeg(px,pz,pts[i],pts[(i+1)%n])); return d; }
function pip(x,z,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const a=poly[i],b=poly[j]; if(((a[1]>z)!==(b[1]>z))&&(x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])) c=!c; } return c; }
function std(o){ return new THREE.MeshStandardMaterial(Object.assign({roughness:.9,metalness:0,flatShading:false},o)); }
function canvasTex(draw,S=256,rep){ const c=document.createElement('canvas'); c.width=c.height=S; draw(c.getContext('2d'),S); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; if(rep) t.repeat.set(rep,rep); return t; }
function shade(hex,v){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; const f=v>=0?(x=>x+(255-x)*v):(x=>x*(1+v)); return `rgb(${f(r)|0},${f(g)|0},${f(b)|0})`; }
function planarUV(geo,scale){ const p=geo.attributes.position,n=geo.attributes.normal,uv=geo.attributes.uv; for(let i=0;i<p.count;i++){ const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i)); let u,v; if(ay>=ax&&ay>=az){u=p.getX(i);v=p.getZ(i);} else if(ax>=az){u=p.getZ(i);v=p.getY(i);} else {u=p.getX(i);v=p.getY(i);} uv.setXY(i,u/scale,v/scale);} uv.needsUpdate=true; return geo; }

/* ---------- 텍스처 ---------- */
const TX={
  siding: canvasTex((g,S)=>{ g.fillStyle='#e7e6e2'; g.fillRect(0,0,S,S); for(let x=0;x<S;x+=32){ g.fillStyle='#c9c7c1'; g.fillRect(x,0,3,S); g.fillStyle='#f5f4f1'; g.fillRect(x+3,0,2,S);} }),
  shingle: canvasTex((g,S)=>{ const r=rng(5); g.fillStyle='#35302c'; g.fillRect(0,0,S,S); const rh=S/8,tw=S/8; for(let y=0;y<8;y++) for(let i=-1;i<9;i++){ const x=i*tw+(y%2?tw/2:0); g.fillStyle=shade('#4a423b',(r()-.5)*.35); g.beginPath(); g.moveTo(x+1,y*rh); g.lineTo(x+tw-1,y*rh); g.lineTo(x+tw-1,y*rh+rh*.7); g.lineTo(x+tw/2,y*rh+rh); g.lineTo(x+1,y*rh+rh*.7); g.closePath(); g.fill(); } }),
  concrete: canvasTex((g,S)=>{ const r=rng(9); g.fillStyle='#bdbab3'; g.fillRect(0,0,S,S); for(let k=0;k<6000;k++){ g.fillStyle=shade('#bdbab3',(r()-.5)*.2); g.fillRect(r()*S,r()*S,1+r()*2,1+r()*2);} g.strokeStyle='rgba(90,90,90,.12)'; for(let k=0;k<6;k++){ g.beginPath(); g.arc(r()*S,r()*S,20+r()*60,0,6.28); g.stroke(); } }),
  form: canvasTex((g,S)=>{ g.fillStyle='#4a3428'; g.fillRect(0,0,S,S); const r=rng(3); for(let k=0;k<1500;k++){ g.fillStyle=shade('#4a3428',(r()-.5)*.35); g.fillRect(r()*S,r()*S,2,2);} for(let x=0;x<S;x+=64){ g.fillStyle='#6b4a2a'; g.fillRect(x,0,6,S);} g.fillStyle='#6b4a2a'; g.fillRect(0,S*.48,S,6); }),
  brick: canvasTex((g,S)=>{ const r=rng(11); g.fillStyle='#8e8a82'; g.fillRect(0,0,S,S); const bh=S/12,bw=S/4; for(let y=0;y<12;y++) for(let i=-1;i<5;i++){ const x=i*bw+(y%2?bw/2:0); g.fillStyle=shade('#9a4a33',(r()-.5)*.28); g.fillRect(x+2,y*bh+2,bw-4,bh-4);} }),
  block: canvasTex((g,S)=>{ const r=rng(13); g.fillStyle='#9d9b95'; g.fillRect(0,0,S,S); const bh=S/4,bw=S/2; for(let y=0;y<4;y++) for(let i=-1;i<3;i++){ const x=i*bw+(y%2?bw/2:0); g.fillStyle=shade('#b8b5ae',(r()-.5)*.18); g.fillRect(x+3,y*bh+3,bw-6,bh-6);} }),
  deck: canvasTex((g,S)=>{ const r=rng(17); for(let y=0;y<10;y++){ g.fillStyle=shade('#9c7350',(r()-.5)*.2); g.fillRect(0,y*S/10,S,S/10-2); g.fillStyle='#4a3424'; g.fillRect(0,y*S/10+S/10-2,S,2);} }),
  grass: canvasTex((g,S)=>{ const r=rng(21); g.fillStyle='#6f9a4a'; g.fillRect(0,0,S,S); for(let k=0;k<16000;k++){ g.fillStyle=shade('#6f9a4a',(r()-.5)*.45); g.fillRect(r()*S,r()*S,1,2);} }),
  soil: canvasTex((g,S)=>{ const r=rng(23); g.fillStyle='#b88e5c'; g.fillRect(0,0,S,S); for(let k=0;k<9000;k++){ g.fillStyle=shade('#b88e5c',(r()-.5)*.4); g.fillRect(r()*S,r()*S,1+r()*2,1+r()*2);} for(let k=0;k<60;k++){ g.fillStyle=shade('#9c8b78',(r()-.5)*.3); g.beginPath(); g.arc(r()*S,r()*S,1.5+r()*4,0,6.28); g.fill(); } }),
  insul: canvasTex((g,S)=>{ g.fillStyle='#7d858d'; g.fillRect(0,0,S,S); g.strokeStyle='#5f666d'; g.lineWidth=3; g.strokeRect(0,0,S,S/2); g.strokeRect(0,S/2,S,S/2); }),
};
const MAT={

let tod=14;
function setTime(t){ tod=t; let i=0; while(i<KEYS.length-2 && t>KEYS[i+1][0]) i++; const a=KEYS[i], b=KEYS[i+1]; const k=Math.max(0,Math.min(1,(t-a[0])/(b[0]-a[0])));
  const C=(x,y)=>new THREE.Color(x).lerp(new THREE.Color(y),k);
  skyMat.uniforms.top.value.copy(C(a[1],b[1])); skyMat.uniforms.hor.value.copy(C(a[2],b[2])); skyMat.uniforms.sunCol.value.copy(C(a[3],b[3])).multiplyScalar(0.9);
  const I=lerp(a[4],b[4],k); sun.intensity=I; sun.color.copy(C(a[5],b[5])); hemi.intensity=0.25+I*0.28; hemi.color.copy(C(a[2],b[2])).lerp(new THREE.Color('#ffffff'),.4);
  scene.fog.color.copy(C(a[2],b[2]));
  const el=THREE.MathUtils.degToRad(Math.max(2,49*Math.sin(Math.PI*Math.max(0,Math.min(1,(t-6.6)/11.6))))); const az=THREE.MathUtils.degToRad(102+(t-6.6)/11.6*156);
  const dir=new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el)); sun.position.copy(dir.clone().multiplyScalar(110)); sun.target.position.set(0,0,0); skyMat.uniforms.sunDir.value.copy(dir);
  const night=smooth(17.4,18.6,t); MAT.glass.emissiveIntensity=stage>=7?night*1.6:0; for(const l of lampLights){ l.L.intensity=night*14; l.head.material.emissiveIntensity=night*2.5; }
  renderer.toneMappingExposure=1.0+night*0.25;
  const hh=Math.floor(t), mm=Math.round((t-hh)*60); document.getElementById('timeTxt').textContent=`${String(hh).padStart(2,'0')}:${String(mm%60).padStart(2,'0')}`; document.getElementById('timeRange').value=t; }

document.getElementById('camSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; b.dataset.c==='fp'?enterFP():(exitFP(),tweenCam(new THREE.Vector3(-22,14,26),new THREE.Vector3(1,1.5,0),1200)); };
function fpStep(dt){ const k=fp.keys; const mf=(k.KeyW||k.ArrowUp?1:0)-(k.KeyS||k.ArrowDown?1:0)-fp.joy.y, mr=(k.KeyD||k.ArrowRight?1:0)-(k.KeyA||k.ArrowLeft?1:0)+fp.joy.x;
  const sp=(k.ShiftLeft||k.ShiftRight?5:2)*dt; const fx=-Math.sin(fp.yaw), fz=-Math.cos(fp.yaw), rx=Math.cos(fp.yaw), rz=-Math.sin(fp.yaw);
  const nx=fp.x+(fx*mf+rx*mr)*sp, nz=fp.z+(fz*mf+rz*mr)*sp; const g0=groundAt(fp.x,fp.z);
  const ok=(x,z)=>!blockedAt(x,z) && groundAt(x,z)-g0<0.75 && Math.hypot(x,z)<150;
  if(ok(nx,nz)){ fp.x=nx; fp.z=nz; } else if(ok(nx,fp.z)) fp.x=nx; else if(ok(fp.x,nz)) fp.z=nz;
  const gy=groundAt(fp.x,fp.z); fp.y+= (gy-fp.y)*Math.min(1,dt*10); camera.position.set(fp.x,fp.y+1.6,fp.z); camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ'); }
let look=null; renderer.domElement.addEventListener('pointerdown',e=>{ if(cine.on) stopCine(); if(!fp.on) return; look={x:e.clientX,y:e.clientY,id:e.pointerId}; });
renderer.domElement.addEventListener('pointermove',e=>{ if(!fp.on||!look||look.id!==e.pointerId) return; fp.yaw-=(e.clientX-look.x)*0.004; fp.pitch=Math.max(-1.2,Math.min(1.2,fp.pitch-(e.clientY-look.y)*0.004)); look.x=e.clientX; look.y=e.clientY; });
addEventListener('pointerup',()=>look=null);
addEventListener('keydown',e=>{ fp.keys[e.code]=true; if(!fp.on){ if(e.key==='ArrowRight'){ stopCine(); setStage(stage+1); } if(e.key==='ArrowLeft'){ stopCine(); setStage(stage-1); } if(e.code==='Space'){ e.preventDefault(); toggleCine(); } } });
addEventListener('keyup',e=>{ fp.keys[e.code]=false; });
{ const joy=document.getElementById('joy'), kn=joy.querySelector('i'); let id=null; joy.addEventListener('pointerdown',e=>{ id=e.pointerId; joy.setPointerCapture(id); e.stopPropagation(); });
  joy.addEventListener('pointermove',e=>{ if(e.pointerId!==id) return; const r=joy.getBoundingClientRect(); let x=(e.clientX-r.left-r.width/2)/(r.width/2), y=(e.clientY-r.top-r.height/2)/(r.height/2); const L=Math.hypot(x,y); if(L>1){x/=L;y/=L;} fp.joy={x,y}; kn.style.transform=`translate(${x*34}px,${y*34}px)`; });
  const end=()=>{ id=null; fp.joy={x:0,y:0}; kn.style.transform=''; }; joy.addEventListener('pointerup',end); joy.addEventListener('pointercancel',end); }

// 시네마틱 순항: 카메라 궤도 이동 + 0→7단계 순차 진행 + 아침→노을
const cine={on:false,t0:0,last:-1};
const CINE_STEP=5.2, CINE_TOTAL=CINE_STEP*8+8;
function toggleCine(){ cine.on?stopCine():startCine(); }
function startCine(){ exitFP(); tween=null; cine.on=true; cine.t0=performance.now(); cine.last=-1; orbit.enabled=false; document.body.classList.add('cine'); document.getElementById('cineBtn').textContent='■ 순항 정지'; document.getElementById('cineBtn').classList.add('on'); }
function stopCine(){ if(!cine.on) return; cine.on=false; orbit.enabled=!fp.on; document.body.classList.remove('cine'); document.getElementById('cineBtn').textContent='▶ 시네마틱 순항'; document.getElementById('cineBtn').classList.remove('on'); orbit.target.set(0,2,0); }
document.getElementById('cineBtn').onclick=toggleCine;
function cineStep(now){ const T=(now-cine.t0)/1000; const tt=T%CINE_TOTAL; const si=Math.min(7,Math.floor(tt/CINE_STEP));
  if(si!==cine.last){ cine.last=si; if(si===0){ prevStage=stage; stage=0; stageStart=now; renderInfo(); } else setStage(si); }
  setTime(lerp(7.2,18.4,Math.min(1,tt/(CINE_TOTAL-2))));
  const a=-2.3+tt*0.075, r=lerp(30,17,smooth(0,CINE_TOTAL*0.8,tt))+Math.sin(tt*0.21)*3, h=lerp(14,4.2,smooth(0,CINE_TOTAL,tt))+Math.sin(tt*0.33)*1.5;
  const target=new THREE.Vector3(0.5,1.6+smooth(CINE_STEP*3,CINE_STEP*5,tt)*1.2,0);
  camera.position.set(Math.cos(a)*r+1,h,Math.sin(a)*r); camera.lookAt(target); }

/* ================================================================
   루프
   ================================================================ */
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });
let last=performance.now();
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(.05,(now-last)/1000); last=now;
  if(cine.on) cineStep(now); else if(tween) tween.step(now); else if(fp.on) fpStep(dt); else orbit.update();
  updateEls(now); sky.position.copy(camera.position); clouds.children.forEach(c=>{ c.position.x+=c.userData.v*dt; if(c.position.x>320) c.position.x=-320; });
  updateLabels(); renderer.render(scene,camera); }
renderInfo(); setTime(14); requestAnimationFrame(loop);
setTimeout(()=>{ const l=document.getElementById('loading'); l.style.opacity=0; setTimeout(()=>l.remove(),900); tweenCam(new THREE.Vector3(-21,9.5,24),new THREE.Vector3(1,1.8,0),2600); hint('지금 현장: 1층 경량철골 완료 + 다락 골조 상승 중 — 단계 버튼/←→ 키, Space = 시네마틱'); },200);
const q=new URLSearchParams(location.search); if(q.has('stage')) { stage=+q.get('stage'); renderInfo(); } if(q.has('t')) setTime(+q.get('t')); if(q.has('cine')) setTimeout(startCine,600);
window.__sim={setStage,setTime,ELS,get stage(){return stage;}};
