<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>청용리 10평 집 · 평면/인테리어 설계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#efede8;--paper:#f8f7f3;--panel:#fff;--ink:#1d2127;--muted:#6b7079;--line:#e3e0d9;--acc:#2f6f5e;--acc-soft:#e3efe9;--warn:#c4552f;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font-family:inherit;font-size:13px;color:inherit}
#app{display:grid;grid-template-rows:56px 1fr;height:100%}
header{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
.brand b{font-weight:700;font-size:15px;letter-spacing:-.2px}
.brand small{color:var(--muted);font-size:11px}
.seg{display:inline-flex;background:#f0eee9;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:9px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#cfcac0}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.sep{width:1px;height:26px;background:var(--line);flex:none}
.grow{flex:1}
.link{color:#fff;background:#1d2127;text-decoration:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px;cursor:pointer}
main{display:grid;grid-template-columns:58px 1fr 310px;min-height:0}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px}
.tool{width:44px;height:44px;border:0;border-radius:11px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted)}
.tool span{font-size:10px}
.tool svg{width:20px;height:20px}
.tool.on{background:var(--acc-soft);color:var(--acc)}
#stage{position:relative;display:flex;min-width:0;min-height:0;background:var(--paper)}
.pane{position:relative;min-width:0;overflow:hidden;transition:flex-grow .7s cubic-bezier(.65,0,.35,1),opacity .5s}
#p2d{flex:1 1 0}
#p3d{flex:0 1 0;opacity:0;border-left:1px solid var(--line)}
#stage.split #p3d{flex-grow:1;opacity:1}
#stage.m3d #p2d{flex-grow:0;opacity:0}
#stage.m3d #p3d{flex-grow:1;opacity:1;border-left:0}
#c2d{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#v3d{position:absolute;inset:0}
#v3d canvas{display:block;touch-action:none}
.badge{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);padding:5px 10px;border-radius:9px;font-size:12px;color:var(--muted);pointer-events:none;backdrop-filter:blur(6px)}
.badge b{color:var(--ink)}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(29,33,39,.82);color:#fff;font-size:12px;padding:6px 12px;border-radius:20px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#v3dbar{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#v3dbar .seg{background:rgba(255,255,255,.9)}
#v3dbar .chip{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:12px}
#joy{position:absolute;left:22px;bottom:56px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.7);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.25)}
#fpbtns{position:absolute;right:16px;bottom:60px;display:none;flex-direction:column;gap:8px}
#fade{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .35s}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:12px 14px 40px}
aside h3{font-size:12px;letter-spacing:.4px;color:var(--muted);font-weight:600;margin:16px 0 8px;text-transform:uppercase}
aside h3:first-child{margin-top:4px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:10px}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row label{width:52px;color:var(--muted);font-size:12px}
.row input[type=number],.row select{flex:1;min-width:0;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:#fff}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lib button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 2px;cursor:pointer;font-size:12px}
.lib button:hover{background:var(--acc-soft);border-color:#bfd8cd}
.rooms .r{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.rooms .r i{width:14px;height:14px;border-radius:4px;display:block;border:1px solid rgba(0,0,0,.15)}
.rooms .r small{color:var(--muted)}
.rooms .r select{grid-column:2/4;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px}
.tot{display:flex;justify-content:space-between;font-weight:600;margin-top:8px;font-size:13px}
.mats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mats button{height:44px;border-radius:9px;border:2px solid transparent;cursor:pointer;background-size:cover;position:relative}
.mats button.on{border-color:var(--acc)}
.mats button span{position:absolute;left:0;right:0;bottom:-16px;font-size:10px;color:var(--muted)}
.note{color:var(--muted);font-size:12px;line-height:1.55}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;background:#fafafa}
#toast{position:fixed;left:50%;top:68px;transform:translateX(-50%) translateY(-10px);background:#1d2127;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:8px;margin-right:4px;vertical-align:middle;border-radius:2px}
#panelToggle{display:none}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:1fr 58px}
  #tools{grid-row:2;flex-direction:row;justify-content:center;border-right:0;border-top:1px solid var(--line);padding:6px}
  aside{position:fixed;left:0;right:0;bottom:58px;max-height:55%;transform:translateY(105%);transition:transform .3s;z-index:20;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
  aside.open{transform:none}
  #panelToggle{display:flex}
  .brand small{display:none}
  #stage.split{flex-direction:column}
  #stage.split #p3d{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><b>청용리 724 · 10평 집</b><small>평면 · 인테리어 설계 도구</small></div>
  <div class="seg" id="modeSeg"><button data-m="2d" class="on">2D 평면</button><button data-m="split">분할</button><button data-m="3d">3D</button></div>
  <div class="seg" id="floorSeg"><button data-f="f1" class="on">1층</button><button data-f="attic">다락</button></div>

  <button class="btn" id="redoBtn" title="다시 실행 (Ctrl+Y)">↷ 다시</button>

  <button class="btn" id="resetBtn" title="기본 설계안으로 되돌리기">초기화</button>
  <button class="btn" id="exportBtn" title="현재 화면 PNG 저장">이미지 내보내기</button>
  <div class="grow"></div>
  <span class="chk" id="saveState">저장됨</span>
  <a class="link" href="site-sim.html">현장 공사 시뮬레이션 →</a>
</header>
<main>
  <nav id="tools">
    <button class="tool on" data-t="select" title="선택·가구 이동 (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 8-6 2-3 6z"/></svg><span>선택</span></button>
    <button class="tool" data-t="measure" title="측정 (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span>측정</span></button>
    <button class="tool" data-t="wall" title="벽 편집 (W)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14"/><path d="M3 12h18M9 5v7M15 12v7"/></svg><span>벽</span></button>
    <button class="tool" data-t="paint" title="바닥재 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M6 16l8-12 4 3-8 12z"/></svg><span>바닥재</span></button>
    <button class="tool" id="panelToggle" title="패널"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>패널</span></button>
  </nav>
  <div id="stage">
    <div class="pane" id="p2d"><canvas id="c2d"></canvas><div class="badge" id="badge2d"></div></div>
    <div class="pane" id="p3d"><div id="v3d"></div>
      <div id="v3dbar">
        <div class="seg" id="camSeg"><button data-c="orbit" class="on">조감도</button><button data-c="fp">1인칭</button></div>
        <label class="chip chk"><input type="checkbox" id="roofChk" checked>지붕</label>
        <label class="chip chk"><input type="checkbox" id="atticChk" checked>다락</label>
      </div>
      <div id="joy"><i></i></div>
      <div id="fpbtns"><button class="btn" id="fpExit">조감도로</button></div>
    </div>
    <div id="fade"></div>
    <div id="hint"></div>
  </div>
  <aside id="panel"></aside>
</main>
</div>
<div id="toast"></div>

<script type="module">

function wlen(w){ return Math.hypot(w.b[0]-w.a[0], w.b[1]-w.a[1]); }

const CELL=50;
function flood(floor){

  const mark=(poly,val)=>{ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const p of poly){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
    const i0=Math.max(0,Math.floor((x0-X0)/CELL)), i1=Math.min(nx-1,Math.floor((x1-X0)/CELL)), j0=Math.max(0,Math.floor((y0-Y0)/CELL)), j1=Math.min(ny-1,Math.floor((y1-Y0)/CELL));

  for(const w of wallsOn(floor)) mark(wallPoly(w),1);
  if(floor==='attic') for(const r of state.railings) mark(segPoly(r.a,r.b,60,0),1);
  for(const v of state.virtual) if(v.floor===floor) mark(segPoly(v.a,v.b,CELL*1.05,0),2);
  const regions=[];
  for(const s of state.seeds){
    if(s.floor!==floor || !annexOK(s)) continue;
    let i=Math.floor((s.x-X0)/CELL), j=Math.floor((s.y-Y0)/CELL), found=false;
    for(let r=0;r<12 && !found;r++) for(let dj=-r;dj<=r && !found;dj++) for(let di=-r;di<=r;di++){ const ii=i+di,jj=j+dj; if(ii<0||jj<0||ii>=nx||jj>=ny) continue; if(!blk[jj*nx+ii]){ i=ii;j=jj;found=true;break; } }
    if(!found) continue;
    const k0=j*nx+i;
    if(lab[k0]>=0){ regions[lab[k0]].seeds.push(s); continue; }
    const id=regions.length, reg={id,seeds:[s],count:0,outside:false,sx:0,sy:0,minx:1e9,miny:1e9,maxx:-1e9,maxy:-1e9};
    regions.push(reg);

      if(px<reg.minx)reg.minx=px; if(py<reg.miny)reg.miny=py; if(px>reg.maxx)reg.maxx=px; if(py>reg.maxy)reg.maxy=py;

      const nb=[ci>0?k-1:-1, ci<nx-1?k+1:-1, cj>0?k-nx:-1, cj<ny-1?k+nx:-1];

    }
  }
  for(let pass=0;pass<2;pass++) for(let k=0;k<nx*ny;k++){ if(blk[k]!==2||lab[k]>=0) continue; const ci=k%nx;
    const nb=[ci>0?k-1:-1, ci<nx-1?k+1:-1, k-nx, k+nx]; for(const q of nb){ if(q>=0&&q<nx*ny&&lab[q]>=0&&blk[q]!==1){ lab[k]=lab[q]; regions[lab[q]].count++; break; } } }
  for(const r of regions){ r.area=r.count*CELL*CELL/1e6; r.cx=r.sx/Math.max(1,r.count); r.cy=r.sy/Math.max(1,r.count);
    const names=[...new Set(r.seeds.map(s=>s.name))]; r.name=names.join(' + '); r.void=r.seeds.every(s=>s.void); r.mat=(r.seeds.find(s=>s.mat)||{}).mat||'oak'; }

  const rects=[]; let open=new Map();

    while(i<nx){ const l=lab[j*nx+i]; if(l<0){i++;continue;} let e=i; while(e+1<nx && lab[j*nx+e+1]===l) e++; runs.set(i+','+e+','+l,{i0:i,i1:e,l}); i=e+1; }
    const next=new Map();
    for(const [key,run] of runs){ const o=open.get(key); if(o){ o.j1=j; next.set(key,o); } else { const r={...run,j0:j,j1:j}; next.set(key,r); } }

    case 'concrete': noise('#b5b3ae',.18,5000); break;
    case 'carpet': noise('#9b9187',.22,9000); break;

function snapToWalls(f,orient){

  }

      if(snappedX.side==='L' && f.x>x && Math.abs((f.x-ex)-(x+h))<tol*1.5){ f.x=x+h+ex; ui.snapInfo=true; }
      if(snappedX.side==='R' && f.x<x && Math.abs((f.x+ex)-(x-h))<tol*1.5){ f.x=x-h-ex; ui.snapInfo=true; } }
    if(hor && snappedY){ const x0=Math.min(w.a[0],w.b[0])-h, x1=Math.max(w.a[0],w.b[0])+h; if(f.x+ex<x0||f.x-ex>x1) continue; const y=w.a[1];
      if(snappedY.side==='T' && f.y>y && Math.abs((f.y-ey)-(y+h))<tol*1.5){ f.y=y+h+ey; ui.snapInfo=true; }

function snapPoint(p){ // 측정용 스냅
  const tol=10/view.s; let best=null, bd=tol;

  for(const o of openingsOn(ui.floor)){ const g=openingGeom(o); cand.push(g.s0,g.s1); }
  for(const f of state.furniture) if(f.floor===ui.floor) cand.push(...furnCorners(f));
  for(const c of cand){ const d=Math.hypot(c[0]-p[0],c[1]-p[1]); if(d<bd){bd=d;best=c;} }
  return best?[...best]:[Math.round(p[0]/10)*10, Math.round(p[1]/10)*10];
}

const selF=()=>state.furniture.find(f=>f.id===ui.sel);
function hitFurniture(p){ for(let i=state.furniture.length-1;i>=0;i--){ const f=state.furniture[i]; if(f.floor!==ui.floor) continue; const a=-f.rot*Math.PI/180, dx=p[0]-f.x, dy=p[1]-f.y; const lx=dx*Math.cos(a)-dy*Math.sin(a), ly=dx*Math.sin(a)+dy*Math.cos(a); if(Math.abs(lx)<=f.w/2&&Math.abs(ly)<=f.d/2) return f; } return null; }
function distSeg(p,a,b){ const dx=b[0]-a[0],dy=b[1]-a[1]; const L2=dx*dx+dy*dy||1; let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy); }
function hitWall(p){ let best=null,bd=1e9; const pool=state.walls.filter(w=>annexOK(w) && (ui.floor==='f1'? w.floor==='f1' : (w.ext||w.floor==='attic')));
  for(const w of pool){ const d=distSeg(p,w.a,w.b)-w.t/2; if(d<6/view.s && d<bd){bd=d;best=w;} } return best; }

  if(ui.tool==='measure'){ const a=snapPoint(p); ui.mDraft={a,b:a}; drag={type:'measure'}; draw2D(); return; }
  if(ui.tool==='paint'){ const reg=derived[ui.floor].at(p[0],p[1]); if(reg && !reg.void){ reg.seeds.forEach(s=>s.mat=ui.paintMat); commit(`${reg.name} 바닥재 → ${MATS[ui.paintMat].n}`); } return; }

    const cs=furnCorners(f); for(let i=0;i<4;i++){ const s=P2S(...cs[i]); if(Math.abs(s[0]-e.offsetX)<8&&Math.abs(s[1]-e.offsetY)<8){ drag={type:'resize',f,ci:i,opp:cs[(i+2)%4]}; return; } } }

    const lx=dx*c+dy*s, ly=-dx*s+dy*c; const w=Math.max(200,Math.round(Math.abs(lx)/10)*10), d=Math.max(200,Math.round(Math.abs(ly)/10)*10);
    const sx=Math.sign(lx)||1, sy=Math.sign(ly)||1; const cxl=sx*w/2, cyl=sy*d/2; f.w=w; f.d=d; f.x=o[0]+cxl*c-cyl*s; f.y=o[1]+cxl*s+cyl*c; draw2D(); live3D(f,true); renderPanelProps(); return; }

    draw2D(); const A=P2S(...a),B=P2S(...b); ctx.strokeStyle='#2f6f5e'; ctx.lineWidth=100*view.s; ctx.globalAlpha=.6; ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle='#2f6f5e'; ctx.font='600 12px "IBM Plex Sans KR"'; ctx.fillText(fmt(Math.hypot(b[0]-a[0],b[1]-a[1]))+' mm',B[0]+10,B[1]-8); return; }
});
function endDrag(e){
  pointers.delete(e.pointerId);
  if(!drag) return; const d=drag; drag=null;

  if(d.type==='move'||d.type==='rot'||d.type==='resize'){ ui.snapInfo=false; commit(); return; }

  if(d.type==='newwall'){ const L=Math.hypot(d.b[0]-d.a[0],d.b[1]-d.a[1]); if(L>=300){ const id='u'+Date.now().toString(36); state.walls.push({id,a:d.a,b:d.b,t:100,bearing:false,ext:false,floor:ui.floor,removed:false,user:true}); ui.selWall=id; commit('새 칸막이벽 추가'); renderPanel(); } else draw2D(); }

function moveWall(id,target){
  const w=wallById(id); const vert=Math.abs(w.a[0]-w.b[0])<1; const old=vert?w.a[0]:w.a[1]; if(old===target) return;
  const lo=Math.min(vert?w.a[1]:w.a[0], vert?w.b[1]:w.b[0]), hi=Math.max(vert?w.a[1]:w.a[0], vert?w.b[1]:w.b[0]);
  const shift=(pt)=>{ if(vert){ if(Math.abs(pt[0]-old)<2 && pt[1]>=lo-2 && pt[1]<=hi+2) pt[0]=target; } else { if(Math.abs(pt[1]-old)<2 && pt[0]>=lo-2 && pt[0]<=hi+2) pt[1]=target; } };
  for(const o of [...state.walls, ...state.virtual]){ if(o===w) continue; shift(o.a); shift(o.b); }
  if(vert){ w.a[0]=w.b[0]=target; } else { w.a[1]=w.b[1]=target; }
  recompute(); draw2D(); live3DFull();
}

window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ spaceDown=true; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){ e.preventDefault(); dupSel(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); document.getElementById('saveBtn').click(); return; }
  if(fp.on) { fp.keys[e.code]=true; return; }
  const f=selF();
  if(e.key==='Delete'||e.key==='Backspace'){ if(f){ delSel(); e.preventDefault(); } return; }
  if(e.key==='Escape'){ ui.sel=null; ui.mDraft=null; renderPanel(); draw2D(); sync3DSelection(); return; }
  if(f && e.key.startsWith('Arrow')){ const s=e.shiftKey?100:10; if(e.key==='ArrowLeft')f.x-=s; if(e.key==='ArrowRight')f.x+=s; if(e.key==='ArrowUp')f.y-=s; if(e.key==='ArrowDown')f.y+=s; e.preventDefault(); commit(); return; }
  const k=e.key.toLowerCase();
  if(k==='r'&&f){ f.rot=(f.rot+90)%360; snapToWalls(f); commit(); return; }
  if(k==='v') setTool('select'); if(k==='m') setTool('measure'); if(k==='w') setTool('wall'); if(k==='f') setTool('paint');
});
window.addEventListener('keyup',e=>{ if(e.code==='Space') spaceDown=false; fp.keys[e.code]=false; });

function rebuild3D(){

  const D1=derived.f1, DA=derived.attic;

  boxAt(-0.05,-0.45,-0.05,8.05,0,4.55,mat('concrete'),house,2);

    const y0 = isAtticWall? H.atticFloor : 0;

    const L=wlen(w), d=wdir(w), n=[-d[1],d[0]]; const mid=[(w.a[0]+w.b[0])/2,(w.a[1]+w.b[1])/2];

    const mats = w.ext ? [mat('wallIn'),mat('wallIn'),mat('top'),mat('wallIn'), inward?mat('wallIn'):mat('siding'), inward?mat('siding'):mat('wallIn')] : mat('wallIn');

    requestAnimationFrame(()=>{ st.className=m==='3d'?'m3d':'split'; setTimeout(()=>{ const a=aerialPose(); tweenCam(a.pos,a.target,1300); },120); }); }
  else if(m==='2d'){ if(fp.on) exitFP(true); const td=topDownPose(); tweenCam(td.pos,td.target,700,()=>{ st.className=''; }); }
  else st.className=m==='3d'?'m3d':'split';
  defaultHint();
}
function enterFP(){ if(ui.mode==='2d') setMode('3d'); ui.cam='fp'; fp.on=true; orbit.enabled=false; fp.x=3.7; fp.z=5.6; fp.level='f1'; fp.onStair=false; fp.yaw=0; fp.pitch=-0.03; fp.h=-0.45;
  const wp=house.localToWorld(new THREE.Vector3(fp.x,1.15,fp.z)); const tgt=house.localToWorld(new THREE.Vector3(fp.x,1.2,fp.z-2)); fp.on=false;
  tweenCam(wp,tgt,1100,()=>{ fp.on=true; }); document.getElementById('joy').style.display=matchMedia('(pointer:coarse)').matches?'block':'none'; document.getElementById('fpbtns').style.display='flex';
  document.querySelectorAll('#camSeg button').forEach(b=>b.classList.toggle('on',b.dataset.c==='fp')); defaultHint(); }
function exitFP(silent){ fp.on=false; ui.cam='orbit'; orbit.enabled=true; document.getElementById('joy').style.display='none'; document.getElementById('fpbtns').style.display='none';
  document.querySelectorAll('#camSeg button').forEach(b=>b.classList.toggle('on',b.dataset.c==='orbit')); if(!silent){ const a=aerialPose(); tweenCam(a.pos,a.target,1100); } defaultHint(); }
document.getElementById('camSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; if(b.dataset.c==='fp') enterFP(); else exitFP(); });
document.getElementById('fpExit').onclick=()=>exitFP();
document.getElementById('roofChk').onchange=e=>{ groups.roof.visible=e.target.checked; };
document.getElementById('atticChk').onchange=e=>{ groups.attic.visible=e.target.checked; for(const f of state.furniture){ const g=furnMeshes.get(f.id); if(g) g.visible=f.floor!=='attic'||e.target.checked; } };

function resize3D(){ const w=host.clientWidth, h=host.clientHeight; if(w<2||h<2) return; renderer.setSize(w,h,false); renderer.domElement.style.width=w+'px'; renderer.domElement.style.height=h+'px'; camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(()=>{ resize3D(); }).observe(host);
new ResizeObserver(()=>{ const was=view.fitted; resize2D(); }).observe(document.getElementById('p2d'));
let lastT=performance.now();
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  if(ui.mode==='2d' && !tween) return;
  if(tween) tween.step(now); else if(fp.on) fpStep(dt); else orbit.update();
  if(selBox) selBox.update();
  renderer.render(scene,camera); }
requestAnimationFrame(loop);

/* ---- 시작 ---- */
recompute(); renderPanel(); defaultHint(); resize2D(); fit(); draw2D(); document.getElementById('annexChk').checked=state.annex;
document.fonts && document.fonts.ready.then(()=>draw2D());
document.getElementById('saveState').textContent = localStorage.getItem(LS_KEY)?'저장본 불러옴':'기본 설계안';
const q=new URLSearchParams(location.search); if(q.get('mode')) setTimeout(()=>setMode(q.get('mode')),300); if(q.get('cam')==='fp') setTimeout(enterFP,1800);
window.__app={state:()=>state,derived,setMode,enterFP,ui,fp};
</script>
