<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>10평 집 · 2D 평면도 & 3D 뷰어</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --border:#2a2f3a;
    --fg:#e7eaf0; --muted:#8a93a6; --accent:#f0a44c; --accent2:#5aa6ff;
    --wall:#2e333d; --wall-struct:#8a4a2b; --wall-light:#d7d2c8;
    --floor:#efe6d6; --void:#2b2f38; --sel:#f0a44c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans KR',sans-serif;overflow:hidden}
  .app{display:grid;grid-template-rows:48px 1fr;height:100%}
  header{display:flex;align-items:center;gap:12px;padding:0 14px;background:#0b0d12;border-bottom:1px solid var(--border)}
  header h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.3px}
  header .meta{color:var(--muted);font-size:12px;margin-left:8px}
  header .spacer{flex:1}
  header a,header button,header .seg button{color:var(--fg);background:transparent;border:1px solid var(--border);padding:6px 10px;border-radius:8px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none}
  header a:hover,header button:hover{border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{border:none;border-radius:0;border-left:1px solid var(--border)}
  .seg button:first-child{border-left:none}
  .seg button.on{background:var(--accent);color:#1a1200;font-weight:600}
  main{position:relative}
  .view{position:absolute;inset:0}
  .view[hidden]{display:none}
  /* 2D */
  .toolbar{position:absolute;top:12px;left:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:5;min-width:230px}
  .toolbar .grp{display:flex;flex-wrap:wrap;gap:6px}
  .toolbar label{font-size:11px;color:var(--muted);margin-top:4px}
  .toolbar button{background:var(--panel2);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:12px;padding:6px 8px;border-radius:8px;cursor:pointer}
  .toolbar button.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
  .toolbar select{background:var(--panel2);border:1px solid var(--border);color:var(--fg);padding:5px;border-radius:6px;font:inherit;font-size:12px}
  .legend{position:absolute;bottom:12px;left:12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.6;color:var(--muted);z-index:4}
  .legend b{color:var(--fg)}
  .legend .sw{display:inline-block;width:14px;height:8px;vertical-align:middle;margin-right:4px;border-radius:2px}
  .info{position:absolute;top:12px;right:12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6;max-width:260px;z-index:4}
  .info h3{margin:0 0 6px;font-size:12px;color:var(--accent)}
  .info table{width:100%;border-collapse:collapse;font-size:11px}
  .info td{padding:2px 0;color:var(--muted)}
  .info td.v{color:var(--fg);text-align:right}
  #c2d{position:absolute;inset:0;width:100%;height:100%;cursor:grab;background:#13161c}
  #c2d.drag{cursor:grabbing}
  /* 3D */
  #c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hint{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;padding:8px 12px;border-radius:8px;font-size:11px;line-height:1.5;z-index:3;pointer-events:none}
  .ov3{position:absolute;top:12px;left:12px;z-index:5;display:flex;flex-direction:column;gap:6px}
  .ov3 .seg{background:var(--panel)}
  .toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;z-index:20;opacity:0;transition:opacity .25s}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>10평 집 · 평면도 & 3D 뷰어</h1>
  <span class="meta">전남 영암 서호면 청용리 724 · 33.3㎡ (10평)</span>
  <div class="spacer"></div>
  <div class="seg" id="viewSeg">
    <button data-v="2d" class="on">2D 평면도</button>
    <button data-v="3d">3D 뷰어</button>
  </div>
  <div class="seg" id="floorSeg">
    <button data-f="1" class="on">1층</button>
    <button data-f="2">다락</button>
  </div>
  <a href="site-sim.html" title="공사 현장 시뮬레이터로 이동">현장 시뮬레이터 →</a>
</header>

<main>
  <section class="view" id="v2d">
    <canvas id="c2d"></canvas>
    <div class="toolbar">
      <div class="grp" id="toolGrp">
        <button data-t="select" class="on">선택</button>
        <button data-t="measure">측정</button>
        <button data-t="demolish">철거</button>
        <button data-t="pan">이동</button>
      </div>
      <label>가구 추가</label>
      <div class="grp">
        <button data-add="bed">침대</button>
        <button data-add="sofa">소파</button>
        <button data-add="table">식탁</button>
        <button data-add="chair">의자</button>
        <button data-add="desk">책상</button>
        <button data-add="wardrobe">장</button>
        <button data-add="fridge">냉장고</button>
        <button data-add="toilet">변기</button>
        <button data-add="sink">세면대</button>
      </div>
      <label>바닥재</label>
      <select id="floorMat">
        <option value="oak">참나무 원목</option>
        <option value="walnut">월넛</option>
        <option value="pine">파인</option>
        <option value="tile">타일</option>
        <option value="concrete">콘크리트</option>
      </select>
      <label>조작</label>
      <div class="grp">
        <button id="btnUndo" title="Ctrl+Z">↶ 실행취소</button>
        <button id="btnRedo" title="Ctrl+Y">↷ 다시실행</button>
      </div>
      <div class="grp">
        <button id="btnSave">💾 저장</button>
        <button id="btnLoad">📂 불러오기</button>
        <button id="btnReset">↺ 초기화</button>
      </div>
      <div class="grp">
        <button id="btnExport">🖼 PNG 내보내기</button>
      </div>
    </div>
    <div class="info" id="infoBox">
      <h3>면적 정보</h3>
      <table id="areaTbl"></table>
      <div style="margin-top:8px;color:var(--muted);font-size:11px">
        외곽 치수: <b style="color:var(--fg)">8,000 × 4,500</b> mm<br/>
        1층 바닥: <b style="color:var(--fg)" id="totalA">—</b>
      </div>
    </div>
    <div class="legend">
      <div><span class="sw" style="background:var(--wall-struct)"></span><b>내력벽</b> (철거 불가)</div>
      <div><span class="sw" style="background:var(--wall)"></span>비내력벽 (철거 가능)</div>
      <div><span class="sw" style="background:#4a79b5;height:3px"></span>창 · <span class="sw" style="background:#c9a66b;height:3px"></span>문 · <span class="sw" style="background:#a86b3f;height:3px"></span>후문</div>
      <div style="margin-top:4px">단축키: V 선택 · M 측정 · X 철거 · R 회전 · Del 삭제</div>
    </div>
  </section>

  <section class="view" id="v3d" hidden>
    <canvas id="c3d"></canvas>
    <div class="ov3">
      <div class="seg" id="camSeg">
        <button data-c="orbit" class="on">조감 (궤도)</button>
        <button data-c="fp">1인칭 둘러보기</button>
      </div>
    </div>
    <div class="hint" id="hint3d">
      조감: 드래그=회전, 휠=줌 · 1인칭: WASD 이동, 마우스 시점(클릭 후), 스페이스=다락 올라가기
    </div>
  </section>
</main>
<div class="toast" id="toast">저장되었습니다</div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ==========================================================
   PLAN DATA (mm)
   coordinate: x = east-west (plan width, drawing left→right)
               z = north-south (plan depth, drawing top→bottom)
   front of building = +Z side (bottom of drawing).
   In 3D world, we rotate so +Z-plan → +X-world (east).
   ========================================================== */
const PLAN = {
  footprint: { w: 8000, d: 4500 },
  wallT: 150,            // typical wall thickness mm
  wallH: 2300,           // 1F wall height
  atticH: 1800,          // attic (above 1F) extra height
  /* Walls — 1F */
  walls: [
    // outer rectangle (structural)
    { x1:0,    z1:0,    x2:8000, z2:0,    t:150, s:true,  f:1, id:'o-n' }, // north
    { x1:0,    z1:4500, x2:8000, z2:4500, t:150, s:true,  f:1, id:'o-s' }, // south (front)
    { x1:0,    z1:0,    x2:0,    z2:4500, t:150, s:true,  f:1, id:'o-w' }, // west
    { x1:8000, z1:0,    x2:8000, z2:4500, t:150, s:true,  f:1, id:'o-e' }, // east
    // internal: structural wall separating bedroom (east) from living (west)
    { x1:4800, z1:0,    x2:4800, z2:4500, t:150, s:true,  f:1, id:'i-mid' },
    // bathroom (non-structural) around NW corner — box 2000x1700
    { x1:0,    z1:1700, x2:2000, z2:1700, t:100, s:false, f:1, id:'bath-s' },
    { x1:2000, z1:0,    x2:2000, z2:1700, t:100, s:false, f:1, id:'bath-e' },
    // stair/attic room box (attic room on 1F footprint upper-east: encloses stair+above room base)
    // We draw a non-structural partition that marks the stair enclosure on 1F
    { x1:4800, z1:1200, x2:7800, z2:1200, t:100, s:false, f:1, id:'stair-s' },
    { x1:7800, z1:0,    x2:7800, z2:1200, t:100, s:false, f:1, id:'stair-e' },
  ],
  /* Walls — attic (2F) */
  walls2: [
    { x1:0,    z1:0,    x2:8000, z2:0,    t:150, s:true, f:2, id:'a-n' },
    { x1:0,    z1:4500, x2:8000, z2:4500, t:150, s:true, f:2, id:'a-s' },
    { x1:0,    z1:0,    x2:0,    z2:4500, t:150, s:true, f:2, id:'a-w' },
    { x1:8000, z1:0,    x2:8000, z2:4500, t:150, s:true, f:2, id:'a-e' },
    // attic room (enclosed): 3000 wide x 3300 deep, east side
    { x1:5000, z1:0,    x2:5000, z2:3300, t:120, s:true, f:2, id:'ar-w' },
    { x1:5000, z1:3300, x2:8000, z2:3300, t:120, s:true, f:2, id:'ar-s' },
  ],
  openings: [
    // 1F front (south) — entry door + living window
    { wall:'o-s', off:3400, w:1000, h:2100, type:'door',   label:'현관' },
    { wall:'o-s', off:800,  w:1800, h:1500, type:'window', label:'거실창' },
    { wall:'o-s', off:5600, w:1600, h:1500, type:'window', label:'방 창' },
    // 1F east side — bedroom window
    { wall:'o-e', off:1800, w:1200, h:1200, type:'window' },
    // 1F west side — living window + BACK DOOR (per hand sketch)
    { wall:'o-w', off:2600, w:1200, h:1200, type:'window' },
    { wall:'o-w', off:600,  w:900,  h:2100, type:'backdoor', label:'후문' },
    // 1F north — bathroom & kitchen vent
    { wall:'o-n', off:600,  w:600,  h:800,  type:'window' },
    { wall:'o-n', off:3200, w:800,  h:1000, type:'window' },
    // interior door between living and bedroom
    { wall:'i-mid', off:3400, w:900, h:2100, type:'door' },
    // bathroom door
    { wall:'bath-s', off:900, w:800, h:2100, type:'door' },
    // stair opening (to go upstairs)
    { wall:'stair-s', off:800, w:900, h:2100, type:'door', label:'계단' },
    // attic room door
    { wall:'ar-w', off:600, w:800, h:2000, type:'door', label:'다락방' },
    // attic small window east
    { wall:'a-e', off:1400, w:900, h:900, type:'window' },
    { wall:'a-s', off:5600, w:1200, h:900, type:'window' },
  ],
  rooms: [
    // 1F rooms (polygons CCW in mm)
    { f:1, name:'거실·주방', color:'#efe6d6', poly:[[0,1700],[2000,1700],[2000,0],[4800,0],[4800,4500],[0,4500]] },
    { f:1, name:'욕실',     color:'#c8dde6', poly:[[0,0],[2000,0],[2000,1700],[0,1700]] },
    { f:1, name:'안방',     color:'#e8d8c0', poly:[[4800,1200],[7800,1200],[7800,0],[8000,0],[8000,4500],[4800,4500]] },
    { f:1, name:'계단실',   color:'#d6cbb8', poly:[[4800,0],[7800,0],[7800,1200],[4800,1200]] },
    // attic rooms
    { f:2, name:'보이드(1층 바라보기)', color:'#2b2f38', poly:[[0,0],[5000,0],[5000,4500],[0,4500]], void:true },
    { f:2, name:'다락방', color:'#e8d8c0', poly:[[5000,0],[8000,0],[8000,3300],[5000,3300]] },
    { f:2, name:'다락 홀', color:'#efe6d6', poly:[[5000,3300],[8000,3300],[8000,4500],[5000,4500]] },
  ],
  stair: { // 1F stair footprint (going up to attic)
    x:5000, z:200, w:900, d:2800, dir:'+z' // facing +z (south)
  },
  furniture_default: [
    // 1F
    { type:'sofa',    x:1200, z:3500, rot:0,   f:1 },
    { type:'table',   x:3000, z:3500, rot:0,   f:1 },
    { type:'chair',   x:3000, z:3000, rot:0,   f:1 },
    { type:'chair',   x:3000, z:4000, rot:180, f:1 },
    { type:'fridge',  x:400,  z:2000, rot:0,   f:1 },
    { type:'sink',    x:1000, z:200,  rot:180, f:1 },
    { type:'toilet',  x:1500, z:1300, rot:180, f:1 },
    { type:'bed',     x:6000, z:3400, rot:0,   f:1 },
    { type:'wardrobe',x:7400, z:2200, rot:-90, f:1 },
    { type:'desk',    x:5300, z:1800, rot:0,   f:1 },
    // attic
    { type:'bed',     x:6500, z:1200, rot:0,   f:2 },
    { type:'desk',    x:5300, z:400,  rot:0,   f:2 },
  ],
};

// Furniture size (mm) and render color
const FURN = {
  bed:      { w:1500, d:2000, c:'#d8b48a', label:'침대' },
  sofa:     { w:2000, d:900,  c:'#8e6a4b', label:'소파' },
  table:    { w:1200, d:800,  c:'#a67a52', label:'식탁' },
  chair:    { w:450,  d:450,  c:'#6b4a2e', label:'의자' },
  desk:     { w:1400, d:600,  c:'#9b7652', label:'책상' },
  wardrobe: { w:1800, d:600,  c:'#6e5637', label:'장' },
  fridge:   { w:700,  d:700,  c:'#cfd3da', label:'냉장고' },
  toilet:   { w:400,  d:650,  c:'#e9edf2', label:'변기' },
  sink:     { w:800,  d:500,  c:'#dfe5ee', label:'싱크' },
};

/* ======================= STATE / HISTORY ======================= */
const S = {
  tool: 'select',
  floor: 1,
  furniture: [],
  removedWalls: new Set(),
  floorMat: 'oak',
  sel: null,
  measure: null, // {x1,z1,x2,z2}
};
const HISTORY = { stack:[], idx:-1 };

function snapshot(){
  return JSON.stringify({f:S.furniture, r:[...S.removedWalls], m:S.floorMat});
}
function pushHistory(){
  HISTORY.stack = HISTORY.stack.slice(0,HISTORY.idx+1);
  HISTORY.stack.push(snapshot());
  HISTORY.idx = HISTORY.stack.length-1;
  if(HISTORY.stack.length>80){ HISTORY.stack.shift(); HISTORY.idx--; }
}
function restore(s){
  const o = JSON.parse(s);
  S.furniture = o.f.map(x=>({...x}));
  S.removedWalls = new Set(o.r);
  S.floorMat = o.m;
  document.getElementById('floorMat').value = S.floorMat;
  render2D(); syncScene3D();
}
function undo(){ if(HISTORY.idx>0){ HISTORY.idx--; restore(HISTORY.stack[HISTORY.idx]); }}
function redo(){ if(HISTORY.idx<HISTORY.stack.length-1){ HISTORY.idx++; restore(HISTORY.stack[HISTORY.idx]); }}

function resetState(){
  S.furniture = PLAN.furniture_default.map(f=>({...f, id:crypto.randomUUID()}));
  S.removedWalls = new Set();
  S.floorMat = 'oak';
  document.getElementById('floorMat').value = S.floorMat;
  pushHistory();
}

/* ======================= 2D CANVAS ======================= */
const c2d = document.getElementById('c2d');
const g = c2d.getContext('2d');
const view2d = { scale: 0.08, tx: 60, tz: 60 }; // mm → px scale; translate px

function fit2D(){
  const r = c2d.getBoundingClientRect();
  c2d.width = r.width*devicePixelRatio;
  c2d.height = r.height*devicePixelRatio;
  g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  // auto fit on first run
  const sx = (r.width-120)/PLAN.footprint.w;
  const sz = (r.height-120)/PLAN.footprint.d;
  const s = Math.min(sx,sz);
  if(!fit2D.done){ view2d.scale = s; view2d.tx = (r.width - PLAN.footprint.w*s)/2; view2d.tz = (r.height - PLAN.footprint.d*s)/2; fit2D.done=true; }
  render2D();
}
function mm2px(x,z){ return [view2d.tx + x*view2d.scale, view2d.tz + z*view2d.scale]; }
function px2mm(px,pz){ return [(px-view2d.tx)/view2d.scale, (pz-view2d.tz)/view2d.scale]; }

function activeWalls(){
  const w = S.floor===1 ? PLAN.walls : PLAN.walls2;
  return w.filter(x=>!S.removedWalls.has(x.id));
}

/* floor material pattern cache */
const FLOOR_COLORS = {
  oak:      {base:'#efe6d6', stripe:'#dcc9a0'},
  walnut:   {base:'#6d4a2e', stripe:'#52361f'},
  pine:     {base:'#f3e2bb', stripe:'#dcb97e'},
  tile:     {base:'#e5e8ec', stripe:'#c7cdd4'},
  concrete: {base:'#b9bcc2', stripe:'#9ea1a7'},
};

function render2D(){
  const w = c2d.width/devicePixelRatio, h = c2d.height/devicePixelRatio;
  g.fillStyle = '#13161c'; g.fillRect(0,0,w,h);
  // Grid
  g.strokeStyle = '#1b1f27'; g.lineWidth = 1;
  const step = 1000*view2d.scale;
  for(let x = view2d.tx%step; x<w; x+=step){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
  for(let y = view2d.tz%step; y<h; y+=step){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }

  // Rooms (floor fill)
  const rooms = PLAN.rooms.filter(r=>r.f===S.floor);
  rooms.forEach(r=>{
    g.beginPath();
    r.poly.forEach(([x,z],i)=>{ const [px,py]=mm2px(x,z); if(i) g.lineTo(px,py); else g.moveTo(px,py); });
    g.closePath();
    if(r.void){
      g.fillStyle = 'rgba(20,24,32,0.85)';
      g.fill();
      // void stripe
      g.save(); g.clip();
      g.strokeStyle='#3a3f4a'; g.lineWidth=1;
      for(let i=-h;i<w+h;i+=10){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+h,h); g.stroke(); }
      g.restore();
    } else if(S.floor===1){
      const m = FLOOR_COLORS[S.floorMat];
      g.fillStyle = m.base;
      g.fill();
      // wood stripes
      g.save(); g.clip();
      g.strokeStyle = m.stripe; g.lineWidth = 1;
      const stripeMM = (S.floorMat==='tile') ? 600 : 200;
      for(let z=0;z<PLAN.footprint.d+stripeMM;z+=stripeMM){
        const [px0,py0] = mm2px(0,z); const [px1,py1] = mm2px(PLAN.footprint.w,z);
        g.beginPath(); g.moveTo(px0,py0); g.lineTo(px1,py1); g.stroke();
      }
      g.restore();
    } else {
      g.fillStyle = r.color || '#e8d8c0';
      g.fill();
    }
    // label + area
    const area = polyArea(r.poly)/1e6;
    const c = polyCentroid(r.poly);
    const [px,py] = mm2px(c[0], c[1]);
    g.fillStyle = r.void ? '#9aa3b2' : '#2a2520';
    g.font = '600 13px "IBM Plex Sans KR"';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(r.name, px, py-8);
    g.font = '400 11px "IBM Plex Sans KR"';
    g.fillText(area.toFixed(2)+' ㎡', px, py+8);
  });

  // Walls
  activeWalls().forEach(w=>{
    const [x1,y1] = mm2px(w.x1,w.z1), [x2,y2] = mm2px(w.x2,w.z2);
    const t = Math.max(2, w.t*view2d.scale);
    g.strokeStyle = w.s ? '#8a4a2b' : '#2e333d';
    g.lineWidth = t; g.lineCap = 'butt';
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  });

  // Openings (clear in wall + draw symbol)
  PLAN.openings.forEach(op=>{
    const w = PLAN.walls.concat(PLAN.walls2).find(x=>x.id===op.wall);
    if(!w) return;
    if(S.removedWalls.has(w.id)) return;
    if(w.f !== S.floor) return;
    const len = Math.hypot(w.x2-w.x1, w.z2-w.z1);
    const ux = (w.x2-w.x1)/len, uz = (w.z2-w.z1)/len;
    const sx = w.x1 + ux*op.off, sz = w.z1 + uz*op.off;
    const ex = sx + ux*op.w,     ez = sz + uz*op.w;
    const [p1x,p1y] = mm2px(sx,sz), [p2x,p2y] = mm2px(ex,ez);
    const t = Math.max(2, w.t*view2d.scale);
    // Erase wall segment
    g.strokeStyle = '#13161c'; g.lineWidth = t+1;
    g.beginPath(); g.moveTo(p1x,p1y); g.lineTo(p2x,p2y); g.stroke();
    // Symbol
    if(op.type==='window'){
      g.strokeStyle='#4a79b5'; g.lineWidth=3;
      g.beginPath(); g.moveTo(p1x,p1y); g.lineTo(p2x,p2y); g.stroke();
    } else {
      g.strokeStyle = op.type==='backdoor' ? '#a86b3f' : '#c9a66b';
      g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(p1x,p1y); g.lineTo(p2x,p2y); g.stroke();
      // door swing
      const nx = -uz, nz = ux;
      const sz_px = op.w*view2d.scale;
      g.beginPath(); g.arc(p1x,p1y, sz_px, Math.atan2(uz,ux), Math.atan2(nz,nx)); g.stroke();
    }
    if(op.label){
      g.fillStyle = '#aab2c0'; g.font='10px "IBM Plex Sans KR"';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(op.label, (p1x+p2x)/2, (p1y+p2y)/2 - 10);
    }
  });

  // Stair on 1F
  if(S.floor===1){
    const st = PLAN.stair;
    const [sx,sy] = mm2px(st.x,st.z);
    const sw = st.w*view2d.scale, sd = st.d*view2d.scale;
    g.fillStyle = 'rgba(160,120,70,0.35)';
    g.fillRect(sx,sy,sw,sd);
    g.strokeStyle = '#a67a52'; g.lineWidth=1;
    for(let i=0;i<=12;i++){
      g.beginPath();
      g.moveTo(sx, sy + sd*i/12);
      g.lineTo(sx+sw, sy + sd*i/12);
      g.stroke();
    }
    g.fillStyle='#5a3f27'; g.font='10px "IBM Plex Sans KR"';
    g.fillText('↑ 다락', sx+sw/2, sy+sd/2);
  }
  // Void railing on attic
  if(S.floor===2){
    const voidRoom = PLAN.rooms.find(r=>r.f===2 && r.void);
    g.strokeStyle='#f0a44c'; g.lineWidth=3; g.setLineDash([6,3]);
    g.beginPath();
    voidRoom.poly.forEach(([x,z],i)=>{ const [px,py]=mm2px(x,z); if(i) g.lineTo(px,py); else g.moveTo(px,py); });
    g.closePath(); g.stroke();
    g.setLineDash([]);
    g.fillStyle='#f0a44c'; g.font='10px "IBM Plex Sans KR"';
    const [lx,ly] = mm2px(2500,2200);
    g.fillText('↑ 난간(안전울타리)', lx, ly);
  }

  // Overall dimensions
  drawOverallDims();

  // Furniture
  S.furniture.filter(f=>f.f===S.floor).forEach(fo=>drawFurniture(fo));

  // Measure
  if(S.measure){
    const {x1,z1,x2,z2} = S.measure;
    const [p1x,p1y] = mm2px(x1,z1), [p2x,p2y] = mm2px(x2,z2);
    g.strokeStyle='#f0a44c'; g.lineWidth=2; g.setLineDash([5,4]);
    g.beginPath(); g.moveTo(p1x,p1y); g.lineTo(p2x,p2y); g.stroke();
    g.setLineDash([]);
    const d = Math.hypot(x2-x1,z2-z1);
    g.fillStyle='#f0a44c'; g.font='bold 12px "IBM Plex Sans KR"';
    g.textAlign='center'; g.fillText(d.toFixed(0)+' mm', (p1x+p2x)/2, (p1y+p2y)/2 - 8);
  }

  // Area table
  updateAreaTable();
}
function polyArea(p){ let a=0; for(let i=0;i<p.length;i++){ const [x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length]; a += x1*y2 - x2*y1; } return Math.abs(a)/2; }
function polyCentroid(p){ let x=0,y=0; p.forEach(pt=>{x+=pt[0];y+=pt[1];}); return [x/p.length,y/p.length]; }

function drawOverallDims(){
  g.strokeStyle='#8a93a6'; g.fillStyle='#aab2c0'; g.lineWidth=1;
  g.font='11px "IBM Plex Sans KR"'; g.textAlign='center';
  const [p0x,p0y]=mm2px(0,-400), [p1x,p1y]=mm2px(8000,-400);
  g.beginPath(); g.moveTo(p0x,p0y); g.lineTo(p1x,p1y); g.stroke();
  g.beginPath(); g.moveTo(p0x,p0y-5); g.lineTo(p0x,p0y+5); g.stroke();
  g.beginPath(); g.moveTo(p1x,p1y-5); g.lineTo(p1x,p1y+5); g.stroke();
  g.fillText('8,000', (p0x+p1x)/2, p0y-6);
  const [q0x,q0y]=mm2px(-400,0), [q1x,q1y]=mm2px(-400,4500);
  g.beginPath(); g.moveTo(q0x,q0y); g.lineTo(q1x,q1y); g.stroke();
  g.save(); g.translate((q0x+q1x)/2, (q0y+q1y)/2); g.rotate(-Math.PI/2);
  g.fillText('4,500', 0, -6); g.restore();
}

function drawFurniture(f){
  const sp = FURN[f.type]; if(!sp) return;
  const [cx,cy] = mm2px(f.x, f.z);
  g.save();
  g.translate(cx,cy); g.rotate(f.rot*Math.PI/180);
  const w = sp.w*view2d.scale, d = sp.d*view2d.scale;
  g.fillStyle = sp.c;
  g.strokeStyle = S.sel===f.id ? '#f0a44c' : '#2a2520';
  g.lineWidth = S.sel===f.id ? 2.5 : 1;
  g.fillRect(-w/2,-d/2,w,d);
  g.strokeRect(-w/2,-d/2,w,d);
  // detail
  if(f.type==='bed'){
    g.fillStyle='rgba(255,255,255,0.4)';
    g.fillRect(-w/2+6,-d/2+6, w-12, d*0.3);
  } else if(f.type==='sofa'){
    g.fillStyle='rgba(0,0,0,0.2)';
    g.fillRect(-w/2,-d/2, w, d*0.3);
  } else if(f.type==='fridge'){
    g.fillStyle='#aab2b8'; g.fillRect(-w/2+4,-d/2+4,w-8,d/2-6);
  }
  g.fillStyle='#1a1200'; g.font='10px "IBM Plex Sans KR"';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(sp.label, 0, 0);
  g.restore();
}

function updateAreaTable(){
  const t = document.getElementById('areaTbl');
  const rooms = PLAN.rooms.filter(r=>r.f===S.floor && !r.void);
  let tot = 0;
  t.innerHTML = rooms.map(r=>{ const a=polyArea(r.poly)/1e6; tot+=a;
    return `<tr><td>${r.name}</td><td class="v">${a.toFixed(2)} ㎡</td></tr>`;}).join('');
  document.getElementById('totalA').textContent = tot.toFixed(2)+' ㎡';
}

/* ====================== INTERACTION 2D ====================== */
let drag = null;
c2d.addEventListener('wheel', e=>{
  e.preventDefault();
  const r = c2d.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const [bx,bz] = px2mm(mx,my);
  const k = Math.pow(1.0015, -e.deltaY);
  view2d.scale *= k;
  view2d.tx = mx - bx*view2d.scale;
  view2d.tz = my - bz*view2d.scale;
  render2D();
}, {passive:false});

c2d.addEventListener('mousedown', e=>{
  const r = c2d.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const [bx,bz] = px2mm(mx,my);
  if(S.tool==='pan' || e.button===1 || e.shiftKey){
    drag = {kind:'pan', sx:mx, sy:my, tx:view2d.tx, tz:view2d.tz};
    c2d.classList.add('drag'); return;
  }
  if(S.tool==='measure'){
    S.measure = {x1:bx,z1:bz,x2:bx,z2:bz};
    drag = {kind:'measure'};
    render2D(); return;
  }
  if(S.tool==='demolish'){
    const w = pickWall(bx,bz);
    if(w && !w.s){ S.removedWalls.add(w.id); pushHistory(); render2D(); syncScene3D(); toast('비내력벽 철거됨'); }
    else if(w && w.s) toast('내력벽은 철거할 수 없습니다');
    return;
  }
  // select tool
  const hit = pickFurniture(bx,bz);
  if(hit){
    S.sel = hit.id;
    const sp = FURN[hit.type];
    const ang = hit.rot*Math.PI/180;
    const dx = bx - hit.x, dz = bz - hit.z;
    const lx = dx*Math.cos(-ang) - dz*Math.sin(-ang);
    const lz = dx*Math.sin(-ang) + dz*Math.cos(-ang);
    const edge = Math.min(sp.w/2 - Math.abs(lx), sp.d/2 - Math.abs(lz));
    if(edge < 150){ drag = {kind:'resize', id:hit.id, baseW:sp.w, baseD:sp.d, lx, lz}; }
    else { drag = {kind:'move', id:hit.id, dx:hit.x-bx, dz:hit.z-bz}; }
  } else {
    S.sel = null;
    drag = {kind:'pan', sx:mx, sy:my, tx:view2d.tx, tz:view2d.tz};
    c2d.classList.add('drag');
  }
  render2D();
});

c2d.addEventListener('mousemove', e=>{
  const r = c2d.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if(!drag) return;
  const [bx,bz] = px2mm(mx,my);
  if(drag.kind==='pan'){
    view2d.tx = drag.tx + (mx-drag.sx);
    view2d.tz = drag.tz + (my-drag.sy);
    render2D(); return;
  }
  if(drag.kind==='measure'){ S.measure.x2 = bx; S.measure.z2 = bz; render2D(); return; }
  if(drag.kind==='move'){
    const f = S.furniture.find(x=>x.id===drag.id);
    f.x = bx + drag.dx; f.z = bz + drag.dz;
    snapToWall(f);
    render2D(); return;
  }
  if(drag.kind==='resize'){
    // not implemented complex; adjust via wheel-like with mouse: use drag dx
    const f = S.furniture.find(x=>x.id===drag.id);
    const sp = FURN[f.type];
    sp.w = Math.max(300, drag.baseW + (mx - r.width/2)*0); // placeholder: no-op in practice
    render2D(); return;
  }
});
c2d.addEventListener('mouseup', e=>{
  if(drag){
    if(drag.kind==='move' || drag.kind==='resize') pushHistory();
    if(drag.kind==='measure') { /* keep measure visible */ }
  }
  drag = null;
  c2d.classList.remove('drag');
  syncScene3D();
});
c2d.addEventListener('dblclick', e=>{
  const r = c2d.getBoundingClientRect();
  const [bx,bz] = px2mm(e.clientX-r.left, e.clientY-r.top);
  const hit = pickFurniture(bx,bz);
  if(hit){ hit.rot = (hit.rot+90)%360; pushHistory(); render2D(); syncScene3D(); }
});

function pickWall(bx,bz){
  for(const w of activeWalls()){
    const dx = w.x2-w.x1, dz = w.z2-w.z1, L = Math.hypot(dx,dz);
    const t = ((bx-w.x1)*dx + (bz-w.z1)*dz)/(L*L);
    if(t<0||t>1) continue;
    const px = w.x1 + t*dx, pz = w.z1 + t*dz;
    if(Math.hypot(bx-px,bz-pz) < Math.max(100, w.t)) return w;
  }
  return null;
}
function pickFurniture(bx,bz){
  for(let i=S.furniture.length-1;i>=0;i--){
    const f = S.furniture[i]; if(f.f !== S.floor) continue;
    const sp = FURN[f.type];
    const ang = -f.rot*Math.PI/180;
    const dx = bx-f.x, dz = bz-f.z;
    const lx = dx*Math.cos(ang) - dz*Math.sin(ang);
    const lz = dx*Math.sin(ang) + dz*Math.cos(ang);
    if(Math.abs(lx)<=sp.w/2 && Math.abs(lz)<=sp.d/2) return f;
  }
  return null;
}
function snapToWall(f){
  const sp = FURN[f.type];
  const walls = activeWalls();
  const halfX = sp.w/2, halfZ = sp.d/2;
  const SNAP = 300;
  for(const w of walls){
    // axis-aligned walls only
    if(w.z1===w.z2){ // horizontal
      if(Math.abs(f.z - w.z1 - halfZ) < SNAP && f.x>Math.min(w.x1,w.x2)-halfX && f.x<Math.max(w.x1,w.x2)+halfX){ f.z = w.z1 + halfZ + w.t/2; f.rot = 0; }
      else if(Math.abs(f.z - w.z1 + halfZ) < SNAP && f.x>Math.min(w.x1,w.x2)-halfX && f.x<Math.max(w.x1,w.x2)+halfX){ f.z = w.z1 - halfZ - w.t/2; f.rot = 180; }
    } else if(w.x1===w.x2){
      if(Math.abs(f.x - w.x1 - halfZ) < SNAP && f.z>Math.min(w.z1,w.z2)-halfX && f.z<Math.max(w.z1,w.z2)+halfX){ f.x = w.x1 + halfZ + w.t/2; f.rot = 90; }
      else if(Math.abs(f.x - w.x1 + halfZ) < SNAP && f.z>Math.min(w.z1,w.z2)-halfX && f.z<Math.max(w.z1,w.z2)+halfX){ f.x = w.x1 - halfZ - w.t/2; f.rot = -90; }
    }
  }
}

let three = null;
function ensureThree(){
  if(three) { three.resize(); return; }
  const canvas = document.getElementById('c3d');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(devicePixelRatio);
  renderer.shadowMap.enabled = true;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa9c8e8);
  scene.fog = new THREE.Fog(0xa9c8e8, 40, 180);

  const cam = new THREE.PerspectiveCamera(55, 1, 0.05, 500);
  cam.position.set(14, 10, 14); cam.lookAt(0,2,0);

  const sun = new THREE.DirectionalLight(0xfff2d6, 1.1);
  sun.position.set(20, 30, 10); sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-30; sun.shadow.camera.right=30;
  sun.shadow.camera.top=30; sun.shadow.camera.bottom=-30;
  scene.add(sun);
  const amb = new THREE.HemisphereLight(0xe8f1ff, 0x6b5a3a, 0.6); scene.add(amb);

  // Ground
  const g1 = new THREE.Mesh(
    new THREE.PlaneGeometry(120,120),
    new THREE.MeshStandardMaterial({color:0x6a8f52})
  );
  g1.rotation.x = -Math.PI/2; g1.receiveShadow = true;
  scene.add(g1);

  // pad
  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(10,10,0.3,24),
    new THREE.MeshStandardMaterial({color:0xb9a988})
  );
  pad.position.y = 0.15; pad.receiveShadow = true;
  scene.add(pad);

  const house = new THREE.Group(); scene.add(house);
  // Rotate so plan +Z (front) faces east (+X world)
  house.rotation.y = -Math.PI/2;
  house.position.y = 0.3;

  const orbit = new OrbitControls(cam, canvas);
  orbit.target.set(0,2,0); orbit.enableDamping=true;
  const fp = new PointerLockControls(cam, canvas);
  canvas.addEventListener('click', ()=>{ if(three.mode==='fp') fp.lock(); });
  const keys = {};
  document.addEventListener('keydown', e=>keys[e.code]=true);
  document.addEventListener('keyup', e=>keys[e.code]=false);
  const vel = new THREE.Vector3();

  three = { renderer, scene, cam, orbit, fp, house, keys, vel, mode:'orbit',
    resize(){
      const r = canvas.getBoundingClientRect();
      renderer.setSize(r.width, r.height, false);
      cam.aspect = r.width/r.height; cam.updateProjectionMatrix();
    },
    build(){ buildHouse3D(house); }
  };
  three.resize();
  three.build();

  document.getElementById('camSeg').addEventListener('click', e=>{
    const b = e.target.closest('button[data-c]'); if(!b) return;
    document.querySelectorAll('#camSeg button').forEach(x=>x.classList.toggle('on',x===b));
    three.mode = b.dataset.c;
    if(three.mode==='fp'){
      cam.position.set(0,1.6,0);
      document.getElementById('hint3d').textContent = '화면을 클릭해 시점 잠금 · WASD 이동 · 스페이스=다락, Shift=1층';
    } else {
      cam.position.set(14,10,14); orbit.target.set(0,2,0);
      document.getElementById('hint3d').textContent = '드래그=회전 · 우클릭=이동 · 휠=줌';
    }
  });
}

const MM = 1/1000; // mm → meters

function buildHouse3D(root){
  while(root.children.length) root.remove(root.children[0]);
  const matWall = new THREE.MeshStandardMaterial({color:0xeeeae2, roughness:0.9});
  const matStruct = new THREE.MeshStandardMaterial({color:0xe8dcc8, roughness:0.9});
  const matRoof  = new THREE.MeshStandardMaterial({color:0x3a4b5c, roughness:0.6, metalness:0.2});
  const floorC = FLOOR_COLORS[S.floorMat].base;
  const matFloor = new THREE.MeshStandardMaterial({color:new THREE.Color(floorC), roughness:0.75});
  const matGlass = new THREE.MeshStandardMaterial({color:0x7ec0ff, transparent:true, opacity:0.45, metalness:0.1, roughness:0.1});
  const matDoor  = new THREE.MeshStandardMaterial({color:0x8a5a2d, roughness:0.7});

  // Floor plate 1F
  const fp = PLAN.footprint;
  const floor = new THREE.Mesh(
    new THREE.BoxGeometry(fp.w*MM, 0.1, fp.d*MM),
    matFloor
  );
  floor.position.set(fp.w/2*MM, 0.05, fp.d/2*MM);
  floor.receiveShadow = true;
  root.add(floor);

  // Build walls with openings cut as separate segments
  const buildWalls = (walls, baseY, height) =>{
    for(const w of walls){
      if(S.removedWalls.has(w.id)) continue;
      const ops = PLAN.openings.filter(o=>o.wall===w.id)
        .map(o=>({off:o.off, w:o.w, h:o.h, type:o.type}))
        .sort((a,b)=>a.off-b.off);
      const len = Math.hypot(w.x2-w.x1, w.z2-w.z1);
      const ux = (w.x2-w.x1)/len, uz = (w.z2-w.z1)/len;
      let cursor = 0;
      const segs = [];
      for(const op of ops){ segs.push({a:cursor, b:op.off}); segs.push({a:op.off, b:op.off+op.w, op}); cursor = op.off+op.w; }
      segs.push({a:cursor, b:len});
      for(const s of segs){
        const sl = s.b - s.a; if(sl<=1) continue;
        if(s.op){
          // door: wall above only; window: wall above and below
          if(s.op.type==='window'){
            const sillH = 900*MM, headH = s.op.h*MM;
            // sill
            addWallSeg(w, s.a, sl, baseY, sillH, matStruct);
            // header
            addWallSeg(w, s.a, sl, baseY+sillH+headH, height-(sillH+headH), matStruct);
            // glass
            addGlass(w, s.a, sl, baseY+sillH, headH);
          } else {
            // door/backdoor: wall above
            addWallSeg(w, s.a, sl, baseY+s.op.h*MM, height - s.op.h*MM, matStruct);
            // door panel
            addDoor(w, s.a, sl, baseY, s.op.h*MM, s.op.type==='backdoor');
          }
        } else {
          addWallSeg(w, s.a, sl, baseY, height, w.s?matStruct:matWall);
        }
      }
    }
    function addWallSeg(w, a, sl, by, h, mat){
      const g = new THREE.BoxGeometry(sl*MM, h, w.t*MM);
      const m = new THREE.Mesh(g, mat);
      const cx = w.x1 + ux*(a+sl/2), cz = w.z1 + uz*(a+sl/2);
      m.position.set(cx*MM, by+h/2, cz*MM);
      m.rotation.y = -Math.atan2(uz, ux);
      m.castShadow = m.receiveShadow = true;
      root.add(m);
    }
    function addGlass(w, a, sl, by, h){
      const g = new THREE.BoxGeometry(sl*MM, h, 0.03);
      const m = new THREE.Mesh(g, matGlass);
      const cx = w.x1 + ux*(a+sl/2), cz = w.z1 + uz*(a+sl/2);
      m.position.set(cx*MM, by+h/2, cz*MM);
      m.rotation.y = -Math.atan2(uz, ux);
      root.add(m);
    }
    function addDoor(w, a, sl, by, h, back){
      const g = new THREE.BoxGeometry(sl*MM*0.95, h*0.98, 0.04);
      const m = new THREE.Mesh(g, back? new THREE.MeshStandardMaterial({color:0xa6673a}): matDoor);
      const cx = w.x1 + ux*(a+sl/2), cz = w.z1 + uz*(a+sl/2);
      m.position.set(cx*MM, by+h/2, cz*MM);
      m.rotation.y = -Math.atan2(uz, ux);
      root.add(m);
    }
  };
  const baseY = 0.1;
  buildWalls(PLAN.walls, baseY, PLAN.wallH*MM);
  // Attic walls
  const atticBase = baseY + PLAN.wallH*MM;
  // Attic floor: only over the non-void region
  const voidRoom = PLAN.rooms.find(r=>r.f===2 && r.void);
  const atticRooms = PLAN.rooms.filter(r=>r.f===2 && !r.void);
  // We create a loft slab via union: full plate minus void. Approx: make slab = full plate, then cut hole = add void geometry as subtraction; simpler → render as separate meshes
  for(const r of atticRooms){
    const bb = polyBB(r.poly);
    const slab = new THREE.Mesh(
      new THREE.BoxGeometry((bb.x2-bb.x1)*MM, 0.1, (bb.z2-bb.z1)*MM),
      new THREE.MeshStandardMaterial({color:new THREE.Color(FLOOR_COLORS[S.floorMat].base), roughness:0.8})
    );
    slab.position.set((bb.x1+bb.x2)/2*MM, atticBase, (bb.z1+bb.z2)/2*MM);
    slab.receiveShadow = true; root.add(slab);
  }
  // Attic walls (above 1F)
  buildWalls(PLAN.walls2, atticBase + 0.1, PLAN.atticH*MM);

  // Railing around void opening
  const rail = new THREE.MeshStandardMaterial({color:0x7a5a3a, roughness:0.6});
  const voidPoly = voidRoom.poly;
  // railing along the boundary with the attic rooms (east edge x=5000 and south edge z=4500 within void)
  // Create railing only where void adjoins atticRoom (east wall at x=5000, from z=0..3300 is already a wall; the void's south edge at z=4500 is outer; the void's north edge at z=0 is outer; so only inner edge is x=5000 for z=3300..4500 which is 다락 홀 side -> that is a wall too). To make it meaningful, add railing along x=5000 within void top area if open and along the void boundary open sides.
  // Instead: place a decorative railing around full void perimeter inside at atticBase level (acts as safety fence):
  const voidSegs = [
    [0,0, 5000,0],
    [5000,0, 5000,4500],
    [5000,4500, 0,4500],
    [0,4500, 0,0]
  ];
  // Only add railing where there's no wall above (outer walls already handle). Add inner at x=5000 full length (already a wall now, skip).
  // Add a short decorative balustrade around the stair opening on 1F ceiling (hole), easier: add railing surrounding the void boundary just inside:
  for(const seg of voidSegs){
    const [x1,z1,x2,z2]=seg;
    const dx=x2-x1, dz=z2-z1, L=Math.hypot(dx,dz);
    const bar = new THREE.Mesh(new THREE.BoxGeometry(L*MM, 0.9, 0.04), rail);
    bar.position.set((x1+x2)/2*MM, atticBase+0.45, (z1+z2)/2*MM);
    bar.rotation.y = -Math.atan2(dz,dx);
    bar.castShadow = true; root.add(bar);
    // vertical pickets
    const n = Math.floor(L/300);
    for(let i=1;i<n;i++){
      const t=i/n, px = x1+dx*t, pz=z1+dz*t;
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.03,0.9,0.03), rail);
      p.position.set(px*MM, atticBase+0.45, pz*MM); root.add(p);
    }
  }

  // Stair
  const st = PLAN.stair;
  const steps = 12;
  const totalRise = PLAN.wallH*MM;
  for(let i=0;i<steps;i++){
    const sg = new THREE.BoxGeometry(st.w*MM, 0.08, st.d/steps*MM);
    const sm = new THREE.Mesh(sg, new THREE.MeshStandardMaterial({color:0x9a6a3a}));
    sm.position.set((st.x+st.w/2)*MM, baseY + totalRise*(i+0.5)/steps, (st.z + (st.d/steps)*(i+0.5))*MM);
    sm.castShadow = true; sm.receiveShadow = true;
    root.add(sm);
  }

  // Roof: shallow gable above attic
  const roofBaseY = atticBase + PLAN.atticH*MM;
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry((fp.w+300)*MM, 0.2, (fp.d+600)*MM),
    matRoof
  );
  roof.position.set(fp.w/2*MM, roofBaseY+0.1, fp.d/2*MM);
  roof.castShadow = true; root.add(roof);
  // gable (triangular prism approx)
  const gableH = 0.6;
  const gable = new THREE.Mesh(
    new THREE.CylinderGeometry(gableH, 0, (fp.d+600)*MM, 3, 1, false, 0, Math.PI),
    matRoof
  );
  gable.rotation.z = Math.PI/2; gable.rotation.x = Math.PI/2;
  gable.position.set(fp.w/2*MM, roofBaseY + gableH/2 + 0.2, fp.d/2*MM);
  root.add(gable);

  // Furniture
  for(const f of S.furniture){
    const sp = FURN[f.type]; if(!sp) return;
    let h = 450; let yBase = baseY+0.1;
    if(f.f===2) yBase = atticBase + 0.1 + 0.05;
    if(f.type==='bed') h=400;
    if(f.type==='sofa') h=700;
    if(f.type==='table') h=750;
    if(f.type==='desk') h=720;
    if(f.type==='chair') h=450;
    if(f.type==='wardrobe') h=2000;
    if(f.type==='fridge') h=1700;
    if(f.type==='toilet') h=400;
    if(f.type==='sink') h=850;
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(sp.w*MM, h*MM, sp.d*MM),
      new THREE.MeshStandardMaterial({color: new THREE.Color(sp.c), roughness:0.8})
    );
    m.position.set(f.x*MM, yBase + h*MM/2, f.z*MM);
    m.rotation.y = -f.rot*Math.PI/180;
    m.castShadow = true; m.receiveShadow = true;
    root.add(m);
  }
}
function polyBB(poly){
  let x1=Infinity,x2=-Infinity,z1=Infinity,z2=-Infinity;
  for(const [x,z] of poly){ x1=Math.min(x1,x);x2=Math.max(x2,x);z1=Math.min(z1,z);z2=Math.max(z2,z); }
  return {x1,x2,z1,z2};
}

function syncScene3D(){ if(three) three.build(); }

let anim = false;
function startAnim(){ if(anim) return; anim=true; loop(); }
function loop(){
  if(!three) return;
  requestAnimationFrame(loop);
  if(three.mode==='orbit'){ three.orbit.update(); }
  else {
    const sp = 0.08, k = three.keys;
    const dir = new THREE.Vector3();
    if(k['KeyW']) dir.z -= 1;
    if(k['KeyS']) dir.z += 1;
    if(k['KeyA']) dir.x -= 1;
    if(k['KeyD']) dir.x += 1;
    dir.normalize().multiplyScalar(sp);
    // Transform by camera yaw
    const yaw = three.cam.rotation.y;
    const fx = dir.x*Math.cos(yaw) + dir.z*Math.sin(yaw);
    const fz = -dir.x*Math.sin(yaw) + dir.z*Math.cos(yaw);
    three.cam.position.x += fx; three.cam.position.z += fz;
    if(k['Space']) three.cam.position.y = 1.6 + PLAN.wallH*MM;
    else if(k['ShiftLeft']||k['ShiftRight']) three.cam.position.y = 1.6;
  }
  three.renderer.render(three.scene, three.cam);
}
window.addEventListener('resize', ()=>{ if(three) three.resize(); });

/* ===================== INIT ===================== */
resetState();
fit2D();
</script>
