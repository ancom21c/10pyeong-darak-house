<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>하늘집 공사현장 — 단계 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0d12;--panel:#13171f;--ink:#e8ecf1;--mut:#8a93a3;--accent:#9dd1ff;--accent2:#ffbf69}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(10,13,18,.85);backdrop-filter:blur(8px);border-bottom:1px solid #1f2530;z-index:50}
  header .brand{font-weight:600}
  header .brand small{color:var(--mut);margin-left:8px;font-weight:400}
  header .spacer{flex:1}
  header a,header button{background:#1a2030;border:1px solid #2a3140;color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer;text-decoration:none;font-size:13px}
  header a:hover{border-color:var(--accent)}
  main{position:absolute;top:52px;bottom:0;left:0;right:0}
  canvas{display:block;width:100%;height:100%}
  .step-panel{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(19,23,31,.92);backdrop-filter:blur(10px);border:1px solid #262c38;border-radius:14px;padding:14px 18px;min-width:720px;max-width:92vw;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .step-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .step-head .num{background:linear-gradient(135deg,#2b4a70,#4a7fb2);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
  .step-head .ttl{font-weight:600;font-size:15px}
  .step-head .meta{color:var(--mut);font-size:12px;margin-left:auto}
  .step-desc{color:#c3cad6;font-size:13px;line-height:1.6;margin-bottom:10px}
  .step-slider{display:flex;align-items:center;gap:10px}
  .step-slider input{flex:1;accent-color:var(--accent)}
  .step-dots{display:flex;gap:4px}
  .step-dots button{width:28px;height:24px;background:#1f2530;color:var(--mut);border:1px solid #2a3140;border-radius:6px;font:inherit;font-size:11px;cursor:pointer}
  .step-dots button.on{background:#2b4a70;color:#fff;border-color:var(--accent)}
  .right-panel{position:absolute;right:16px;top:70px;display:flex;flex-direction:column;gap:10px;z-index:5}
  .ctrl{background:rgba(19,23,31,.92);backdrop-filter:blur(10px);border:1px solid #262c38;border-radius:10px;padding:10px 12px;min-width:220px}
  .ctrl h4{margin:0 0 6px;font-size:11px;letter-spacing:1px;color:var(--mut);text-transform:uppercase;font-weight:500}
  .ctrl label{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin:4px 0;gap:8px}
  .ctrl input[type=range]{flex:1;accent-color:var(--accent2)}
  .ctrl .seg{display:flex;background:#1f2530;border-radius:7px;padding:3px;gap:2px}
  .ctrl .seg button{flex:1;background:transparent;border:0;color:var(--mut);padding:5px;border-radius:5px;font:inherit;font-size:12px;cursor:pointer}
  .ctrl .seg button.on{background:#2b4a70;color:#fff}
  .ctrl button.big{width:100%;background:linear-gradient(135deg,#2b4a70,#4a7fb2);border:0;color:#fff;padding:9px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer;margin-top:4px;font-weight:500}
  .ctrl button.big.on{background:linear-gradient(135deg,#b2744a,#ffbf69)}
  .notice{position:absolute;left:16px;top:68px;background:rgba(19,23,31,.9);backdrop-filter:blur(8px);border:1px solid #262c38;border-radius:10px;padding:10px 14px;font-size:12px;color:var(--mut);z-index:5;max-width:280px;line-height:1.6}
  .notice b{color:var(--ink);font-weight:500}
  .toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#2b4a70;color:#fff;padding:7px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="brand">하늘집 공사현장 <small>영암 서호면 청용리 724 · 노장길 238 · 단계 시뮬레이션</small></div>
  <div class="spacer"></div>
  <a href="house-plan.html">← 평면도</a>
</header>

<main>
  <canvas id="c"></canvas>

  <div class="notice">
    <b>마우스</b> 드래그=회전 · 휠=줌 · 우클릭=이동<br>
    <b>터치</b> 1손=회전 · 2손=줌/이동<br>
    아래 단계 슬라이더로 시간을 조절하세요.
  </div>

  <div class="right-panel">
    <div class="ctrl">
      <h4>카메라</h4>
      <div class="seg" id="cam-seg">
        <button data-cam="orbit" class="on">조감</button>
        <button data-cam="fp">둘러보기</button>
      </div>
      <button class="big" id="cinema">시네마틱 자동 순항</button>
    </div>
    <div class="ctrl">
      <h4>시간대</h4>
      <label>태양 각도 <input id="sun" type="range" min="5" max="85" value="50"></label>
      <label>색온도 <input id="warm" type="range" min="0" max="100" value="50"></label>
      <div style="font-size:11px;color:var(--mut);margin-top:4px">아침 · 정오 · 노을 그림자 변화</div>
    </div>
    <div class="ctrl">
      <h4>시각화</h4>
      <label><span>지붕 투명</span><input id="rof" type="range" min="0" max="100" value="100"></label>
      <label><span>조경 밀도</span><input id="land" type="range" min="20" max="100" value="80"></label>
      <label><span>안개</span><input id="fog" type="range" min="0" max="100" value="30"></label>
    </div>
  </div>

  <div class="step-panel">
    <div class="step-head">
      <div class="num" id="stepNum">1</div>
      <div class="ttl" id="stepTtl">기초 형틀·철근 (현재 사진 상태)</div>
      <div class="meta" id="stepMeta">0 / 6</div>
    </div>
    <div class="step-desc" id="stepDesc">—</div>
    <div class="step-slider">
      <input id="stepRange" type="range" min="0" max="6" step="0.01" value="2.9">
      <div class="step-dots" id="stepDots"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</main>

<script type="importmap">
{ "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* 평면도 데이터 재사용 (house-plan.html과 동일 치수) */
const DESIGN={outer:{w:8000,d:4500,wall:100},
  floors:{
    1:{height:2300,walls:[
      {a:[0,0],b:[8000,0]},{a:[8000,0],b:[8000,4500]},{a:[8000,4500],b:[0,4500]},{a:[0,4500],b:[0,0]},
      {a:[2600,0],b:[2600,4500]},{a:[5000,0],b:[5000,4500]},
      {a:[2600,2500],b:[5000,2500]},{a:[3700,0],b:[3700,2500]}],
      openings:[
        {wall:1,pos:1200,w:1500,h:1200,sill:900,type:"win"},
        {wall:2,pos:5600,w:1800,h:1400,sill:800,type:"win"},
        {wall:2,pos:2400,w:900,h:900,sill:1300,type:"win"},
        {wall:3,pos:1800,w:900,h:2050,sill:0,type:"back"},
        {wall:0,pos:2900,w:600,h:600,sill:1500,type:"win"},
        {wall:1,pos:3100,w:900,h:2100,sill:0,type:"door"},
        {wall:1,pos:400,w:1700,h:1400,sill:800,type:"win"}]},
    2:{height:1800,walls:[
      {a:[0,0],b:[8000,0]},{a:[8000,0],b:[8000,4500]},{a:[8000,4500],b:[0,4500]},{a:[0,4500],b:[0,0]},
      {a:[5000,0],b:[5000,4500]}],
      openings:[
        {wall:1,pos:1500,w:1200,h:900,sill:400,type:"win"},
        {wall:2,pos:5800,w:1000,h:700,sill:600,type:"win"}]}
  }};
const M=mm=>mm/1000;

/* ============= 단계 정의 (사용자 명세 반영) ============= */
const STAGES = [
  {k:0, name:"0. 빈 대지",
    desc:"성토 패드가 다져지고 진입로가 생긴 상태. 남쪽·동쪽은 논, 서쪽·북쪽은 산림. 노장길이 남쪽 모서리로 들어옴."},
  {k:1, name:"1. 기초 형틀·철근 (사진 1~16)",
    desc:"줄기초/매트기초 형틀을 짜고 피복·배근을 완료. 콘크리트 타설 직전. 현장 사진 초기 번호(1~16)의 상태."},
  {k:2, name:"2. 콘크리트 타설 (스팬덱+75t RC)",
    desc:"매트기초·동결선 아래 줄기초에 콘크리트를 타설, 양생. 상부에 앵커볼트와 베이스플레이트가 매립."},
  {k:3, name:"3. 1층 경량철골 조립",
    desc:"H형강·C형강 기둥·보로 1층 골조를 세우고 수평·수직을 잡아 고정. 바닥 데크(스팬덱) 설치."},
  {k:4, name:"4. 2층(다락) 골조 상승 + 지붕 프레임 (사진 17~34 기준 상태)",
    desc:"다락 층 기둥을 올리고 상부에 지붕 트러스/프레임을 세움. 전체 완성 높이까지 골조가 올라옴. 외장 패널 시공 직전."},
  {k:5, name:"5. 외장 폭양판(PIR) + 지붕 마감",
    desc:"PIR 샌드위치 패널로 외벽 외단열을 시공. 지붕에 아스팔트 슁글 또는 경량 금속지붕 마감."},
  {k:6, name:"6. 창호·마감 완공 (다락방 3,000×3,300 포함)",
    desc:"창호 설치, 외부 도장, 조경·담장·비석 세우기, 바닥 포장. 입주 준비 완료 상태."}
];

/* ============= Three.js 셋업 ============= */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#8aa8c6");
scene.fog = new THREE.Fog("#aec6dc", 40, 220);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
camera.position.set(16, 11, 16);

const orbit = new OrbitControls(camera, canvas);
orbit.target.set(4, 1.5, 2.25);
orbit.enableDamping=true;
orbit.maxPolarAngle = Math.PI*0.49;

/* 조명 */
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x413a2a, 0.55); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 1.3);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-40;sun.shadow.camera.right=40;sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;
sun.shadow.camera.far=120;
scene.add(sun);
scene.add(sun.target);

/* sky dome */
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,32,16), new THREE.ShaderMaterial({
  side:THREE.BackSide, uniforms:{top:{value:new THREE.Color("#4a7ab2")},bot:{value:new THREE.Color("#f8dcb2")}},
  vertexShader:`varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 p;uniform vec3 top;uniform vec3 bot;void main(){float h=clamp(normalize(p).y,0.,1.);gl_FragColor=vec4(mix(bot,top,pow(h,0.7)),1.);}`
})); scene.add(sky);

/* ============= 지형 ============= */
// 성토 패드 중심을 (0,0,0) 근처로 두고, 집은 (DESIGN 중심)에 둠. 집 중심 (4, 2.25)
// 패드는 넓고, 주변은 논밭 평지, 남쪽에 곡선 도로.
const landGroup = new THREE.Group(); scene.add(landGroup);

// 대지 패드 (약간 고도)
const padGeo = new THREE.CylinderGeometry(14, 16, 0.4, 48, 1);
const padMat = new THREE.MeshStandardMaterial({color:"#7a6d55", roughness:0.95});
const pad = new THREE.Mesh(padGeo, padMat);
pad.position.set(4, 0.0, 2.25); pad.receiveShadow=true; landGroup.add(pad);

// 주변 논밭(평평) — 저폴리 패치
const fieldSize = 220;
const field = new THREE.Mesh(new THREE.PlaneGeometry(fieldSize, fieldSize, 1,1), new THREE.MeshStandardMaterial({color:"#5a7a3e", roughness:1}));
field.rotation.x=-Math.PI/2; field.position.y=-0.4; field.receiveShadow=true; landGroup.add(field);

// 논 패치 (사각 블록)
for(let i=0;i<36;i++){
  const w = 8+Math.random()*18, d = 8+Math.random()*18;
  const col = Math.random()<0.5? "#6a8a4a" : "#7a9a5a";
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,d), new THREE.MeshStandardMaterial({color:col,roughness:1}));
  m.rotation.x=-Math.PI/2;
  // scatter outside pad
  let x,z,ok=false;
  for(let t=0;t<10;t++){ x=(Math.random()*2-1)*90; z=(Math.random()*2-1)*90; if(Math.hypot(x-4,z-2.25)>22){ok=true;break;} }
  if(!ok) continue;
  m.position.set(x, -0.39+Math.random()*0.02, z);
  m.receiveShadow=true; landGroup.add(m);
}

// 산 능선 (저폴리 북/서)
function mountain(x,z,w,h){
  const g=new THREE.ConeGeometry(w, h, 6, 1);
  const m=new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:"#3f5544", roughness:1, flatShading:true}));
  m.position.set(x,h/2-0.4,z); m.castShadow=true; m.receiveShadow=true;
  landGroup.add(m);
}
for(let i=-5;i<=5;i++){ mountain(i*14+Math.random()*4, -70+Math.random()*8, 10+Math.random()*8, 8+Math.random()*6); }
for(let i=-4;i<=4;i++){ mountain(-70+Math.random()*8, i*14+Math.random()*4, 9+Math.random()*7, 7+Math.random()*5); }

// 곡선 도로 (남쪽 모서리를 지나 북동으로 올라옴)
const roadPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-90, -0.38, 40),
  new THREE.Vector3(-30, -0.38, 20),
  new THREE.Vector3(-5, -0.38, 12),
  new THREE.Vector3(4, -0.38, 10),
  new THREE.Vector3(20, -0.38, 2),
  new THREE.Vector3(60, -0.38, -20),
  new THREE.Vector3(100, -0.38, -40)
]);
{
  const pts = roadPath.getPoints(200);
  const g = new THREE.BufferGeometry();
  const verts=[], norms=[], idx=[];
  const w=2.6;
  for(let i=0;i<pts.length;i++){
    const p=pts[i], pn=pts[Math.min(i+1,pts.length-1)];
    const dx=pn.x-p.x, dz=pn.z-p.z, l=Math.hypot(dx,dz)||1;
    const nx=-dz/l, nz=dx/l;
    verts.push(p.x+nx*w, p.y, p.z+nz*w);
    verts.push(p.x-nx*w, p.y, p.z-nz*w);
    norms.push(0,1,0,0,1,0);
    if(i<pts.length-1){ const b=i*2; idx.push(b,b+1,b+2, b+1,b+3,b+2); }
  }
  g.setAttribute("position", new THREE.Float32BufferAttribute(verts,3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(norms,3));
  g.setIndex(idx);
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:"#3a3832", roughness:0.95}));
  mesh.receiveShadow=true; landGroup.add(mesh);
  // 중앙선
  const lmesh=new THREE.Mesh(new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(p.x,p.y+0.01,p.z))), new THREE.LineDashedMaterial({color:"#f0c060", dashSize:0.8, gapSize:0.6}));
  lmesh.computeLineDistances(); landGroup.add(lmesh);
}

// 진입로 (대지 남쪽에서 패드 위로)
{
  const g = new THREE.PlaneGeometry(4, 10);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:"#6a5e48", roughness:1}));
  m.rotation.x=-Math.PI/2; m.position.set(4, -0.38, 10); m.receiveShadow=true; landGroup.add(m);
}

// 블록 옹벽/돌담 (패드 남/동 가장자리)
function stoneWall(points,h=0.6){
  const g=new THREE.Group();
  for(let i=0;i<points.length-1;i++){
    const a=points[i], b=points[i+1];
    const dx=b[0]-a[0], dz=b[1]-a[1], len=Math.hypot(dx,dz);
    const stones = Math.max(1,Math.floor(len/0.9));
    for(let s=0;s<stones;s++){
      const t=(s+0.5)/stones;
      const x=a[0]+dx*t, z=a[1]+dz*t;
      const sw=0.6+Math.random()*0.4;
      const sh=h*(0.7+Math.random()*0.5);
      const sd=0.4+Math.random()*0.3;
      const m = new THREE.Mesh(new THREE.BoxGeometry(sw,sh,sd),
        new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.09,0.1,0.35+Math.random()*0.15),roughness:1}));
      m.position.set(x, sh/2-0.2, z);
      m.rotation.y = Math.atan2(dz,dx)+(Math.random()-.5)*0.3;
      m.castShadow=true; m.receiveShadow=true; g.add(m);
    }
  }
  landGroup.add(g); return g;
}
stoneWall([[-10,15],[18,15],[18,-10]], 0.5);

/* 전봇대 + 가로등 */
function pole(x,z){
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.12,5,8), new THREE.MeshStandardMaterial({color:"#8c7a60"}));
  t.position.y=2.5; t.castShadow=true; g.add(t);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.08,0.08), new THREE.MeshStandardMaterial({color:"#555"}));
  arm.position.set(0.5,4.6,0); g.add(arm);
  const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8), new THREE.MeshStandardMaterial({color:"#fff6c0",emissive:"#f6c060",emissiveIntensity:0.6}));
  lamp.position.set(1.1,4.4,0); g.add(lamp);
  g.position.set(x,-0.4,z); landGroup.add(g);
  // 전선
}
pole(-10,8); pole(10,-6); pole(30,-14);

/* 개울 (서쪽) */
{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(60,1.4), new THREE.MeshStandardMaterial({color:"#4a7aa6", roughness:0.3, metalness:0.1}));
  g.rotation.x=-Math.PI/2; g.position.set(-30,-0.37,-5); g.receiveShadow=true; landGroup.add(g);
}

/* ============= 집 (단계별 가변) ============= */
const houseGroup = new THREE.Group();
houseGroup.position.set(0,0,0);
scene.add(houseGroup);

/* 집은 평면도 좌표를 그대로 (0,0,0)~(8m,-,4.5m)로 배치
   정면=동쪽(+X 쪽을 동쪽으로 가정): 평면도 우측 = +X.
   사용자 요구: 정면이 동쪽. 월드 축 가정: +X = 동, +Z = 남 (북 -Z). */

const H = {
  base: new THREE.Group(),
  rebar: new THREE.Group(),
  slab: new THREE.Group(),
  steel: new THREE.Group(),
  atticFrame: new THREE.Group(),
  roofFrame: new THREE.Group(),

/* 외장 PIR 패널 + 창호 포함 벽 */
function makeExtWalls(parent, floor, baseY, panel){
  const F = DESIGN.floors[floor];
  const h = M(F.height);
  const matPanel = panel ? new THREE.MeshStandardMaterial({color:"#ebe6d8", roughness:0.85}) :
                           new THREE.MeshStandardMaterial({color:"#d9d3c0", roughness:0.9, transparent:true, opacity:0.9});
  const matInner = new THREE.MeshStandardMaterial({color:"#dcd4c0", roughness:0.95});
  const matGlass = new THREE.MeshPhysicalMaterial({color:"#a8d0e8", transmission:0.8, roughness:0.1, transparent:true, opacity:0.55, metalness:0.1});
  const matDoor = new THREE.MeshStandardMaterial({color:"#5a3f2a", roughness:0.6});
  const matDoorBack = new THREE.MeshStandardMaterial({color:"#8a3a2a", roughness:0.6});
  F.walls.forEach((w,i)=>{
    const isOuter = i<4;
    const mat = isOuter ? matPanel : matInner;
    const openings = (F.openings||[]).filter(o=>o.wall===i);
    const dx=w.b[0]-w.a[0], dy=w.b[1]-w.a[1], len=Math.hypot(dx,dy);
    const ang=Math.atan2(dy,dx);
    const g=new THREE.Group();
    g.position.set(M(w.a[0]), baseY, M(w.a[1]));
    g.rotation.y = -ang;
    const T = 0.1;
    let cursor=0;
    const cuts = openings.map(o=>({s:o.pos,e:o.pos+o.w, sill:o.sill, h:o.h, type:o.type})).sort((a,b)=>a.s-b.s);
    cuts.forEach(c=>{
      if(c.s>cursor) addSeg(cursor, c.s, 0, h);
      if(c.sill+M(c.h) < h) addSeg(c.s, c.e, c.sill/1000+c.h/1000, h-(c.sill+c.h)/1000);
      if(c.sill>0) addSeg(c.s, c.e, 0, c.sill/1000);
      // 창/문 패널
      const pw = (c.e-c.s)/1000;
      const panelMesh = new THREE.Mesh(new THREE.BoxGeometry(pw, c.h/1000, 0.04),
        c.type==="win"? matGlass : c.type==="back"? matDoorBack : matDoor);
      panelMesh.position.set((c.s+(c.e-c.s)/2)/1000, (c.sill+c.h/2)/1000, 0);
      panelMesh.castShadow=false;
      if(parent===H.windows) g.add(panelMesh);
      cursor=c.e;
    });
    if(cursor<len) addSeg(cursor, len, 0, h);
    function addSeg(s,e,yStart,yH){
      if(parent===H.windows) return;
      if(e-s<=0||yH<=0) return;
      const m=new THREE.Mesh(new THREE.BoxGeometry((e-s)/1000, yH, T), mat);
      m.position.set(((s+e)/2)/1000, yStart+yH/2, 0);
      m.castShadow=true; m.receiveShadow=true;
      g.add(m);
    }
    parent.add(g);
  });
}

let currentFloat = 2.9;   // 사진 17~34 상태 (단계 4 기준) 초깃값 — 완공 미리 보여주는 대신 실제 현재
function setStage(f){
  currentFloat = f;
  const k = Math.max(0,Math.min(6,f));
  // group visibility & scale progression
  // 0: empty pad
  // 1: base formwork + rebar
  // 2: concrete slab (rebar fades)
  // 3: steel 1F frame rises
  // 4: attic + roof frame
  // 5: cladding + roof finish
  // 6: windows + landscape + furniture

  H.base.visible = k >= 0.5 && k < 2.3;
  H.rebar.visible = k >= 0.7 && k < 2.3;
  H.slab.visible = k >= 1.8;

  // steel 1F
  const steelT = THREE.MathUtils.clamp((k-2.5)/1.0, 0, 1);
  H.steel.visible = k >= 2.5;
  H.steel.scale.y = steelT;
  // attic frame
  const atticT = THREE.MathUtils.clamp((k-3.5)/0.9, 0, 1);
  H.atticFrame.visible = k >= 3.5;
  H.atticFrame.scale.y = atticT;
  const roofT = THREE.MathUtils.clamp((k-3.8)/0.9, 0, 1);
  H.roofFrame.visible = k >= 3.7;
  H.roofFrame.scale.y = Math.max(0.01,roofT);
  H.roofFrame.position.y = (1-roofT)*0.3;

  // cladding
  const cladT = THREE.MathUtils.clamp((k-4.5)/0.9, 0, 1);
  H.cladding.visible = k >= 4.5;
  H.cladding.traverse(m=>{ if(m.material){ m.material.transparent = cladT<1; m.material.opacity = cladT; }});
  H.roofFinish.visible = k >= 4.8;
  H.roofFinish.traverse(m=>{ if(m.material){ m.material.transparent = true; m.material.opacity = THREE.MathUtils.clamp((k-4.8)/0.6,0,1); }});

  // windows & doors
  H.windows.visible = k >= 5.3;
  H.windows.traverse(m=>{ if(m.material && !m.material.transmission){ m.material.transparent=true; m.material.opacity=THREE.MathUtils.clamp((k-5.3)/0.5,0,1);}});
  // landscape
  const landT = THREE.MathUtils.clamp((k-5.5)/1.2, 0, 1);
  landscape.visible = k >= 5.5;
  landscape.scale.set(landT*0.3+0.7, landT, landT*0.3+0.7);

  // Panel
  const idx = Math.min(6, Math.round(k));
  const s = STAGES[idx];
  document.getElementById("stepNum").textContent = s.k;
  document.getElementById("stepTtl").textContent = s.name;
  document.getElementById("stepDesc").textContent = s.desc;
  document.getElementById("stepMeta").textContent = `${k.toFixed(1)} / 6`;
  document.querySelectorAll(".step-dots button").forEach(b=> b.classList.toggle("on", parseInt(b.dataset.s)===idx));
  document.getElementById("stepRange").value = f;
}

/* step dots */
const dotsDiv = document.getElementById("stepDots");
STAGES.forEach(s=>{
  const b=document.createElement("button"); b.textContent=s.k; b.dataset.s=s.k;
  b.onclick=()=>setStage(s.k);
  dotsDiv.appendChild(b);
});
document.getElementById("stepRange").oninput = e=> setStage(parseFloat(e.target.value));

/* 카메라 모드 */
let fpControls = new PointerLockControls(camera, canvas);
let mode="orbit";
const keyState={};
document.querySelectorAll("#cam-seg button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#cam-seg button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    mode = b.dataset.cam;
    if(mode==="orbit"){ orbit.enabled=true; fpControls.unlock(); camera.position.set(16,11,16); orbit.target.set(4,1.5,2.25); }
    else { orbit.enabled=false; camera.position.set(4,1.6,-4); camera.lookAt(4,1.6,2.25); }
  };
});
canvas.addEventListener("click", ()=>{ if(mode==="fp") fpControls.lock(); });
window.addEventListener("keydown", e=>keyState[e.code]=true);
window.addEventListener("keyup", e=>keyState[e.code]=false);

/* 시네마틱 */
let cinema=false, cinemaT=0;
document.getElementById("cinema").onclick=e=>{
  cinema=!cinema; e.target.classList.toggle("on", cinema);
  e.target.textContent = cinema? "순항 중단" : "시네마틱 자동 순항";
  if(cinema){ mode="orbit"; orbit.enabled=false; document.querySelector("#cam-seg button[data-cam=orbit]").click(); orbit.enabled=false; }
};

/* 태양/색온도/안개/지붕투명/조경밀도 */
function sunUpdate(){
  const a=parseFloat(document.getElementById("sun").value)*Math.PI/180;
  const r=35;
  sun.position.set(Math.cos(a)*r+4, Math.sin(a)*r+4, Math.sin(a*0.7)*r+2);
  sun.target.position.set(4,0,2.25);
  const warm = parseFloat(document.getElementById("warm").value)/100;
  const col = new THREE.Color().lerpColors(new THREE.Color("#cfe2ff"), new THREE.Color("#ffb060"), warm);
  sun.color.copy(col);
  renderer.toneMappingExposure = 0.9 + warm*0.4;
  // sky bottom
  sky.material.uniforms.bot.value.setHSL(0.07+warm*0.03, 0.6, 0.6-warm*0.15);
  sky.material.uniforms.top.value.setHSL(0.6-warm*0.1, 0.4, 0.4-warm*0.1);
}
document.getElementById("sun").oninput=sunUpdate;
document.getElementById("warm").oninput=sunUpdate;
sunUpdate();
document.getElementById("fog").oninput=e=>{
  const v=parseFloat(e.target.value)/100;
  scene.fog.near = 20+v*20;
  scene.fog.far = 220 - v*120;
};
document.getElementById("rof").oninput=e=>{
  const op=parseFloat(e.target.value)/100;
  H.roofFinish.traverse(m=>{ if(m.material){ m.material.transparent=op<1; m.material.opacity=op; }});
};
document.getElementById("land").oninput=e=>{
  const v=parseFloat(e.target.value)/100;
  landscape.scale.set(0.7+v*0.3, v, 0.7+v*0.3);
};

/* 리사이즈 */
function resize(){
  const r=canvas.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect=r.width/r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
resize();

/* 애니메이션 */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();

  if(cinema){
    cinemaT += dt;
    const stage = (cinemaT*0.15) % 7; // 0~6 반복
    setStage(stage);
    const a = cinemaT*0.1;
    camera.position.set(4+Math.cos(a)*18, 7+Math.sin(a*0.7)*3, 2.25+Math.sin(a)*18);
    camera.lookAt(4,1.5,2.25);
  } else if(mode==="fp" && fpControls.isLocked){
    const sp = (keyState["ShiftLeft"]||keyState["ShiftRight"])? 6 : 3;
    const d = sp*dt;
    if(keyState["KeyW"]||keyState["ArrowUp"]) fpControls.moveForward(d);
    if(keyState["KeyS"]||keyState["ArrowDown"]) fpControls.moveForward(-d);
    if(keyState["KeyA"]||keyState["ArrowLeft"]) fpControls.moveRight(-d);
    if(keyState["KeyD"]||keyState["ArrowRight"]) fpControls.moveRight(d);
    camera.position.y = Math.max(0.3, camera.position.y);
  } else if(orbit.enabled){
    orbit.update();
  }

  renderer.render(scene, camera);
}
setStage(2.9);
animate();
</script>
</body>
</html>
