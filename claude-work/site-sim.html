<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>10평 주택 · 공사 단계 시뮬레이션 (영암 서호 청용리 724)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1a17; --mut:#8a8070; --bg:#eceadf; --paper:#faf6ee;
  --accent:#b7542e; --green:#4a7a4a; --line:#d9d2c3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;overflow:hidden}
canvas{display:block}
header{position:fixed;top:0;left:0;right:0;height:48px;padding:0 14px;display:flex;align-items:center;gap:12px;z-index:10;background:rgba(255,253,247,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
header .brand{font-weight:700;letter-spacing:-.01em}
header .brand small{color:var(--mut);font-weight:400;margin-left:8px;font-size:12px}
header .right{margin-left:auto;display:flex;gap:6px}
header a,header button{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:#fff;font:inherit;cursor:pointer}
header a:hover,header button:hover{background:#f6f1e4}
header button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{position:fixed;background:rgba(255,253,247,.94);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.08);padding:12px;z-index:9;backdrop-filter:blur(6px)}
.panel h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600}
#stagePanel{top:64px;left:14px;max-width:320px}
#stagePanel .stages{display:flex;flex-direction:column;gap:4px}
#stagePanel .st{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
#stagePanel .st:hover{background:#f6f1e4}
#stagePanel .st.on{background:#1b1a17;color:#fff;border-color:#1b1a17}
#stagePanel .st .n{width:18px;height:18px;border-radius:50%;background:#e8e2d1;color:#1b1a17;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;flex:0 0 auto}
#stagePanel .st.on .n{background:#b7542e;color:#fff}
#stagePanel .desc{font-size:12px;line-height:1.5;color:#444;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;min-height:40px}
#bottombar{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:8px 14px}
#bottombar input[type=range]{accent-color:var(--accent);width:180px}
#bottombar .lbl{font-size:12px;color:var(--mut);min-width:52px;text-align:right}
#rightPanel{top:64px;right:14px;max-width:260px;display:flex;flex-direction:column;gap:8px}
#rightPanel .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#rightPanel label{font-size:12px;color:#444;display:flex;align-items:center;gap:6px}
#rightPanel button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
#rightPanel button.on{background:#1b1a17;color:#fff;border-color:#1b1a17}
#hint{position:fixed;left:14px;bottom:14px;font-size:11px;color:rgba(255,253,247,.85);background:rgba(27,26,23,.5);padding:4px 10px;border-radius:999px;z-index:8}
#toast{position:fixed;left:50%;top:68px;transform:translateX(-50%);background:#1b1a17;color:#faf6ee;padding:6px 12px;border-radius:999px;font-size:12px;opacity:0;transition:.3s;pointer-events:none;z-index:12}
#toast.on{opacity:.95}
#legend{position:fixed;left:14px;top:50%;transform:translateY(-50%);display:none;padding:10px;max-width:200px;font-size:12px}
#progress{height:3px;background:#eee;border-radius:2px;overflow:hidden;margin-top:4px}
#progress>div{height:100%;background:var(--accent);transition:width .6s ease}
@media (max-width:720px){
  #stagePanel{max-width:260px;font-size:12px}
  #rightPanel{max-width:200px}
  #bottombar input[type=range]{width:120px}
}
</style>
</head>
<body>
<header>
  <div class="brand">현장 시뮬 <small>· 전남 영암 서호 청용리 724 · 공사 단계</small></div>
  <div class="right">
    <button id="playBtn">▶ 시네마</button>
    <button id="viewBtn">1인칭</button>
    <a href="house-plan.html">← 2D/3D 평면</a>
  </div>
</header>

<canvas id="c"></canvas>

<div class="panel" id="stagePanel">
  <h3>공사 단계</h3>
  <div class="stages" id="stageList"></div>
  <div id="progress"><div style="width:0%"></div></div>
  <div class="desc" id="stageDesc">—</div>
</div>

<div class="panel" id="rightPanel">
  <h3>장면 옵션</h3>
  <div class="row">
    <label><input type="checkbox" id="shadows" checked> 그림자</label>
    <label><input type="checkbox" id="birds" checked> 배경</label>
  </div>
  <div class="row">
    <label>조경</label>
    <button id="landToggle" class="on">보기</button>
  </div>
  <div class="row">
    <label>지붕</label>
    <button id="roofT" class="on">보기</button>
  </div>
</div>

<div class="panel" id="bottombar">
  <span class="lbl">단계</span>
  <input type="range" id="stageRange" min="0" max="6" step="0.01" value="4">
  <span class="lbl" id="stageLbl">4</span>
  <span class="lbl" style="margin-left:12px">시간</span>
  <input type="range" id="sunRange" min="6" max="20" step="0.1" value="14">
  <span class="lbl" id="sunLbl">14:00</span>
</div>

<div id="hint">마우스 드래그 회전 · 휠 줌 · 우측 메뉴로 모드 전환</div>
<div id="toast"></div>

<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* =============================================================
   SITE LAYOUT — 영암 서호 청용리 724
   건물 장축 8m는 남북 방향, 동쪽이 정면.
   패드는 11m × 5m (다락방 증축 포함 길이).
   도로는 패드 남쪽 모서리를 지나 북동으로 올라감.
   북/서는 완만한 산 능선, 남/동은 논.
   ============================================================= */
const SITE = {
  pad: { w: 11.5, d: 5.5 },         // 콘크리트 패드 (옹벽 포함)
  building:{ w:8.0, d:4.5, h1:2.3, hAtic:1.8, roofRise:1.1 },
  atticAdd:{ w:3.0, d:3.3 },        // 다락방 증축 (완공 단계)
  pad_offset: {x:0, z:0},           // 월드 기준 (0,0)에 패드 중심
  // monument (비석) west of building
  monument: { x:-3.8, z:-0.5 }
};

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb6cfe4);
scene.fog = new THREE.Fog(0xb6cfe4, 40, 180);

const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 500);
camera.position.set(18, 10, 18);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1, 0); orbit.enableDamping=true; orbit.maxPolarAngle=Math.PI*0.49;
orbit.minDistance=5; orbit.maxDistance=70;

/* Lights */
const hemi = new THREE.HemisphereLight(0xcde3ff, 0x7a6a4a, 0.55); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffeecc, 1.3);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=120;
sun.shadow.camera.left=-40; sun.shadow.camera.right=40;
sun.shadow.camera.top=40; sun.shadow.camera.bottom=-40;
scene.add(sun);
const ambi = new THREE.AmbientLight(0xffffff, 0.15); scene.add(ambi);

/* =============================================================
   TERRAIN — 저폴리 구릉 + 패드
   ============================================================= */
const terrainGroup = new THREE.Group(); scene.add(terrainGroup);
function makeTerrain(){
  // Large ground
  const geo = new THREE.PlaneGeometry(300, 300, 80, 80);
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i);
    const d = Math.hypot(x,y);
    // northwest hills
    const nw = Math.max(0, (-x - y)*0.03) * (1-Math.exp(-d/40));
    const noise = (Math.sin(x*0.11)+Math.cos(y*0.13))*0.3 + (Math.sin(x*0.03+y*0.05))*0.6;
    // ricefields south-east: nearly flat but a bit lower
    const se = Math.min(0, (x+y)*0.015);
    pos.setZ(i, nw*4 + noise*0.4 + se*2 - 0.4);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({color:0x8da56a, roughness:1, flatShading:true});
  const ground = new THREE.Mesh(geo, mat);
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true;
  terrainGroup.add(ground);

  // Rice paddies — flat tiles south/east
  const padGeo = new THREE.PlaneGeometry(10,8, 1,1);
  const padMat = new THREE.MeshStandardMaterial({color:0xb6c478, roughness:1});
  for(let i=0;i<10;i++){
    for(let j=0;j<4;j++){
      const m = new THREE.Mesh(padGeo, padMat.clone());
      m.rotation.x=-Math.PI/2;
      m.position.set(20+i*10 - 5, -0.35, -10 + j*10);
      m.material.color.setHSL(0.22+Math.random()*0.05, 0.4, 0.4+Math.random()*0.08);
      m.receiveShadow=true;
      terrainGroup.add(m);
    }
  }
  // Mountain ridge (low-poly) in NW
  for(let i=0;i<7;i++){
    const h = 8 + Math.random()*8;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(10+Math.random()*6, h, 5),
      new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.3+Math.random()*0.03,0.3,0.28+Math.random()*0.1),flatShading:true,roughness:1}));
    cone.position.set(-50 - i*7 + Math.random()*4, h/2-1, -20 - i*6 + Math.random()*6);
    cone.castShadow=true;
    terrainGroup.add(cone);
  }
  for(let i=0;i<5;i++){
    const h = 10 + Math.random()*10;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(12+Math.random()*6, h, 5),
      new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.3+Math.random()*0.03,0.3,0.3+Math.random()*0.08),flatShading:true,roughness:1}));
    cone.position.set(-30 + i*10, h/2-1, -55 - Math.random()*10);
    terrainGroup.add(cone);
  }

  // Road — curved asphalt strip along south & east
  const roadShape = new THREE.Shape();
  roadShape.moveTo(-80, -22);
  roadShape.quadraticCurveTo(-20, -14, 0, -12);
  roadShape.quadraticCurveTo(20, -10, 60, 8);
  const roadStroke = (shape, w)=>{
    const points = shape.getPoints(60);
    const g = new THREE.BufferGeometry();
    const verts=[]; const idx=[];
    for(let i=0;i<points.length-1;i++){
      const a=points[i], b=points[i+1];
      const dx=b.x-a.x, dy=b.y-a.y; const len=Math.hypot(dx,dy);
      const nx=-dy/len*w/2, ny=dx/len*w/2;
      verts.push(a.x+nx,0,a.y+ny, a.x-nx,0,a.y-ny, b.x+nx,0,b.y+ny, b.x-nx,0,b.y-ny);
      const o=i*4;
      idx.push(o,o+1,o+2, o+1,o+3,o+2);
    }
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
    g.setIndex(idx); g.computeVertexNormals();
    return g;
  };
  const roadGeo = roadStroke(roadShape, 3.0);
  const road = new THREE.Mesh(roadGeo, new THREE.MeshStandardMaterial({color:0x3a3a38, roughness:.95}));
  road.position.y=-0.08; road.receiveShadow=true;
  terrainGroup.add(road);
  // dashed centerline
  const centerGeo = roadStroke(roadShape, 0.1);
  const center = new THREE.Mesh(centerGeo, new THREE.MeshStandardMaterial({color:0xd8c86a}));
  center.position.y=-0.05;
  terrainGroup.add(center);

  // Stream (small) south
  const streamGeo = new THREE.PlaneGeometry(80, 1.2);
  const stream = new THREE.Mesh(streamGeo, new THREE.MeshStandardMaterial({color:0x6a8aa8, roughness:.3, metalness:.1}));
  stream.rotation.x=-Math.PI/2; stream.position.set(10, -0.4, 15); terrainGroup.add(stream);

  // Utility poles
  for(let i=0;i<4;i++){
    const p = pole(); p.position.set(-25+i*20, 0, -11); terrainGroup.add(p);
  }
}
function pole(){
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({color:0x7a6a5a, roughness:.8});
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,6,8), m);
  trunk.position.y=3; trunk.castShadow=true; g.add(trunk);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.06,0.06), m);
  arm.position.y=5.6; g.add(arm);
  // lamp
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8), new THREE.MeshStandardMaterial({color:0xfff2b0, emissive:0xffd96a, emissiveIntensity:0.5}));
  lamp.position.set(0,5.3,0.2); g.add(lamp);
  return g;
}

makeTerrain();

/* =============================================================
   PAD + 옹벽 (block wall) — 사진 1 돌담 + 콘크리트 블록
   ============================================================= */
const padGroup = new THREE.Group(); scene.add(padGroup);
function makePad(){
  // concrete slab
  const slab = new THREE.Mesh(new THREE.BoxGeometry(SITE.pad.w+0.4, 0.5, SITE.pad.d+0.4),
    new THREE.MeshStandardMaterial({color:0xbcb6a6, roughness:.95}));
  slab.position.set(0, -0.1, 0); slab.receiveShadow=true; padGroup.add(slab);
  // Earth fill under pad
  const dirt = new THREE.Mesh(new THREE.BoxGeometry(SITE.pad.w+2, 0.5, SITE.pad.d+2),
    new THREE.MeshStandardMaterial({color:0x8b6a4a, roughness:1}));
  dirt.position.set(0, -0.5, 0); dirt.receiveShadow=true; padGroup.add(dirt);
  // Block retaining wall around pad perimeter
  const bw=0.4, bh=0.5;
  const W=SITE.pad.w+0.4, D=SITE.pad.d+0.4;
  function blockRow(ax,az,bx,bz){
    const len = Math.hypot(bx-ax, bz-az);
    const n = Math.round(len/0.6);
    for(let i=0;i<n;i++){
      const t=(i+0.5)/n;
      const x=ax+(bx-ax)*t, z=az+(bz-az)*t;
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.58, bh, bw),
        new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.08,0.05,0.55+Math.random()*0.08),roughness:1}));
      // orient
      const ang = Math.atan2(bz-az, bx-ax);
      b.position.set(x, -0.35+bh/2, z);
      b.rotation.y = -ang;
      b.castShadow=true; b.receiveShadow=true;
      padGroup.add(b);
    }
  }
  blockRow(-W/2, -D/2,  W/2, -D/2);
  blockRow( W/2, -D/2,  W/2,  D/2);
  blockRow( W/2,  D/2, -W/2,  D/2);
  blockRow(-W/2,  D/2, -W/2, -D/2);
}
makePad();

/* =============================================================
   BUILDING — 7단계 콘텐츠
   건물 좌표계: 중심 원점. 장축(8m)=남북(+Z=남). 동쪽(+X)이 정면.
   완공 시 다락 증축이 남쪽(+Z)에 3.0m 길이로 붙음.
   ============================================================= */
const bGroup = new THREE.Group(); scene.add(bGroup);
const mats = {
  form:    new THREE.MeshStandardMaterial({color:0x6b5436, roughness:.9}),
  rebar:   new THREE.MeshStandardMaterial({color:0x9f7a4a, roughness:.5, metalness:.3}),
  conc:    new THREE.MeshStandardMaterial({color:0xcac5b5, roughness:.95}),
  steel:   new THREE.MeshStandardMaterial({color:0xd0d4d7, roughness:.4, metalness:.6}),
  pir:     new THREE.MeshStandardMaterial({color:0xf3ead0, roughness:.8}),
  roof:    new THREE.MeshStandardMaterial({color:0x403a30, roughness:.7, metalness:.2}),
  glass:   new THREE.MeshPhysicalMaterial({color:0xaccfe6, roughness:.1, transmission:.8, transparent:true, opacity:.55}),
  frame:   new THREE.MeshStandardMaterial({color:0x2a2a2a, roughness:.5}),
  door:    new THREE.MeshStandardMaterial({color:0x5a3a1a, roughness:.6}),
  wood:    new THREE.MeshStandardMaterial({color:0x8a5a3b, roughness:.7}),
};
// stage containers
const sg = {}; // stage-specific groups
for(const k of ['empty','formwork','pour','frame1','frame2','clad','finish']) {
  sg[k] = new THREE.Group(); bGroup.add(sg[k]);
}

const B = SITE.building;
const PAD_TOP = 0.15; // top of pad slab

function buildFormwork(g){
  // Wood/plywood form around 8×4.5 perimeter, interior rebar grid
  const W=B.w, D=B.d, t=0.05, h=0.5;
  function wall(ax,az,bx,bz){
    const len=Math.hypot(bx-ax,bz-az);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, t), mats.form);
    m.position.set((ax+bx)/2, PAD_TOP+h/2, (az+bz)/2);
    m.rotation.y = -Math.atan2(bz-az, bx-ax);
    m.castShadow=true; m.receiveShadow=true; g.add(m);
  }
  wall(-W/2,-D/2, W/2,-D/2);
  wall( W/2,-D/2, W/2, D/2);
  wall( W/2, D/2,-W/2, D/2);
  wall(-W/2, D/2,-W/2,-D/2);
  // rebar mesh
  const rebarMat = mats.rebar;
  for(let x=-W/2+0.3; x<W/2; x+=0.4){
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,D-0.2,6), rebarMat);
    r.rotation.x=Math.PI/2; r.position.set(x, PAD_TOP+0.08, 0); g.add(r);
  }
  for(let z=-D/2+0.3; z<D/2; z+=0.4){
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,W-0.2,6), rebarMat);
    r.rotation.z=Math.PI/2; r.position.set(0, PAD_TOP+0.12, z); g.add(r);
  }
  // some scattered forms
  const brick = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.2,0.3), mats.conc);
  brick.position.set(W/2+0.6, PAD_TOP+0.1, D/2-0.3); g.add(brick);
}
function buildPour(g){
  // Full concrete slab on top of pad
  const slab = new THREE.Mesh(new THREE.BoxGeometry(B.w, 0.25, B.d), mats.conc);
  slab.position.set(0, PAD_TOP+0.125, 0); slab.castShadow=slab.receiveShadow=true; g.add(slab);
  // small lip around (스팬덱 흔적)
  const lipMat = new THREE.MeshStandardMaterial({color:0xa39b86, roughness:.9});
  const lip = new THREE.Mesh(new THREE.BoxGeometry(B.w+0.1, 0.05, B.d+0.1), lipMat);
  lip.position.set(0, PAD_TOP+0.26, 0); g.add(lip);
}
function buildFrame1(g){
  // 1F light steel frame — columns at corners + mid, beams
  const H = B.h1;
  const cs = [
    [-B.w/2,-B.d/2],[0,-B.d/2],[B.w/2,-B.d/2],
    [-B.w/2, B.d/2],[0, B.d/2],[B.w/2, B.d/2],
    [-B.w/2, 0],[B.w/2,0],
  ];
  for(const [x,z] of cs){
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.08, H, 0.08), mats.steel);
    col.position.set(x, PAD_TOP+0.25+H/2, z); col.castShadow=true; g.add(col);
  }
  // perimeter top beams
  function beam(ax,az,bx,bz,y){
    const len=Math.hypot(bx-ax,bz-az);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.1, 0.08), mats.steel);
    m.position.set((ax+bx)/2, y, (az+bz)/2);
    m.rotation.y = -Math.atan2(bz-az, bx-ax); m.castShadow=true; g.add(m);
  }
  const yTop = PAD_TOP+0.25+H;
  beam(-B.w/2,-B.d/2, B.w/2,-B.d/2, yTop);
  beam(-B.w/2, B.d/2, B.w/2, B.d/2, yTop);
  beam(-B.w/2,-B.d/2,-B.w/2, B.d/2, yTop);
  beam( B.w/2,-B.d/2, B.w/2, B.d/2, yTop);
  // floor joists
  for(let x=-B.w/2+0.4; x<B.w/2; x+=0.4){
    const j = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.1,B.d), mats.steel);
    j.position.set(x, PAD_TOP+0.3, 0); g.add(j);
  }
}
function buildFrame2(g){
  // Attic frame + roof trusses on top of frame1
  const yTop = PAD_TOP+0.25+B.h1;
  const H2 = B.hAtic + B.roofRise;
  // attic columns at corners
  const cs = [
    [-B.w/2,-B.d/2],[B.w/2,-B.d/2],
    [-B.w/2, B.d/2],[B.w/2, B.d/2],
    [0,-B.d/2],[0,B.d/2]
  ];
  for(const [x,z] of cs){
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.08, B.hAtic, 0.08), mats.steel);
    col.position.set(x, yTop+B.hAtic/2, z); col.castShadow=true; g.add(col);
  }
  // ridge beam (east high)
  const ridgeY = yTop+B.hAtic+B.roofRise;
  const parY = yTop+B.hAtic;
  function beam(ax,ay,az,bx,by,bz){
    const dx=bx-ax, dy=by-ay, dz=bz-az;
    const len=Math.hypot(dx,dy,dz);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.08, 0.06), mats.steel);
    m.position.set((ax+bx)/2,(ay+by)/2,(az+bz)/2);
    const yaw = Math.atan2(-dz, dx);
    const pitch = Math.asin(dy/len);
    m.rotation.y = yaw; m.rotation.z = pitch;
    m.castShadow=true; g.add(m);
  }
  // rafters along N-S at several intervals: from west low (parY) to east high (ridgeY)
  for(let z=-B.d/2; z<=B.d/2; z+=0.9){
    beam(-B.w/2, parY, z, B.w/2, ridgeY, z);
  }
  // ridge horizontal
  beam(B.w/2, ridgeY, -B.d/2, B.w/2, ridgeY, B.d/2);
  beam(-B.w/2, parY, -B.d/2, -B.w/2, parY, B.d/2);
  // cross ties
  for(let z=-B.d/2+0.3; z<=B.d/2; z+=1.2){
    beam(-B.w/2, parY, z, B.w/2, parY, z);
  }
}

}
function buildFinish(g){
  // Final: walls + roof + windows/doors + attic add (3×3.3)
  const totalH = B.h1 + B.hAtic;
  const yBase = PAD_TOP+0.25;

  // Function: wall with openings
  function wall(ax,az,bx,bz,h, openings=[]){
    const len=Math.hypot(bx-ax,bz-az);
    const ang = -Math.atan2(bz-az, bx-ax);
    // Build segments
    let xs=[0,len];
    for(const o of openings){ xs.push(o.p0,o.p1); }
    xs = [...new Set(xs.filter(v=>v>=0&&v<=len))].sort((a,b)=>a-b);
    const grp = new THREE.Group();
    for(let i=0;i<xs.length-1;i++){
      const a=xs[i], b=xs[i+1], mid=(a+b)/2;
      const op = openings.find(o=>mid>=o.p0 && mid<=o.p1);
      if(op){
        if(op.sill>0){
          const s = new THREE.Mesh(new THREE.BoxGeometry(b-a, op.sill, 0.08), mats.pir);
          s.position.set(mid, op.sill/2, 0); grp.add(s);
        }
        if(op.top<h){
          const s = new THREE.Mesh(new THREE.BoxGeometry(b-a, h-op.top, 0.08), mats.pir);
          s.position.set(mid, (h+op.top)/2, 0); grp.add(s);
        }
        if(op.kind==='window'){
          const gw = new THREE.Mesh(new THREE.BoxGeometry(b-a-0.04, op.top-op.sill, 0.02), mats.glass);
          gw.position.set(mid, (op.sill+op.top)/2, 0); grp.add(gw);
          const fr = new THREE.Mesh(new THREE.BoxGeometry(b-a, 0.04, 0.06), mats.frame);
          fr.position.set(mid, op.sill, 0); grp.add(fr);
          const fr2=fr.clone(); fr2.position.y=op.top; grp.add(fr2);
        } else {
          const d = new THREE.Mesh(new THREE.BoxGeometry(b-a-0.02, op.top-op.sill, 0.05), mats.door);
          d.position.set(mid, (op.sill+op.top)/2, 0); grp.add(d);
        }
      } else {
        const s = new THREE.Mesh(new THREE.BoxGeometry(b-a, h, 0.08), mats.pir);
        s.position.set(mid, h/2, 0); grp.add(s);
      }
    }
    grp.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});
    grp.position.set(ax, yBase, az);
    grp.rotation.y = ang;
    return grp;
  }
  // East (front) wall: big window + door + room window
  g.add(wall(B.w/2,-B.d/2, B.w/2, B.d/2, totalH, [
    {p0:0.5, p1:2.3, sill:0.9, top:2.1, kind:'window'},
    {p0:3.0, p1:3.9, sill:0.0, top:2.1, kind:'door'},
    {p0:5.0, p1:6.4, sill:0.9, top:2.1, kind:'window'},
  ]));
  // West wall: small windows
  g.add(wall(-B.w/2, B.d/2, -B.w/2, -B.d/2, totalH, [
    {p0:1.0, p1:2.0, sill:1.1, top:2.1, kind:'window'},
    {p0:5.5, p1:6.5, sill:1.1, top:2.1, kind:'window'},
  ]));
  // North wall: back door (사용자 지시)
  g.add(wall(-B.w/2, B.d/2, B.w/2, B.d/2, totalH, [
    {p0:0.3, p1:1.2, sill:0.0, top:2.1, kind:'door'},
    {p0:2.9, p1:3.6, sill:1.5, top:2.1, kind:'window'},
  ]));
  // South wall: attic add doorway
  g.add(wall(B.w/2,-B.d/2, -B.w/2,-B.d/2, totalH, [
    {p0:3.2, p1:4.1, sill:0.0, top:2.1, kind:'door'},
  ]));

  // Attic room (addition 3.0 × 3.3) attached to south side at upper story
  const atW = SITE.atticAdd.w, atD = SITE.atticAdd.d;
  const atY = yBase + B.h1;
  const at = new THREE.Group();
  const atMat = mats.pir;
  // walls (south ext)
  function abWall(ax,az,bx,bz,h){
    const len=Math.hypot(bx-ax,bz-az);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, 0.08), atMat);
    m.position.set((ax+bx)/2, atY+h/2, (az+bz)/2);
    m.rotation.y=-Math.atan2(bz-az,bx-ax); m.castShadow=true; m.receiveShadow=true; at.add(m);
  }
  const x0 = -atW/2, x1 = atW/2;
  const z0 = -B.d/2 - atD, z1 = -B.d/2;
  abWall(x0,z0, x1,z0, B.hAtic);
  abWall(x0,z0, x0,z1, B.hAtic);
  abWall(x1,z0, x1,z1, B.hAtic);
  // floor
  const atF = new THREE.Mesh(new THREE.BoxGeometry(atW, 0.08, atD), mats.wood);
  atF.position.set(0, atY+0.04, (z0+z1)/2); atF.receiveShadow=true; at.add(atF);
  // small window
  const win = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.03), mats.glass);
  win.position.set(0, atY+1.0, z0+0.05); at.add(win);
  g.add(at);
}

function buildRoof(stage){
  const roof = new THREE.Group();
  if(stage<4) return roof;
  const yTop = PAD_TOP+0.25+B.h1;
  const parY = yTop+B.hAtic;
  const ridgeY = parY+B.roofRise;
  // frame (always visible from stage 4)
  // (already in frame2)
  if(stage>=5){
    // sheet metal roof panel (monopitch)
    const span = Math.hypot(B.w, B.roofRise);
    const geo = new THREE.PlaneGeometry(span+0.6, B.d+0.6);
    const mesh = new THREE.Mesh(geo, mats.roof);
    const tilt = Math.atan2(B.roofRise, B.w);
    mesh.rotation.x = -Math.PI/2;
    mesh.rotation.z = -tilt;
    // position center
    mesh.position.set(0, (parY+ridgeY)/2, 0);
    mesh.position.x = 0;
    // compute height: center is average between west edge y=parY, east y=ridgeY → (parY+ridgeY)/2
    mesh.castShadow=mesh.receiveShadow=true;
    roof.add(mesh);
    // ridge cap
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.08, B.d+0.6),
      new THREE.MeshStandardMaterial({color:0x2a2622, roughness:.6}));
    cap.position.set(B.w/2+0.1, ridgeY+0.05, 0);
    roof.add(cap);
    // gutter west
    const gut = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, B.d+0.6),
      new THREE.MeshStandardMaterial({color:0x7a6a5a, roughness:.6}));
    gut.position.set(-B.w/2-0.1, parY+0.0, 0);
    roof.add(gut);
  }
  // attic add roof (small flat)
  if(stage>=6){
    const atW=SITE.atticAdd.w, atD=SITE.atticAdd.d;
    const r = new THREE.Mesh(new THREE.BoxGeometry(atW+0.3, 0.06, atD+0.3), mats.roof);
    r.position.set(0, yTop+B.hAtic+0.03, -B.d/2 - atD/2);
    r.castShadow=r.receiveShadow=true;
    roof.add(r);
  }
  return roof;
}

function tree(kind){
  const g = new THREE.Group();
  const palette = {
    yew:    {trunk:0x5a3a28, leaf:0x2a4a2a, scale:0.9},
    sansu:  {trunk:0x7a5a3a, leaf:0xe3b84a, scale:1.3},   // 산수유 노란꽃
    lilac:  {trunk:0x6a4a30, leaf:0xa07aa8, scale:1.1},
    bipa:   {trunk:0x7a5a3a, leaf:0x4a6a3a, scale:1.4},
    fig:    {trunk:0x8a6a4a, leaf:0x5a7a4a, scale:1.2},
    cherry: {trunk:0x5a3a2a, leaf:0xf2b8c6, scale:1.4},
    tea:    {trunk:0x4a3a2a, leaf:0x3a5a3a, scale:0.6},
  };
  const p = palette[kind] || palette.yew;
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.06*p.scale,0.08*p.scale,p.scale,6),
    new THREE.MeshStandardMaterial({color:p.trunk, roughness:.9}));
  tr.position.y=p.scale/2; tr.castShadow=true; g.add(tr);
  const canopy = new THREE.Mesh(
    kind==='tea'?new THREE.SphereGeometry(0.4,8,6):new THREE.IcosahedronGeometry(0.6*p.scale, 1),
    new THREE.MeshStandardMaterial({color:p.leaf, roughness:.95, flatShading:true}));
  canopy.position.y = p.scale + 0.3;
  canopy.castShadow=true; g.add(canopy);
  return g;
}

function updateStages(){
  const s = parseFloat(stageRange.value);
  // Determine which groups are visible, with partial animation at boundaries
  // Stages: 0 empty, 1 formwork+pad, 2 pour, 3 frame1, 4 frame2, 5 clad, 6 finish
  // Progressive visibility (keep previous stages)
  const vis = {
    formwork: s>=1 && s<2.2,   // formwork disappears once we have pour
    pour:     s>=2 || s>=2,
    frame1:   s>=3,
    frame2:   s>=4,
    clad:     s>=5,
    finish:   s>=6-0.1,
  };
  // adjust: once poured, formwork gone
  if(s>=2.2) vis.formwork=false;
  // scale 'rising' effect for frame1 (3..4)
  sg.formwork.visible = vis.formwork;
  sg.pour.visible = s>=2;
  // frame1 rising animation
  sg.frame1.visible = s>=3;
  const f1 = Math.min(1, Math.max(0, s-3));
  sg.frame1.scale.y = f1;
  // frame2 rising
  sg.frame2.visible = s>=4;
  const f2 = Math.min(1, Math.max(0, s-4));
  sg.frame2.scale.y = f2;
  // clad fade in 5..5.5
  sg.clad.visible = s>=5 && s<6;
  const c = Math.min(1, Math.max(0, s-5));
  sg.clad.children.forEach(m=>{ if(m.material){ m.material.transparent=true; m.material.opacity=0.4+0.6*c; } });
  // finish fade in 6
  sg.finish.visible = s>=6-0.05;

  // Rebuild roof
  bGroup.remove(roofHolder);
  roofHolder = buildRoof(Math.floor(s));
  bGroup.add(roofHolder);

  // Landscape visible from stage 2 onward (gradual)
  landGroup.visible = (document.getElementById('landToggle').classList.contains('on')) && s>=1;
  landGroup.children.forEach((c,i)=>{
    c.visible = s>=2 + (i%4)*0.1 || (i<2);  // monument first
  });
  if(s<6){
    // 가구/최종 조경 간소화
  }

  // description + progress
  const idx = Math.max(0, Math.min(6, Math.round(s)));
  stageList.querySelectorAll('.st').forEach((el,i)=>el.classList.toggle('on', i===idx));
  document.getElementById('stageDesc').textContent = STAGES[idx].desc;
  document.querySelector('#progress>div').style.width = (s/6*100)+'%';
}

/* Time of day */
const sr=document.getElementById('sunRange');
const sl=document.getElementById('sunLbl');
sr.addEventListener('input', ()=>{
  const h=parseFloat(sr.value);
  sl.textContent = h.toFixed(1).replace('.0','')+':00';
  const t=(h-6)/14; const a=Math.PI*t;
  sun.position.set(Math.cos(a-Math.PI/2)*30, Math.max(2,Math.sin(a)*35), Math.sin(a-Math.PI/2)*18);
  const dim = Math.sin(Math.PI*t);
  sun.intensity = 0.2 + 1.5*Math.max(0.05,dim);
  const warm = h<8||h>17.5 ? 0xffb080 : 0xffeecc;
  sun.color.setHex(warm);
  let bg;
  if(h<7) bg=0x7a5a7b;
  else if(h<9) bg=0xe9c2a2;
  else if(h<17) bg=0xb6cfe4;
  else if(h<18.5) bg=0xf2a06a;
  else if(h<19.5) bg=0x8a5a7a;
  else bg=0x2a2a4a;
  scene.background.setHex(bg); scene.fog.color.setHex(bg);
  hemi.intensity = 0.3 + 0.4*Math.max(0.1,dim);
});
sr.dispatchEvent(new Event('input'));

/* Right panel options */
document.getElementById('shadows').addEventListener('change',e=>{
  renderer.shadowMap.enabled=e.target.checked;
  scene.traverse(o=>{if(o.isMesh){o.castShadow = o.castShadow && e.target.checked; o.receiveShadow=o.receiveShadow && e.target.checked;}});
});
document.getElementById('birds').addEventListener('change',e=>{ terrainGroup.visible=e.target.checked; });
document.getElementById('landToggle').addEventListener('click',function(){
  this.classList.toggle('on'); landGroup.visible = this.classList.contains('on'); updateStages();
});
document.getElementById('roofT').addEventListener('click',function(){ this.classList.toggle('on'); roofHolder.visible = this.classList.contains('on'); });

/* Cinematic auto play */
let play=false, playT=0;
document.getElementById('playBtn').addEventListener('click', function(){
  play=!play; this.classList.toggle('on', play);
  this.textContent = play?'■ 멈춤':'▶ 시네마';
  if(play) toast('시네마 모드: 카메라 궤도 + 단계 순차 진행');
});

/* First-person view */
const pl = new PointerLockControls(camera, renderer.domElement);
let walk=false; const walkKeys={};
window.addEventListener('keydown',e=>{walkKeys[e.code]=true;});
window.addEventListener('keyup',e=>{walkKeys[e.code]=false;});
document.getElementById('viewBtn').addEventListener('click', function(){
  walk=!walk; this.classList.toggle('on', walk);
  this.textContent = walk?'조감':'1인칭';
  if(walk){
    orbit.enabled=false;
    camera.position.set(8, 1.65, 2);
    camera.lookAt(0, 1.6, 0);
    pl.lock();
    toast('1인칭: WASD 이동 · 마우스 시선 · ESC 해제');
  } else {
    pl.unlock(); orbit.enabled=true;
    camera.position.set(18,10,18); orbit.target.set(0,1,0);
  }
});

/* Resize + loop */
function fit(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h, false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit); fit();

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1800);
}

const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=clock.getDelta();
  if(walk){
    const sp=3*dt; const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0));
    if(walkKeys['KeyW']) camera.position.addScaledVector(fwd, sp);
    if(walkKeys['KeyS']) camera.position.addScaledVector(fwd, -sp);
    if(walkKeys['KeyA']) camera.position.addScaledVector(right, -sp);
    if(walkKeys['KeyD']) camera.position.addScaledVector(right, sp);
    camera.position.y=1.65;
  } else {
    orbit.update();
  }
  if(play){
    playT += dt;
    // advance stage 0..6 across 30s loop
    const T=38;
    const s = (playT % T) / T * 6;
    stageRange.value = s; setStage(s,false);
    // orbit camera
    const ang = playT*0.2;
    const r = 22;
    camera.position.set(Math.cos(ang)*r, 9 + Math.sin(playT*0.3)*2, Math.sin(ang)*r);
    orbit.target.set(0, 2, 0);
    camera.lookAt(orbit.target);
  }
  renderer.render(scene, camera);
}
updateStages(); tick();
</script>
</body></html>
